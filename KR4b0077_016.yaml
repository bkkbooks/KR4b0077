body:
  text: 卷十六周譙國公夫人步陸孤氏墓志銘夫人諱某字某本姓陸吳郡人也天子拓境百越來庭丞相勒兵三江席卷高祖載為劉義真長史留鎮關中既沒赫連因即仕魏臨終誡其子孫曰樂操土風不忘本也言念爾祖無違此心祖政驃騎大將軍儀同三司恆州刺史父通柱國大將軍大司馬文安公匡贊經綸參謀揖讓名高廣武功重長平夫人七德含章四星連曜敬愛天情言容禮典九日登高作銘秋菊三元告始或頌春椒年十有四娉于譙國友其琴瑟愈恭節儉之心伐其條枚實秉憂勤之德鄴地登高之錦自濯江波平陽採桑之津躬勞蠶月天和元年册拜譙國夫人東武亭之妻既稱有秩南城侯之婦還聞受封柱國殿下以名華分照增城峻土揚旌棘道問政邛都白狼之溪途艱黃牛之坂荔枝之山地險莆萄之國夫人別離親戚關河重阻夷歌一曲未足消憂猿鳴三聲沾衣無已是以天厲之疾遂成沉痼玉瀝難開金膏實遠建德元年七月九日薨于成都私第春秋二十有一即以其年十一月二十二日歸葬長安之北原詔贈譙國夫人禮也夫人奉上盡忠事親竭孝進賢有序逮下有恩及乎將掩玄泉言從深夜內外姻親俱深節女之悲三五小星實有中饋之戀殿下傷神秋月掩淚長松周季直之留書更深冥漠潘安仁之詞藻徒增哀怨豈言西河女子獨見銀臺東海婦人先逢金闕銘曰芟陵反旆椒山止戈金精據嶺昌閣凌波西遊卿相東裂山河華亭冠冕穀水絃歌震維徙族燕垂從宦塞入飛狐關連鳴雁策預登阜功參臨澗寶鼎留銘雕戈餘贊應圖淑令秉禮言歸魚軒馮軾澤雉文衣明月照鏡仙石支機行雲細起回雪輕飛北降帝子南麾蜀守若水既開靈山已鏤月峽猿啼江神牛鬭星機北轉日轡西回陽泉伏氣陰律沉灰鶴辭吳市鳳去秦臺神光離合燈影徘徊雙流反葬百兩回旌少女離位夫人去城帷堂野設帳殿郊營山川奇事風月無情搖落丘隴荒涼封域樹樹秋聲山山寒色草短逾平松長轉直節墳方固園陵永植文苑英華九百六十三周趙國公夫人紇豆陵氏墓志銘周趙國公夫人紇豆陵氏墓志銘夫人諱含生本姓竇扶風平陵人魏其朝議列侯則莫能抗禮安豐奉圖功臣則咸推上席外戚列傳既聞建武之書仲山古鼎或表單于之獻祖略少保建昌郡公父熾柱國大將軍大宗伯鄧國公孟津大誓常預同德之臣咸陽違約克贊先登之主並得位入六府功參八柄夫人有文在手有象應圖榮曜夙彰徽華早茂肅恭以禮受教于公宮言容以德有聞于師氏及乎進賢君子內主邯鄲琴瑟在堂輜軿是服長久於節不無秋菊之銘履端於始或有椒花之頌豈止莊姬掩口楚相知慚定薑問兆齊兵不入武成二年册拜趙國公夫人漢王聞立義之婦邑以延鄉齊侯見有禮之妻封之石窖異代同榮差無慚德柱國殿下居若木之一枝在天潢之別派揚旌玉壘驅傳銅陵南通向日之民東被無雷之國夫人從政月峽贊德雲門錦濯江波還臨織室山明石鏡即對粧樓既而玉律頻移金爐不變胡香四兩嗟西域之使稀靈草一枝恨瓊田之路絶天和五年四月二十二日薨於成都之錦城春秋二十孫子荊之傷逝怨起秋風潘安仁之悼亡悲深長簟況復仙臺永別無復簫聲傅母長歸唯留琴曲七年二月日歸葬於長安之洪瀆原詔贈趙國夫人禮也雲雨去來既留連於楚后光陰離合實惆悵於陳王銘曰河西斗絶觀津孤起章武賢臣安豐賢仕木樓千仞金山萬里紹慶邢姨基昌宋子施襟趙北侍母秦南紘綖禮數厭狄騑驂義超江汜仁流葛覃玉筐迎燕金籠助蠶敬愛純深端莊淑問有光國史無形喜慍舉案外恭停機下訓馨馥於蘭年華於蕣風雨消散神靈離絶嫠女還星姮娥歸月左楹夕奠高堂朝發空揚凌波更無回雪下平曰隰高平曰原西臨火井北望塞門猶垂雉服尚駕魚軒平原忽矣天道何言山回地市路沒滕城松悲鶴去草亂螢生新雲別起舊月孤明賢墳永式節隴常貞文苑英華九百六十三周安昌公夫人鄭氏墓志銘夫人諱某滎陽陽武人也周宣王之母弟俾侯于鄭鄭莊公之重世卿士於周以國為族自茲而始祖瓊太常恭侯父穆司空貞公西京賦詩奉常參柏梁之宴東都言讖司空為武衛之官籍連帝譜既同盤石門稱通德無廢儒林夫人禮義閨門端莊令淑采采芣苡萋萋葛覃及乎作配君子言事舅姑下氣怡聲承巾奉帚親戚惟禮閨闈以睦保定二年册拜滎陽郡君序戚升榮從夫有秩豈惟立義之婦邑以延鄉有禮之妻封之石窖大將軍沉犀二江夫人聞猿三峽明月靈關之阻秋風蜀道之難掩以瑤華先從春露天和十八年五月二十日薨于成都春秋三十有六詔贈安昌國夫人禮也即以其年十一月十六日歸葬於咸陽之白起原遂使山回反壤先封節婦之陵日入虞淵實掩賢姬之墓嗚呼哀哉乃為銘曰天河開國分畿置政地有十城人居九命疇昔之邑今茲成姓識履傳風參輿留慶三星在戶百兩言歸虔恭內政榮曜中闈承姑奉盥訓子停機桑園蠶績錦室鸞飛珩璜節步藻火文衣巴水幽咽猿鳴斷絶月落珠傷春枯桂折趙瑟長辭秦簫永別貞姬掩隧節女封墳洛濱無月荊臺失雲鳥悲傷聽松聲愴聞千年遂古百代餘芬文苑英華九百六十三周大將軍隴東郡公侯莫陳君夫人竇氏墓志銘夫人諱某扶風平陵人也章武開國名高外戚之右安豐入朝位在功臣之上祖以孝昌之始主諾淮陽父以正光之初褰帷海岱夫人生於禮義之門宗於針誡之德虔恭惟禮令淑惟儀及乎百兩言歸三星在戶針盥始事條枚是則有子從政猶無逸豫之心有夫出征自識山陵之兆大統十六年册授永安郡君婦以夫尊親由子貴朝章家慶兼而有之保定二年改授隴國夫人車服禮數袿褵典則有美河魴足光彤史既而風霜所及灰琯遂侵與善何言至於大漸天和六年四月七日薨春秋六十有六即以其年十月十日遷葬於咸陽萬年縣之杜原山形起伏既符白鶴之祥地勢風煙乃合青烏之氣銘曰觀津世族平陵豪姓四侯登仕三君從政白狼建功丹蛇襲慶漢之廣矣先聞淑令君子朝端賢才家政簪珥以禮軒車以命讓果成廉推珠止競百年超忽千金莫恃室謝賢夫庭辭貴子歸鞍輟露采蘩廢祀室委眠蠶衣留畫雉雲垂下澤日掩高舂空帷舊館虛幕新封山回廣柳路沒深松遊魂幾變大人何從文苑英華九百六十三周冠軍公夫人烏石蘭氏墓志銘夫人諱某樂陵人也晉司徒樂陵公苞後子孫就封因即家焉扶風舊城猶存鐵市河南故墅尚餘金谷或寓燕陲仍仕代郡祖行代郡尹父魏司空蘭陵郡公司空佐命魏朝少傅丞疑周室並為大族俱蒙賜姓秦晉匹也是曰通家夫人年十七歸于宇文氏淑令端莊含章貞吉針盥惟儀閨闈已正某年除金鄉郡君某年改授冠軍國夫人四德小君宜其家室三事內主翻辭贊務以保定五年四月遘疾薨時年四十有四即以其年某月日歸葬于京兆之某原人世風煙山川超忽陵陂青麥儻逢貞女之墳隴首白楊或表賢姬之墓乃為銘曰三星麗天五嶽鎮地禮有其秩人居其位燕趙多奇山川雄氣挺茲令淑惟此含章玉生庭照蘭開室香邢姨褧服宋子河魴百兩言歸九儀從聘褕瞿七彩軒車六命鼎室辭親槐廷贊政世為閲水人成大夢回帳山門移燈泉洞金棗長含銀蠶永送香填柏槨路閉松城悲鸞獨影雄劍孤鳴留連趙瑟悽愴秦笙文苑英華百六十三周太傅鄭國公夫人鄭氏墓志銘夫人諱某滎陽開封縣遠里人也七子賦詩足光賓客三卿從政實靜諸侯驂乘則晉后停輿來朝則漢君識履華胄蟬聯無虛史籍祖那秦州別駕父茂伯撫軍將軍涼州刺史伯陽縣侯夫人令淑早聞芝蘭獨茂既容既德言告言歸悌實溫凊恭惟針盥太傅弼諧周室股肱攸寄夫人輔佐君子勤勞是司琴瑟既友條枚無伐故得用之邦國成之孝敬某年月日封鄭國夫人褕翟既加紘綖是務夫有安世之貴躬服浣濯子有文伯之尊無忘機杼表裏惟安閨闈且正醫門有疾藥對無徵天和三年三月二十日薨葬於長安之石安原世子某兄弟並勗慈訓咸尊母儀霜露深悲寒泉增慟銘曰居德圃田當官教府置騎賓來開黌學聚福履家室賢才踵武棠棣之華螽斯之羽人倫七德風化二南采采芣苡萋萋葛覃節行聲玉副加珈篸柳園秉杼桑津浴蠶春秋超忽零落無時家亡淑女國喪賢姬香墳永送舞鶴長辭山深月暗風急松悲千年開閉將驗靈龜文苑英華九百六十三後魏驃騎將軍荊州刺史賀拔夫人元氏墓志銘在河之洲聞君子之配德言采其蕨見夫人之有禮用之風化人倫厚焉夫人諱安字大羅河南洛陽人也祖某京兆康王父昭驃騎大將軍開府儀同三司録尚書司州牧汝陽郡王跗萼雄圖階基霸迹公卿之室將相維國維家夫人能修法度無思犯禮恭儉節用憂在進賢大統五年封樂安公主歸于賀拔氏時年十三思事憂勤化成婦德彤管載暉棠棣早茂及乎謳歌有歸褕翟降等輔佐君子猶安其室周天和元年乃封章武郡君霜露不居風煙飄忽遘疾纍旬奄捐館舍以周天和四年二月二十六日薨于長安萬年里春秋五十有二詔贈頓丘國夫人禮也即以其年三月二十日歸葬于咸陽之石安原既異乘鸞翻然永去雖非舞鶴即掩泉門欲志佳城乃為銘曰逖矣雄謀悠哉霸轍九服潛運三川中竭卿相連鑣賢才舞絶琬琰令淑施襟結褵方之棠棣譬以螽斯既全婦德還稱母儀逝水滔滔危途冉冉問藥無對蒸丹不驗狄服空陳絃機虛掩郭門路轉哀挽途窮隴深結霧松高聚風春蘭秋菊唯始唯終文苑英華九百六十三周大都督陽林伯長孫瑕夫人羅氏墓志銘周大都督陽林伯長孫瑕夫人羅氏墓志銘夫人諱某恆州代郡太平縣人祖某父協周大將軍南陽郡公夫人資於事親躬奉訓誡教于宗室足聞詩禮及乎言歸肅恭如事蘋藻維敬紘綖是勤內位克諧中閨以睦年齡不競霜露先侵更無延壽之杯遂闕長生之枕以周天和四年二月八日薨于長安之洪固鄉時年二十有三其年某月日葬於萬年縣之壽里山非宋國翻為節女之陵地異荊臺遂有賢妃之墓銘曰畢狼建國靈武開都地接天柱山臨寶符人資義烈世表雄圖葛覃維萋棠棣早盛既安淑德爰從配命四教弘宣三星克正霜凋桂苑風落芝田三從闕性五福傷年歸安永絶言告長捐悽切郊野紆回隰原風慘雲愁松悲露泣朗月空嗟傷神何及文苑英華九百六十三周儀同松滋公拓跋競夫人尉遲氏墓志銘周儀同松滋公拓跋競夫人尉遲氏墓志銘夫人諱某河南洛陽人也祖某父太師柱國公魏室喪亂經綸夷阻周朝建國匡贊揖讓圖諜帝系即有內外之親分裂山河仍為舅甥之國夫人容範端莊儀型淑令六義觀德南風有夫人之詩八卦成形東方有少女之位姆母習言公宮教業針盥線纊佩帨茝蘭年十有二出適儀同拓跋競衣其翟服既得宗婦之儀乘其魚軒還從列國之禮標梅三實無闕其時夭桃九華能修其政某年某月册拜回洛縣君母金明公主魏文帝長女春則帝女採桑秋則王姬築館夫人出入主家遨遊戚里濯龍園苑長門宮殿既而膏腴美疢華茂傷年沉痼床帳蒸離寒暑三世之術無逮於醫門百草之本徒窮於藥性建德三年五月七日亡春秋三十昔西河女子值九節之菖蒲東海婦人得三山之芝草無由再遇悲矣如何即以其年十一月十五日葬於京兆之北陵原龜筮告辰丘陵啓奠西臨織女之廟南望湘妃之墳嗚呼哀哉乃為銘曰父曰帝師母曰王姬車服不繫江漢無思是生令淑觀禮敦詩聲超宋子德茂邢姨繼世盛德思賢克舉奠鴈迎門濡蘋實俎奉盥如事移茵即序春冰浴蠶秋機秉杼帝鄉近親帝城近臣濯龍親戚平陽主人金波回月玉樹臨春弄玉鳳皇昌容紫草自此千年無人得道舜華榮曜飄零何早渭水北原平陵故園才通谷口即望寒門吁嗟此地去矣歸魂孟冬十月長松九年親賓掩淚悽愴何言文苑英華九百六十三周驃騎大將軍開府儀同三司冠軍伯柴烈李夫人墓志銘周驃騎大將軍開府儀同三司冠軍伯柴烈李夫人墓志銘夫人諱某隴西狄道人也周有柱史夫子以之猶龍漢有將軍宛城以之輸馬復有西入上書仍為秦國之相東向問計即是韓王之師父宜使持節大將軍南北二華州刺史順陽郡公魏武皇帝之長舅也穰侯魏冉居咸陽之宮曲陽王根借明光之殿語其貴戚差足擬倫論其退謙彼多慚德夫人幼而聰敏早聞令淑彤管有美賢才見稱弄其紙筆懼失諸兄之意剪其齠齡畏傷王母之心年十有一出適驃騎大將軍開府儀同柴烈烈以上將頒朔中台受任軍國忠勤規模繁總夫人輔佐君子言容匡贊增輝三星欽明四德授巾沃盥有謹於事姑斷織停機無忘於訓子保定二年册授大夏縣君既以夫尊又云子貴乃遷順陽改郡君夫人之邑或用鄉名小君之號多從夫秩典册光臨足稱榮寵本有風氣之疾頻年增動略多枕臥飛龜之散遣疾無徵畫龍之符留年不驗以今建德四年三月日薨于館舍春秋四十九即以其年八月日葬於長安之洪瀆原神光離合尚在河湄雲氣徘徊猶歸樓下嗚呼哀哉乃為銘曰上書秦相立功漢將隴水分流秦川遙望秋陸俗勇金行地壯廣武軍中安平河上妻者齊也謂嫁曰歸三星夜照百兩朝飛褕翟有典容禮無違台庭等秩侯服同衣子奉母儀夫聞家政七族承和九閨連慶紛帨恭肅溫凊孝敬杼秉秋成蠶隨春令年華未落電影先過徒食日氣空飲天河星凋玉井月捐金波虞淵落日薤露哀歌寂寞虛奠荒涼象設幽隴龜封重泉蟻結秋色悽愴松聲斷絶百年何幾歸於此別文苑英華九百六十三彭城公夫人爾朱氏墓志銘彭城公夫人爾朱氏墓志銘夫人爾朱氏河南洛陽人也若夫陰山表裏衝北斗之機衡瀚海彌綸直四街之畢昴四時銜火燭龍開照地之光六月摶風大鵬運垂天之翼由是奄有京縣遂荒中土車書禮樂三王之損益可知將相公侯百代之山河不殞祖敞隋儀同三司金紫光祿大夫岐同金申信臨徐七州總管兵部尚書金城郡開國公天列尚書之星地標光祿之寒出身萬里知呂岱之元勳專命一方識劉弘之重寄父休最隋左千牛備身朝散大夫齊王府司馬襲封爵金城公大夫稱伐諸侯胙土淮仙致雨仍攀桂樹之山楚客臨風更入芙蓉之水夫人玉臺貞氣金河仙液蔡中郎之女子早聽色絲謝太傅之閨門先揚麗則彭城公發源殷伯承家漢相山川氣候彰白武於皋繇象緯休徵下蒼龍於曼倩三星照夜佇稽鳴鴈之期七日秉秋坐薦飛皇之兆夫人年甫十八遂歸於我巫山南眺逢暮雨於瑤姬華嶽西臨降明星於玉女動合詩禮言成軌則晨昏展敬事極於移天蘋藻挈誠義申於中饋女郎砧石響明月而思秋風織婦機床聽寒蛩而催絡緯用曹大家之遺訓執宋伯姬之貞節加以心依八覺理會三空遊智刃於檀林泛仙舟於法海幾神獨照默言象而無施空有兼忘束筌蹄而不用人生天地壽非金石銀臺竊藥想奔月而何年金殿煎香思反魂而無日以某年月日終于平康里之私第越上元三年十月二十日合葬于城南之畢原禮也齊侯寢側杜氏階前對文王之畢原用周公之合葬偃松千古長無寡鶴之悲文梓百尋還見雙鴛之集其銘曰合葬非古周公所存死生千載棺椁雙魂野曠風急天寒日昏煙霾杳嶂霧失遙村紀黃絹之碑表對青松之墓門文苑英華九百六十四伯母東平郡夫人李氏墓志銘夫人姓李氏隴西狄道人也自涼武昭王以後一門三公為四海著族國史家諜詳之矣祖充穎後周大將軍滑州刺史流江郡公考玄明皇朝上儀同濟三州刺史成紀縣男出入三朝剖符分竹秦隴河濟之地人到于今稱之天下士大夫知與不知莫不想望其風采夫人生而純深幼而恭敬長而敦睦成而和惠年初及笄甫歸於我執箕帚奉舅姑人不間於其娣姒妾媵之言閨門之內穆如也故宗黨推其令問鄉閭以為美談東平公守清白之基逢太平之日辟命交至聲聞于天制徵尚書郎遷御史中丞出為棣曹恆常四州刺史夫人輔佐君子聿修內政平旦纚笄則有君臣之嚴沃盥饋食則有父子之敬報反而行則有兄弟之道受期必誡則有朋友之信其婦德也如此歷職中外聲名籍甚和其琴瑟正其邦家者夫人與有力焉蓋嘗喟然而言曰古者卿之內子為大帶命婦成祭服社而獻功可不勗哉可不勗哉由是服浣濯之衣躬紡績之事筐筥錡釜之器所以執其勞蘋蘩蘊藻之菜所以明其德非夫博文達禮貞婉聽從者孰能與於此乎及公乞骸告老退歸初服夫人年踰耳順視聽不衰每獻歲發春日南長至群從子弟稱觴上壽者動至數十百未嘗不歡言善誘借以溫顏侃侃焉誾誾焉有孟母之風焉有敬薑之誨焉維永淳元年秋八月旁死魄寢疾彌留終于華陰之望仙里享年八十有一冬十一月一日丙辰遷窆于永豐鄉之平原從先兆也東平公撫存懷舊用痛悼于厥心遠近咸集宗親畢會生榮死哀其此之謂矣是日也皇太子監守長安炯忝為詹事司直不獲就展喪次陪奉靈輀敢薦李顒之文庶同潘嶽之誄嗚呼哀哉乃為銘曰高嶽之上浮雲翔兮函谷之外直氣揚兮建功北狄討戎羌兮受封南鄭家素昌兮于赫祖考為龍光兮牧州典郡佩銀黃兮降生淑質秉禎祥兮苕華菊茂蘭若芳兮我有懿德如圭璋兮求之卜筮鳴鳳皇兮君子至止玉環鏘兮室家好合琴瑟張兮執其麻枲供衣裳兮羞其饋食澄酒漿兮諸姑伯娣穆溫良兮姨姒叔妹歡未央兮公之出牧守四方兮夫人之化德洋洋兮公之告老返維桑兮閨門之內道彌彰兮正月上日南至長兮子孫歡慶各稱觴兮宋公孟母魯季薑兮匪怒伊教由舊章兮方期高舉登紫房兮誰謂不宜掩玄堂兮肅肅松檟鬱成行兮沉沉厚夕終不暘兮文苑英華九百六十四
