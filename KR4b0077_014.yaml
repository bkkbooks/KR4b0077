body:
  text: 卷十四周柱國大將軍紇干弘神道碑周柱國大將軍紇干弘神道碑公諱弘字廣略原州長城縣人也本姓田氏虞賓在位基於揖讓之風鳳皇于飛紹於親賢之國論其繼世之功則狄城有廟序其移家之始則長陵有碑況復高廟上書小車而對漢王聊城祭鳥長岳而驅燕將公以胎教之月歲德在寅載誕之辰星精出昴是以月中生樹童子知言水上浮瓜青衿不戲而受書黃石意在王者之圖揮劍白猿心存霸國之用魏永安中任子都督翻原州城受隴西王節度于時洛邑亂離當途危逼禮樂征伐不出於天子舉賢誅暴實在於強臣太祖文皇帝始創霸功初勤王室秣馬蒐乘誓眾太原公仗劍轅門麤謀當世隨何遠至實釋漢帝之憂許攸夜來即定曹王之業永熙中初迎魏武帝入關封鶉陰縣開國子邑五百戶太祖以自著鐵甲賜公云天下若定還將此甲示寡人白水良劍罷朝而贈陳寵青驪善馬迴軍而賜李忠竝經輿服足為連類大統三年轉帥都督進爵為公十四年授使持節都督原州諸軍事原州刺史仙人重返更入桂陽之城龍種復歸還尋白沙之路公此衣錦鄉里榮之侍從太祖戰河橋復弘農解華山圍平沙苑陣必有元勳常蒙別賞太祖在同州文武竝集號令云人人如紇干弘盡心天下豈不早定即授車騎大將軍儀同三司前魏元年轉驃騎大將軍開府祈連猶遠即受冠軍之侯沙幕未開元置長平之府梁信州刺史蕭韶寧州刺史譙淹等猶處永安稱兵漁陽公受命中軍迅流下瀨遂得朝發白帝暮宿江陵猿嘯不驚雞鳴即定西平反羌本有漁陽之勇鳳州叛氐又習仇池之氣公推鋒直上白刃交前萬死一決凶徒多潰身被一百餘箭傷肉破骨者九瘡馬被十槊露布甲上朝廷壯焉葛屨糾糾魏有去舊之歌零露瀼瀼周受維新之命乃進爵封鴈門郡公食邑通前二千七百戶保定元年授使持節都督岷州諸軍事岷州刺史隴頭流水延望秦關川上峨眉猶通蜀道公不發私書不燃官燭獸則相負渡江蟲則相銜出境四年拜大將軍餘官如故衛青受詔未入玉門之關竇憲當官猶在燕山之下公之此授差無慚德渾王叛換梗我西疆宕羌首竄藩籬攜貳公受脤於社偏師遠襲揚旍龍涸繫馬甘松二十五王靡旗亂轍七十六柵鶉奔雉竄既蒙用命之賞乃奉旋師之樂天和二年被使南征帶甲百萬軸轤千里江源水起海若乘流船官之城登巢懸爨吳兵習流長驅戰艦風灰箭火倏忽凌城公以白羽麾軍朱絲度水七十餘日始得解衣朝廷以晉剋夏陽先通滅虢之政秦開武遂始問吞韓之謀是以馳傳追公以為仁壽城主齊將段孝先斛律明月出軍定隴以為宜陽之援公背洛水而面熊山陣中軍而疎行首乘機一戰宜陽銜璧增封五百戶進柱國大將軍司勳之冊也建德元年拜大司空二年遷少保姬朝三列少保為前炎正五官冬官為北頻煩寵命是謂賢能三年授使持節都督襄郢昌豐唐蔡六州諸軍事襄州刺史江漢之間不驚雞犬樊襄之下更多冠蓋既而三湘遼遠時遭鵩入五溪卑濕或見鳶飛舊疾增加薨于州鎮天子畫凌烟之閣言念舊臣出平樂之宮實思賢傅有詔贈某官禮也即以四年四月二十五日歸葬于原州高平之鎮山屬國玄甲輕車介士一依霍驃騎之禮衛將軍之葬嗚呼盛哉公入仕四十五年身經一百六戰通中陷刃疾甚曹參刮骨傅藥事多關羽而風神果勇儀表沉雄事親無隱無犯學不專經略觀書籍兵無師古自得縱橫青烏甲乙之占白馬星辰之變九宮推步三門伏起天弧射法太乙營圖竝皆成誦在心若指諸掌虜青犢之兵甚有秘計燒烏巢之米本無遺策西零賊退屈指可知南郡兵迴插標而待常願執金鼓而問吳王橫琱戈而返齊地有志不就忠貞死焉世子恭等孝惟純深居喪過禮對其苫寢則梓樹寒生聞其悲泣則巢禽夜下嗚呼哀哉乃為銘曰天齊水合日觀山連兵強東楚地遠西燕五卿咸正三王竝賢靈龍更起燧象還燃自天之德乃祖乃父維岳降神生申及甫北門梁楝西州雲雨勇讋燕城名題漢柱公始青衿風神世載猛獸不驚家禽能對劍學千門書觀六代有竭忠貞無違敬愛乃數軍實乃握兵符澆沙成壘聚石成圖風雲順逆營陣孤虛靈雨鉦鳴爟火飛狐淮陰受冊車騎登壇公為上將有此同官下江燒楚上地吞韓推功玉案定策珠盤天有三階公承其命國有六卿公從其政台曜偕輝槐庭重映匡贊七德謨猷八柄腹滿精神心開明鏡伏波受脤樓船推轂東道未從南征不復飲丹有井澆泉無菊功存柳林身在樠木移茵反葬提柩山行芻靈隴水哀挽長城山如北邙樹似東平松門石起碑字金生渺渺山河煢煢胤子泣血徒步奔波千里孝水先枯悲雲即起世數存歿哀榮終始文苑英華九百五又略見藝文類聚四十六周柱國大將軍大都督同州刺史爾綿永神道碑周柱國大將軍大都督同州刺史爾綿永神道碑公諱永字永賓東燕遼東郡石城縣零泉里人也本姓段昔者昌意陵居初分若水之姓共叔出奔始有京城之族西河居士蕃魏而卻秦北岳將軍威胡而奉晉其後居於北代則先封遼水備乎史籍可略而言祖援鎮西將軍馮翊太守父儒平東將軍持節恆燕朔三州諸軍事恆州刺史公年裁弱冠即值亂離驅馳關塞之間早有縱橫之志軍陣方圓無勞聚米山川形勢不待披圖魏正光五年入仕解褐殿中將軍孝昌三年加龍驤將軍永平二年授平東將軍都督中埏建義勳謀是先蒙賞倉泉縣開國男食邑一百戶其年淮淝侵軼南鄙徵兵公受脤偏師一月三捷昔張遼奄至縣開國伯食邑五百戶進爵為侯永熙元年授使持節車騎大將軍左光祿魏武帝特詔入仕閣內大都督馬武小心侍蕭王於臥內典韋忠壯陪魏后於宮中于時賊帥元伯破掠城市西自潼函東綿鞏洛京畿大都督請馬七千公曰此賊無他策尋為鳥散止請五百騎應手生擒朝廷賞其謀策百姓喜其除害既而喪亂弘多生民版蕩乘輿西幸宗社北遷公妙識玄象深知曆數乃與昆弟謀為自全斬西中郎將送首關內蒙賞昌平縣開國子食邑三百戶大統元年授使持節都督北徐州刺史平竇軍復弘農戰沙苑河橋公竝預先登身當鋒首謨猷應變備在司勳增邑八百戶通前合二千戶進爵為沃陽縣開國公授南汾州諸軍事南汾州刺史十四年增邑三百戶轉大都督其年授車騎大將軍儀同三司加散騎常侍十六年授驃騎大將軍開府加侍中尋授恆州諸軍事恆州刺史又遷雲州刺史昔軒丘分族異姓者十四人酆邑建侯宗盟者四十國太祖文帝席卷關河三分天下潁川從我竝有鄉里之親新豐故人非無布衣之舊更立九十九姓還存三十六國舊冑還姓爾綿增邑一千戶進爵為廣城郡開國公尋授文州諸軍事文州刺史國家以玉門西拒久勞亭鄣陽關北牧多事風塵武成二年有詔進公都督瓜州諸軍事瓜州刺史是以名馳梓嶺聲振榆關無雷畏威貴霜懷惠保定三年還朝授工部中大夫尋遷軍司馬夏官司武待白露而治兵冬官考工紀玄雲而授職四年增邑三百戶通前合三千九百戶其年授使持節大將軍都督治左八軍總管軍事朝登上將暮會小卒事涉交接觀舋而返天和二年以本官領小司寇三度有星名天獄八卦有坎象刑書公繁不秋荼嚴無夏日民知約法未肯以獄吏為尊吏識刑名無敢以死灰相懼又任左廂第三軍總管仍被敕將兵馬北道教習韓信入關即申軍令陳農受詔仍挍兵書豈直六郡良家五營騎士懸知正正之旗遙識亭亭之氣蒙犯霜露旗鼓驅馳俄而遘疾疹至大漸五年六月十六日薨於賀葛城春秋六十有八將軍死綏三軍行哭都護喪還緣邊追祭九月二十三日靈柩至于京師皇帝臨喪百寮赴弔詔遣使持節車騎大將軍儀同三司賀拔軌監護喪事又遣使持節車騎大將軍儀同三司紇豆陵亮冊贈使持節柱國大將軍同華宜敷丹五州諸軍事同州刺史謚曰恭公其年十一月五日葬于京城南高陽原高司里夫人赫連氏兗州刺史悅之女年十四適爾綿氏冊拜魯城縣君遷清陰郡君又遷廣城國夫人肅恭令淑儀範賢才四德有耀三星增輝三公夫人見於斯矣建德元年十二月亡春秋五十有八二年正月歸於高司之塋劉荊州之墓合葬於襄水之陽衛將軍之陵同穴於廬山之下嗚呼哀哉世子岌使持節儀同大將軍領兵部大夫純孝事親忠貞事國禮義自立聲名有焉銘曰軒臺受氏若水降居西城仲胤北陸寘餘山川雄烈風俗扶疎昔我關塞沿襲干戈時遭拔本世值橫波北封代郡東據遼河地未平一天猶薦瘥我公重光繼文踵武總牧三蕃兼治六輔雅俗觀風都亭待雨不逢問吏無聞桴鼓公以載世挺此令聞孝有三德忠惟一君馬陵釋患聊城解紛兵防滿月戰避迎雲長松都尉細柳將軍既牧淮海且蕃恆代高壁負關長亭穿塞舋鼓司盟吏不能欺兵無敢背玉關遺矩汾海留愛大將受冊公昇其壇六卿咸事公貳其官夷陵燒楚上黨分韓營軍參合挍戰皋蘭年深厲起福過災生上台裂岳次將星傾赤地悲淚白虎哀鳴懸弓靈幕繫馬塞坰煙凝不動泉凍無聲天子愴然追於贈謚禮官賜冊陪陵受地印綬曰策衣衾曰襚玄窆就列黃腸在位自此何世從斯幾春樹為櫪社陵成谷神詎知雲閣名在功臣文苑英華九百五周車騎大將軍賀婁公神道碑周車騎大將軍賀婁公神道碑昔者軒丘命氏初分兄弟之姓若水降居始建諸侯之國自是以官為族因地為宗水派枝分其可知矣公諱慈字元達本姓張清河東武城人也仕於周張仲為孝友謀於晉張彥為賢臣韓有開地則五世強國趙有孟談則三卿不戰祖慶少習邊將憑仗智勇雖復五車竹簡不取博士之名一卷兵書即以將軍自許角端在手必無齊魯之侵蓮花插腰甚得蛟龍之氣為車騎大將軍儀同三司散騎常侍霸城縣開國伯贈河州刺史父璨公子公孫有鎡基於天下良弓良冶有世業於家風書則百家可知劍則千人可敵三槐以鼐鼎象物知其神奸五等以桓珪旆瑞守其宮室君以才望兼而有之終於使持節車騎大將軍儀同三司散騎常侍武定縣開國公贈河州刺史惟公秉山岳之靈受星辰之氣年在髫髮甫就勝衣竹馬來迎已知名于郭伋羊車在道即見賞于王澄豈直童子明經書生說卦而已至如禪河清論秋水高談故以辨折龜林聲馳鹿野國家官族君為首姓起家車騎大將軍儀同三司襲封為公邑合一千六百戶弱冠登朝傳呼甚寵漢魏台鼎故無此比中朝方伯罕有其年大冢宰任總機衡是勤王略惜君忠壯委以爪牙鎮左廂親信出梁州防主華陽西極漢水東流巴濮既寧沉黎即靜保定四年王師北伐以君驍勇被召將兵師下宜陽身登函谷將燒白馬之城以覆烏巢之壘既而中途甚雨未獲圍原軍師聞喪不成侵宋柱國趙王今上之第九弟也文則河間上書武則任城置陣作鎮岷丘揚旍錦水白虎之俗難安黃龍之盟不定以君智略入佐中權天和元年授使持節大都督治柱國總府司錄仍轉司馬餘官封如故相如西喻鏤石於靈山武侯南征浮船於瀘水方之今日彼獨何人九品課工為上之下四年入朝歸事宰旅即受載師大夫將命齊國尋盟出境即用和鄰之儀入國聞喪仍從會葬之禮可使南面此之謂乎尋以本官入治軍正至如渭水兵書存心為志軒丘陣法聚石成圍既得師不疲勞兵無怨讟入陪中禁更領儀同邸客城池門闌戶籍咸資巡警竝用司存帝城近臣公室密戚如逢司隸似畏都官既而孤城鄭嫗不相其年巴水涪翁不醫其疾春秋三十有三奄捐官舍呂子明之疾甚歎軫吳王阮元瑜之長逝悲深魏主有詔贈某官禮也以建德四年三月日歸葬於河州苑川郡之禁山公六郡良家西河鼎族地壯金行人雄塞氣兵書七卷河水浮來射法三篇天弧夜下鋒旗不息刁斗恆驚猶得馬上讀書軍中習禮太史子義善於謀策諸葛公休長於撫馭四代儀同三司七世河州刺史鐘鼎成列冠蓋連陰所謂生為貴臣死為貴神者也但以遊魂久客反葬途遠道阻山長妻孤子幼哀聲滿野愁氣連雲況復松檟飄颻方臨武威之戍丘陵迴遠直對臨洮之城馬援亡於武溪尸柩返於槐里梁鴻死於會計妻子歸於平陵嗚呼哀哉嶇崎遠矣昔者繁昌祠前即有黃金之碣德陽墓下猶傳青石之碑是謂勒功乃為銘曰七葉佐漢五世相韓忠臣入仕孝友當官青城仙洞黃石祠壇臺堪走馬書足迴鸞武定風飆霜城嚴肅竝馳雙傳俱分兩竹重世刺舉連鑣袞服草靡青丘風馳赤谷世不乏賢挺茲上嗣孝有三德忠無二志劍足身挺書堪面試旍節既秉高蟬且珥龜轉印函蛇盤綬笥左右將軍前後常侍繼踵五侯因循三事旍旃九坂艫舳雙流還驅木馬更引金牛江波錦落火井星浮樽酒望帝安歌蜀侯受脤河陽偏師洛浦置陣成皋連旗廣武朝兵減竈夜營多鼓箭起六麋鋒摧九虎倏忽人世俄然今古祟發兩星毉驚二豎遊魂通夢言返舊塋紫泥賜丹黃腸贈行途登石紐路入金城寒關樹直秋塞雲平劍埋合柱書藏鑿楹武侯為廟欒公為社雲蓋低臨霓裳紛下碑枕金龜松橫石馬永矣身世留名華夏文苑英華九百六周上柱國宿國公河州都督普屯威神道碑銘並序周上柱國宿國公河州都督普屯威神道碑銘並序公諱威字某河南洛陽人也舊姓辛隴西人基若水之源纂商丘之冑邑于大亳實定其居封于小辛乃成其姓是以三川披髮辛有得見事之機八卦占爻辛廖有知人之鑒佐治以東都上將魏帝解衣武賢以西國功臣漢王推轂祖大汗渭州刺史考生河州四面總管大都督隴右貴臣河西鼎族公侯踵武岳牧連鑣竝得聲振長榆名雄高柳公秉靈山岳誕載星辰結髮嶷然齠年成德澄波萬頃建標千仞鋒穎既高光芒已遠青衿學劍既為人主所稱童子論兵即佐中軍之策永熙元年入仕蒙授直盪都督太祖文皇帝雪舊君之恥建西伯之功始裂鴻溝初登函谷公擢衣沐髮杖劍轅門撤洗足而相迎下賓階而顧問自此即居帳內仍為直寢授寧遠將軍羽林監白土縣開國伯邑五百戶大統元年從迎大駕進爵為侯增邑三百戶加冠軍將軍散騎常侍轉大都督公善於用兵長於撫御自攻洛陽定弘農戰河橋平沙苑冒刃衝鋒前無橫陣況以弦木六鈞函犀七屬門多懸冑箭必中鞍山積器械谷量牛馬軍吏計功司勳賞策授使持節銀青光祿大夫進爵為公增邑八百戶昔者受律赤符韓信當千里治兵白帝張飛擬萬人比跡今日公之謂也五年授使持節都督揚州諸軍事揚州刺史浮於江海達於淮泗篠簜既敷瑤琨即序十三年授車騎大將軍儀同三司尋遷驃騎大將軍開府仍賜姓普屯即為官族入陪武帳出揔戎韜置府於陽關張旃於瀚海故得上書於漢即用同宗爭長於周還無異姓十六年授鄜州諸軍事鄜州刺史公頻領兩牧風政神明虎去西河梟移東郡河湄瑞氣特表廉平鄜祀神光徧明正直及乎魏終天祿周受惟新明命已遷彝倫或革周元年改授大將軍枹罕郡開國公增邑一千戶軍中受詔非論北伐之功大將登壇無待東歸之策置陣太平開陰晉之道連兵廣武納滎陽之城挍戰丹山移營白壁莫不勇冠三軍名凌五將保定四年授寧州揔管掌其北門既為鄭國所委捍其西鄙無懼秦亭之逼是以築平綱之城衛人拱手戍滎波之澤梁氏寒心朝廷與公有內外之親令公從戚里之貴乃以魏文帝女為公夫人遂得長門之左別開公主之園濯龍之傍便有王姬之館五年被徵入京拜少司馬期於司武以公為魏絳佐於中軍以公為荀首豈直謂之鶉火稱之縉雲而已哉其年被使領兵出西涼州奉迎突厥皇后紀裂繻來卿為君逆稱族而行尊君命也天和元年授柱國拜大司寇楚之柱國方之南火軒之司寇譬以西雲總授於公能官人也建德二年授少傅四年授河州總管都督七州諸軍事即為河州大中正公之桑梓本於此地再為連率頻仍衣錦襄城龍種更反池臺桂陽仙人還歸鄉里故老親賓酣歌相慶安車駟馬天下榮之宣政元年授上柱國更加少傅配于上相即陪玄扈之圖居于京師實有圯橋之策改封宿國公食邑并前五千五百戶射鴻舊圃舞鶴餘城既浮酸棗之河聊對淇園之竹來朝建章則天子降席出遊戚里則群公下階是以行滿天地名聞四海方當光輔五君參謀七政夭厲弗戒薨于所居春秋六十有九柳莊告殯傾社稷之臣鄭僑云亡得諸侯之禮詔贈某官謚某公禮也以今開皇元年七月某日反葬於河州金城郡之苑川鄉山行隴底地入塞原望積石以緣河臨崆峒而下坂玄甲黃腸崎嶇亭鄣及云奠徹方勞榆沈若夫樹反壤也封夏屋焉終須潁川之碑乃見華陰之碣世子儀同永達孝性有聞居喪得禮嗟海變而田成懼山飛而地絕勒石墓田仍銘云爾少典之孫玄王之子虹貫於月金承於水降及于周公侯復始風俗氣候山川表裏河連積石山帶崆峒秦亭北上漢使西通金行氣壯地勢人雄稜稜高節凜凜疎風祖考藩屏濁河清渭兩地謨明雙流光賁水無別色雲無異氣為吏為民惟懷惟畏公之嗣世實秉英靈降神中嶽迴文列星鸞翔鳳顧珠角山庭臣深義本子極天經洛城戰陣河橋旗鼓箭飲石梁劍燃銅柱竝麗六麋俱抽雙虎玉門開郡陽關置府再為上台兩為少傅模範帝師經綸國步允襲峻德欽明審諭不吝車茵誰言溫樹天道茫昧年齡倏忽上將星開功臣鼎沒九原陵阜山河甲卒地險龜林營危馬窟西州永別北闕長辭山張虛蓋野祭空帷陵原地迥松路風悲銘于碣石勒以貞龜文苑英華九百十一周柱國楚國公岐州刺史慕容公神道碑周柱國楚國公岐州刺史慕容公神道碑昔在殷書懋賞周禮議勳諸侯計功大夫稱伐惟師尚父昆吾載寶鼎之銘王命尸臣栒邑傳琱戈之賜故知太上立德明試以功存有顯爵之榮歿有大名之貴昊天不弔其惟楚國公乎可以旌德景鐘勒勳彝器式昭盛美載揚洪烈者焉公諱寧字永安昌黎徒河人也都尉總六縣之卿名山稱五岳之佐燕太祖文皇帝慕容皝以當世英雄奄有河朔趙之南境且建王城冀之北土仍為興國公既皝之苗裔家世燕陲高祖侍中使持節都督中外諸軍事太保錄尚書北地王慕容超之世蕃屏王室詳之燕錄可得稱焉曾祖尚書府君因魏室之難改姓豆盧仍為官族祖仕魏文成皇帝考早亡朝廷以庸勳攸屬恩深追遠保定三年有詔贈柱國將軍少師涪陵郡開國公食邑二千戶公稟氣中和降祥川岳岐嶷表羈貫之年通禮稱綺紈之歲夙著奇節幼表大成兄弟分果備知推讓賓客解鈴曾無吝色永安元年太宰爾朱天光魏室元輔握兵淮右抗權江南公時任別將便從征伐自是長城峽石必先行陣秦南隴西每當矢石摧堅乘勝莫不前驅策勳行賞常居第一永熙元年補子都督并加鼓節軍儀除桑乾太守轉補都督其年以魏王西幸奉迎大駕賜封河陽縣開國伯增邑三百戶俄遷大中大夫改伯為侯增邑合九百戶仍授使持節都督顯州諸軍事顯州刺史四年遷鎮東將軍金紫光祿大夫其年秋河橋之役先登破陣遷為車騎大將軍儀同三司五年沙苑之功加封合前二千戶俄授敷州刺史加散騎常侍外深推轂內侍集書十五年授右衛將軍十六年授大將軍後魏元年重授敷州刺史公以先經刺舉固辭不就三年改封武陽郡開國公除尚書僕射職惟贊奏任居封掌分左右之儔兼典舉之選屬以江南阻兵渚宮邊敵軍機警急鋒鏑縱橫公奉命星言元戎啟路揔秦人之銳士兼荊戶之廣卒水龍競雙刀之勢步騎陳四分之威夷陵既燒黔中方定旋軍反旆解甲休兵其後鳳州內叛成都外絕公又揔督眾軍蒐乘即盜兵不血刃竝皆擒獲遷其酋豪納其降附皇朝受終文祖革命神宗選賢與能改絃創制爰降冊書授公柱國增邑四千戶二年授同州刺史衿帶關輔唇齒秦晉編戶殷積邸閤儲峙藩籬是任親賢勿居公建旟作牧褰帷行部六條斯舉百城咸勸三年授公大司寇又以公勳庸特著冊封楚國公食邑一萬戶蓋因破侯方仁等于荊陝即其地而封焉逖糾王慝弛張刑政式遏寇虐於是御之以寬猛柔遠能邇然後平之以沖和舜任咎陶不仁者遠晉舉隨會群盜皆奔保定四年授岐州諸軍事岐州刺史沉痼彌留保定五年三月四日薨于私第春秋六十有二詔贈某官謚某公禮也十月庚申葬於洪瀆之川馳綍毀宗客車專道玄甲被屬國之兵介士陳輕車之騎克善令終生榮死感嗚呼哀哉公經德秉哲體道居貞履貴思沖居盈念損澄波千頃不能變其清濁高墻百仞無以測其汙隆立身行己居安如墜亡躬殉義視嶮若夷至於將略應變出奇設伏太一風角之占常從星辰之候艛船戰陣之錄強弩馳射之書莫不動會機神發符雷電梯衝所向地靡百樓之城長戟所臨野關三門之陣是以斬將搴旗四十三戰尊官厚祿三十七年武彰七德之義歌誦九功之業迹紀庸器之文行昭易名之典昔臧文既歿穆叔稱其立言鄭僑云亡宣尼泣其遺愛德陽青石之墓千年未平枝江白虎之碑百代無毀敢因斯義乃作銘曰遼水之東冀州之北既曰都尉兼稱屬國歛氣餘勇雄邊遺則孝實天經忠為令德冠冕世祿羽儀祚胤俗被燕丹風慚英藺劬勞役行辛苦行陣勇過溺駿氣踰瓦震王國克生思皇多士溫溫恭人謙謙君子擁旄仗節出蕃入仕五朝建旟千里時逢改特名載策勳淮陰召拜昭陽破軍職司刑政獄慎深文沈羊不飲萑盜無聞巴庸薄伐江漢專征軍揔六挍兵兼七營運長擊短後實先聲增壘威敵減竈潛兵鐘鳴夜漏晞露朝陽邑里蕭索宅帷荒涼豐碑下柩題湊遷喪宮臨樗里臺傾孟嘗卜兆戒期遠辰告筮德遺身後名昭歿世館舍長捐泉扃永閉晏嬰悼齊柳莊悲衛風秋北原日沒川逝葬田舊頃客土新封淚墮片石劍挂孤松清徽令範千載餘蹤文苑英華九百十九周兗州刺史廣饒公宇文公神道碑周兗州刺史廣饒公宇文公神道碑唐朝以元凱竝進十有六人周室以昭穆先封十有五國發源纂冑葉派枝分開國承家珠聯璧合是用克明峻德思皇多士盛德有後公其裕哉公諱常字子元豫州滎陽人也周宣中興然後樹賢建戚鄭武有國然後保姓受氏荊衡之賦千乘莫敢加兵虢會之封十城翻為獻邑況復郊門致騎先迎內史之賓南宮旦朝獨識尚書之履祖思慶建威將軍山陽太守建威取曹仁之號可以定名山陽有王暢之賢足觀風俗考頊銀青金紫方於溫羡傅祗鎮南征東比於劉弘荀顗報功之冊則槐路是儀贈行之典則荊河惟牧公弱齡早慧幼志夙成立必正方言無勦說青衿智勇即埋雲夢之蛇童子仁心已愛中牟之雉始遊庠塾不無儒者之榮或見兵書遂有風雲之志出忠入孝事盡於心脩身立名理窮於性大統三年起義華陽先登廣武浮潛逾沔入渭亂河蒙授永安縣開國男輔國將軍自爾長從太祖入為帳內都督河橋接戰秋水則三月不流洛城揮鋒金墉則一月路斷西京不賓羌戎侵軼城如飛鳥地有伏龍公以金僕裁抽靈鉟暫舉蜂目已奔狼心遂革遷平東將軍帥都督十五年襲父封魏昌縣開國伯轉大都督魏後二年授使持節車騎大將軍儀同三司黃權受詔嘉其入魏之功竇憲當官賞其平戎之策公之此授勳庸著矣進爵廣饒縣開國公邑五百戶保定三年授都督羅州諸軍事羅州刺史仍領金州兵馬應接上庸公於文谷路溪澗崢嶸巖崖豁嶮山窮水斷馬束橋飛中垺既開雙城即款往者申息盡掩江黃無援涔陽極浦亟犯風塵夏首西浮頻遭鋒鏑公以伏波受脤樓船誓眾入橫江之陣進下瀨之兵越客文身湛盧終去吳人長鬣艅艎遂遠建德四年授使持節開府儀同大將軍公孫敖下光祿之塞諸葛誕勒丸都之山公之處焉差無慚德四方雜俗天下殊風以君廉能使為觀察馳傳擁節揚旍持斧既乘驄馬仍被繡衣群盜累足貴戚歛手鄉亭留宿幸無歸忌之疑公車奏事寧有反支之日是使陽球司隸無所申威鮑恢都官因人成事高祖武皇帝以仲春誓眾甲子濟河公杖劍六軍披圖八陣譬彼張遼前鋒而報魏主方之耿弇先戰而待蕭王及乎九州逌同四隩既宅遂得功參勇爵名入司勳授上開府增邑五百戶加以舉功行賞推恩分邑兼乘而反光乎譙郡之城載寶而歸照於臨漳之水即日賜姓宇文與國同族婁敬上書於鹿輅項伯舞劍于鴻門公之此榮足為連類以公績著屯險誠貫風霜其年授使持節都督東徐州諸軍事徐州刺史宣政元年授都督南兗州諸軍事南兗州刺史作牧濟河風行於雷澤建旟海岱化被於淮沂襜帷入境貪殘者解印冕旒從政仁義者郊迎豈直白石開渠青鹽換粟祥雲入境行雨隨軒而已哉在任遘疾薨于方鎮皇甫嵩監御斯牧賢能刺史荀中郎連率此則中興方伯英聲茂實公之有焉詔贈某官謚某公禮也以大象二年十一月十日歸葬於滎陽之某山舊墓九原悽愴趙文子其何言駟馬悲鳴滕成公其已遠若夫勒鼎刊碑銘功頌德陳其令範必在生前嗟乎此之樹碑異乎洙泗之水此之勒石異乎燕然之山嗚呼哀哉乃為銘曰高陽之子少典之孫蒼林遠遘若水遙源公侯復始鐘鼎逾繁承基纂冑建國開藩我壯我武既公既侯緇衣出鄭卿士歸周魚陵北上滎澤東流河移酸棗雨粟陳留祖守南邦考鎮東部兩龜為印雙虵結綬日察陰風星占長柳是曰世載其名不朽事親之道孝以立身事君之道忠以立仁今君嗣德一此君親如松之茂如竹之筠功參荊棘職主兵戈北臨青嶺南通白波直雲橫塞長星渡河陳開沙斷師移竈多舉功行賞封疆受位宮室鏤珪山河分地決勝千里謀深計秘建武功成名連星次建旟濟漯擁節龜蒙既蠶桑土實撫梧桐野無異器河無別風吳亭楚障莫敢彎弓倏忽身世俄然松檟路轉銅魚山迴石馬武侯之廟欒公之社望此高碑悽然淚下文苑英華九百十九周隴右總管長史贈太子少保豆盧公神道碑周隴右總管長史贈太子少保豆盧公神道碑君諱永恩字某昌黎徒何人本姓慕容燕文明帝皝之後也朝鮮箕子之封孤竹伯夷之國漢有四城秦為一候其先保姓受氏初存柳城之功開國承家始靜遼陽之亂自天市星妖連津兵覆尚書府君改姓豆盧筮仕於魏祖代左右將軍魏文皇帝直寢父長少以雄略知名不幸早世周朝以公兄弟佐命義存追遠保定二年有詔贈柱國大將軍涪陵郡公是知春雨潤木自葉流根西伯行仁推存及歿公以山岳精靈星辰秀異氣侔鐘鼎聲感風雲觀於秦兵尚稱童子對於楚戰猶在青衿太祖文皇帝乘時撥亂奄有霸業潁川從我舊愛無忘舂陵故人相知惟厚普泰二年關西建義授殄寇將軍奉迎大駕賜封新興縣伯邑五百戶開新安之鄉還移楊僕之關解弘農之圍更入劉昆之郡援桴併轡竝預前驅大統三年有沙苑之戰四年有河橋之役介冑蟣虱戎馬生郊公應變愈長風飆更勇隱若敵國差強人意授龍驤將軍中散大夫八年授直寢右親信都督尋轉大都督加通直散騎常待十六年授使持節車騎大將軍儀同三司魏元年授驃騎大將軍開府儀同三司鄧騭以漢朝親戚始授中台黃權以魏國功臣初登上將公頻煩寵授朝野為榮三年都督成州諸軍事成州刺史尋加侍中外揔連帥威振百城內參常伯榮高八舍于時隴坻黠羌時穿上谷榆中群賊或聚漁陽公卷甲星馳長驅千騎迴洛兇徒望風草靡瓜州豪傑束手歸軍後魏元年改封龍支縣侯三年朝廷使大將軍安政公隨突厥吐谷渾歸國河鄯二州屬當路首公領騎五千以為戎防南通丹粟西望白蘭關塞無虞公之勳也周元年授都督鄯州諸軍事鄯州刺史其年改封沃野縣公增邑千戶二年授隴右總管府長史武成元年都督利涉汶三州諸軍事利州刺史五年兵破文州陽陣蠻仍平瀘水以保定元年將兵破巴州恆獌獠渡瀘五月葛亮有深入之兵長坂九迴王尊有忠臣之路霜雹不驚水草無乏天幸將軍斯之謂矣其年授司會八法斯掌九賦是均事總歲成功參月要三年還授隴右總管府長史公屢弼英蕃頻相大府北海入朝仰以對問東平謁帝因而定禮遂使馬首懷燕不無樂毅蕃臣擬漢或多田叔兄楚國公以參和挹讓莊贊樂推建國開都奄荒南服求以先封武陽郡三千戶益公沃野之封朝廷以兄弟相讓不無前史推恩分邑有詔許焉增邑并前合四千七百戶既而六氣相犯五聲相觸靈壽不終遊魂且變薨於官舍春秋五十八詔贈少保幽冀定相等五州諸軍事幽州刺史謚曰敬公禮也天和元年二月六日葬於咸陽洪瀆川大夫墓樹以柏諸侯墳高於雉嗚呼哀哉公資忠履孝蘊義懷仁直幹百尋澄波千頃留心職事愛玩圖籍官曹案牘未嘗煩委戎馬交馳不妨餘裕兄弟公侯國朝親戚宜春有湯沐之盛濯龍無流水之機渭南千畝之竹尚懼盈滿咸陽二頃之田常思止足立身則十世可宥遺子則一經而已刺史賈逵之碑既生金粟將軍衛青之墓方留石麟乃為銘曰朝鮮建國孤竹為君地稱高柳山名密雲遼陽趙裂武遂秦分寶珪世冑雕戈舊勳名稱賓實言謂身文挺此含章降茲岐嶷有犯無隱王道正直唯愛唯敬永成悅色枕籍禮闈留連學植策參帷帳功披荊棘韓陣揮戈齊城憑軾豹策乃建龍韜同啟校戰岐陽申威隴坻城壘畫地山林聚米上馬諭書臨戎習禮賈復開營廉公屈體從容傅會占對造請用此廉平終茲寬猛綠林兵息潢池盜靜名振赤山威高青嶺玄獸浮河飛螟出境災氣出隴毒水侵涇朝傾地鎮夜落台星石壇承祀豐碑頌靈渭城前柏昌陵下庭須知地市為讀山銘藝文類聚五十文苑英華九百二十五溫湯碑溫湯碑咸池浴日先應綠甲之圖砥柱浮天始受玄夷之命仁則滌蕩埃氛義則激揚清濁勇則負山餘力弱則鴻毛不勝仲春則榆莢同流三月則桃花共下其色變者流為五雲之漿其味美者結為三危之露烟青於銅浦色白於鉛溪非神鼎而長沸異龍池而獨涌洒胃湔腸興羸起瘠秦皇餘石仍為雁齒之階漢武舊陶即用魚鱗之瓦山間涌水寔表忠誠室內江流彌彰純孝豈若醴泉消疾聞乎建武之朝神水蠲痾在乎咸康之世嵩山三仙之館不孤擅於天池華陰百丈之泉豈獨高於蓮井藝文類聚九初學記七
