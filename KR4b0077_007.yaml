body:
  text: 卷七周祀圓丘歌十二首昭夏降神重陽禋祀大報天丙午封壇肅且圜孤竹之管雲和絃神光未下風肅然王城七里通天臺紫微斜照影徘徊連珠合璧重光來天策暫轉鉤陳開庾子山集七隋書音樂志樂府詩集四詩紀百十九皇夏皇帝入門旌回外壝蹕靜郊門千乘按轡萬騎雲屯藉茅無咎掃地唯尊揖讓展禮衡璜節步星漢就列風雲相顧取法於天降其永祚同上昭夏俎入日至大禮豐犧上辰牲牢修牧繭栗毛純俎豆斯立陶匏以陳大報反命居陽兆日六變鼓鐘三和琴瑟俎奇豆偶惟誠惟質同上昭夏奠玉帛圓玉已奠蒼幣斯陳瑞形成象璧氣含春禮從天數智總圓神為祈為祀至敬咸遵同上皇夏皇帝升壇皇夏皇帝升壇七星是仰八陛有憑就陽之位如日之升思虔肅肅致敬繩繩祝史陳信玄象斯格惟類之典唯靈之澤幽顯對揚人神咫尺同上雲門舞初獻獻以誠鬱以清山罍舉沈齊傾惟尚饗洽皇情降景福通神明同上雲門舞初獻配帝長丘遠歷大電遙源弓藏高隴鼎沒寒門人生于祖物本於天奠神配德迄用康年同上登歌初獻及獻配帝畢奏歲之祥國之陽蒼靈敬翠雲長象為飾龍為章乘長日壞蟄戶列雲漢迎風雨大呂歌雲門舞省滌濯奠牲牷鬱金酒鳳凰樽回天眷顧中原同上皇夏飲福酒國命在禮君命在天陳誠唯肅飲福唯虔洽斯百禮福以千年鉤陳掩映天駟徘徊雕禾飾斝翠羽承罍受斯茂祉從天之來同上雍夏撤奠雍夏撤奠禮將畢樂將闌回日轡動天關翠鳳搖和鸞響五雲飛三步上風為馭雷為車無轍迹有煙霞暢皇情休靈命雨留甘雲餘慶同上皇夏就望燎位六典聯事九司咸則率由舊章于焉允塞掌禮移次燔柴在焉煙升玉帛氣斂牲牷休氣馨香膋芳昭晰翼翼虔心明明上徹同上皇夏還便殿玉帛禮畢神人事分嚴承乃眷瞻仰回雲輦路千門王城九軌式道移候司方回指得一惟清於萬斯寧受茲景命於天告成同上昭夏降神昭夏降神報功陰澤展禮玄郊平琮鎮瑞方鼎升庖調歌孫竹縮酒江茅聲舒鐘鼓器質陶匏列耀秀華凝芳都荔川澤茂祉丘陵容衛雲飾山罍蘭浮泛齊日至之禮歆茲大祭庾子山集七隋書音樂志初學記十三樂府詩集四廣文選十一詩紀百十九昭夏奠玉帛曰若厚載欽明方澤敢以敬恭陳之玉帛德包含養功藏靈迹斯箱既千子孫則百庾子山集七隋書音樂志樂府詩集七廣文選十一詩紀百十九登歌初獻質明孝敬求陰順陽壇有四陛琮分八方牲牷蕩滌蕭合馨香和鸞戾止振鷺來翔威儀簡簡鐘鼓喤喤聲和孤竹韻入空桑封中雲氣坎上神光下元之主功深蓋藏同上皇夏望坎位司筵撤席掌禮移次回顧封壇恭臨坎位瘞玉埋俎藏芬斂氣是曰就幽成斯地意同上皇夏奠玉帛嘉玉惟芳嘉幣惟量成形依禮稟色隨方神班其次歲禮惟常威儀抑抑率由舊章庾子山集七隋書音樂志樂府詩集四詩紀百十九皇夏初獻惟令之月惟嘉之辰司壇宿設掌史誠陳敢用明禮言功上神鉤陳旦闢閶闔朝分旒垂象冕樂奏山雲將回霆策暫轉天文五運周環四時代序鱗次玉帛循回樽俎神其降之介福斯許同上青帝雲門舞以下並初獻奏甲在日鳥中星禮東后奠蒼靈樹春旗命青史候鴈還東風起歌木德舞震宮泗濱石龍門桐孟之月陽之天億斯慶兆斯年同上配帝舞帝出於震蒼德於神其明在日其位居春勞以定國功以施人言從配祀近取諸身同上赤帝雲門舞招搖指午對南宮日月相會實沈中離光布政動溫風純陽之月樂炎精赤雀丹書飛送迎朱絃絳鼓罄虔誠萬物含養各長生同上配帝舞以炎為政以火為官位司南陸享配離壇三和實俎百味浮蘭神其茂豫天步艱難同上黃帝雲門舞三光儀表正四氣風雲同戊己行初曆黃鐘始變宮平琮禮內鎮陰管奏司中齋壇芝曄曄清野桂馮馮夕牢芬六鼎安歌韻八風神光乃超忽嘉氣恆蔥蔥同上配帝舞四時咸一德五氣或同論猶吹鳳凰管尚對梧桐園器圜居土厚位總配神尊始知今奏樂還用我雲門同上白帝雲門舞肅靈兌景承配秋壇雲高火落露白蟬寒帝律登年金精行令瑞獸霜耀祥禽雪映司藏肅殺萬寶咸宜厥田上上收功在斯同上配帝舞金行秋令白帝朱宣司正五雉歌庸九川執文之德對越彼天介以福祉君子萬年同上黑帝雲門舞北辰為政玄壇北陸之祀員官宿設玄璜浴蘭坎德陰風御寒次律將回窮紀微陽欲動細泉管猶調於陰竹聲未入於春絃待歸餘於送歷方履慶於斯年同上配帝舞地始坼虹始藏服玄玉居玄堂沐蕙氣浴蘭湯匏器潔水泉香陟配彼福無疆君欣欣此樂康同上周宗廟歌十二首皇夏皇帝入廟門肅肅清廟巖巖寢門欹器防滿金人戒言應朄懸鼓崇牙樹羽階變升歌庭紛象舞間安象設緝熙清奠春鮪初登新萍先薦僾然入室儼乎在位悽愴履之非寒之謂庾子山集七隋書音樂志樂府詩集九廣文選十一詩紀百十九昭夏降神昭夏降神永維祖武潛慶靈長龍圖革命鳳曆歸昌功移上墋德耀中陽清廟肅肅猛虡煌煌曲高大夏聲和盛唐牲牷蕩滌蕭合馨香和鸞戾止振鷺來翔永敷萬國是則四方庾子山集七隋書音樂志初學記十三樂府詩集九廣文選十一詩紀十九皇夏俎入皇帝升階年祥辨日上協龜言奉酎承列來庭駿奔雕禾飾斝翠羽承樽敬殫如此恭惟執燔庾子山集七隋書音樂志樂府詩集九詩紀百十九皇夏獻皇高祖慶緒千重秀洪源萬里長無時猶戢翼有道故韜光盛德必有後仁義終克昌明星初肇慶大電久呈祥同上皇夏獻皇曾祖德皇帝克昌光上烈基聖穆西藩崇仁高涉渭積德被居原帝圖張往迹王業茂前尊重芬德陽廟疊慶壽陵園百靈光祖武千年福孝孫同上皇夏獻皇祖太祖文皇帝雄圖屬天造宏略遇群飛風雲猶聽命龍躍遂乘機百二當天險三分拒樂推函谷風塵散河陽氛霧晞濟弱淪風起扶危頽運歸地紐崩還正天樞落更追原祠乍超忽畢隴或綿微終封三尺劍長卷一戎衣同上皇夏獻文宣皇太后月靈興慶沙祥發源功參禹迹德贊堯門言容典禮褕狄徽章儀形溫德令問昭陽日月不居歲時晼晚瑞雲纏心閟宮惟遠同上皇夏獻閔皇帝龍圖基代德天步屬艱難謳歌還受瑞揖讓乃登壇升輿芒刺重入位據關寒卷舒雲泛濫遊揚日浸微出鄭終無反居桐竟不歸祀夏今惟舊尊靈諡更追同上皇夏獻明皇帝若水逢降君窮桑屬惟政丕哉馭帝籙鬱矣當天命方定五雲官先齊八風令文昌氣似珠太史河如鏡南宮學已開東觀書還聚文辭金石韻毫翰風飆豎清室桂馮馮齊房芝詡詡寧思玉管笛空見靈衣舞同上皇夏獻高祖武皇帝南河吐雲氣北斗降星辰百靈咸仰德千年一聖人書成紫微動律定鳳凰馴六軍命西土甲子陳東鄰戎衣此一定萬里更無塵煙雲同五色日月並重輪流沙既西靜蟠木又東臣凱樂聞朱鴈鐃歌見白麟今為六代祀還得九疑賓同上皇夏飲福酒皇夏斂飲福酒禮殫祼獻樂極休成長離前掞宗祀文明縮酌浮蘭澄罍合鬯磬折禮容旋回靈貺受釐徹俎飲福移樽惟光惟烈文子文孫同上皇夏還便殿庭闋四始筵終三薦顧步階墀徘徊餘奠六龍矯首七萃警途鼓移行漏風轉相烏翼翼從事綿綿四時惟神降嘏永言保之同上昭夏降神律在夾鍾服居蒼袞杳杳清思綿綿長遠就祭於合班神於本來庭有序助祭有章樂舞六代賓歌二王和鈴以節鞗革斯鏘齊宮饌玉鬱斝浮金洞庭鐘鼓龍門瑟琴其樂已變惟神是臨庾子山集七樂府詩集九廣文選十一詩紀百十九登歌奠玉帛神惟顯思不言而令玉帛之禮敢陳莊敬奉如弗勝薦如受命交於神明愨於言行同上周五聲調曲序曰元正饗會大禮賓至食舉稱觴薦玉六律既從八風斯暢以歌大業以舞成功宮調曲五首氣離清濁割元開天地分三才初辨正六位始成文繼天爰立長安民乃樹君其明廣如日其澤厚如雲惟昔我文祖撥亂拒謳歌三分未撫運八百不陵河禮敷天下信樂正神人和風塵行息警江海欲無波庾子山集七樂府詩集十五詩紀百十九我皇承下武革命在君臨應圖當舜玉嗣德受堯琴沈首多推運陽城有讓心就日先知遠觀淵早見深玄精實委御蒼正乃皆平履端朝萬國年祥慶百靈玉帛咸觀禮華戎各在庭鳳響中夷則天文正玉衡皇基自天保萬物乃由庚同上握衡平地紀觀象正天樞祺祥鍾赤縣靈瑞炳皇都更受昭華玉還披蘭葉圖金波來白兔弱水下蒼烏玉斗調元協金沙富國租青丘還擾圃丹穴更巢梧安樂新成慶長生百福符同上明明九族序穆穆四門賓陰陵朝北附蟠木引東臣澗途求版築溪源取釣綸多士歸賢戚維城屬茂親貴位連南斗高榮據北辰迎時乃推策司職且班神日月之所照霜露之所均永從文軌一長無外戶人同上鬱盤舒楝宇崢嶸侔大壯拱木詔林衡全模徵梓匠千櫨綺翼浮百栱長虹抗北去邯鄲道南來偃師望龍首載文㮰雲楣承武帳居者非求隘卑宮豈難尚壯麗天下觀是以從蕭相同上變宮調二首帝遊光出震君明擅在離巖廊惟眷顧欽若尚無為龍穴非難附鸞巢欲可窺具茨應不遠汾陽寧足隨蒸民播植重溝洫劬勞多桑林還注雨積石遂開河明徵逢永命平秩值年和更有薰風曲方聞晨露歌庾子山集七樂府詩集十五詩紀百十九移風廣軒曆崇德盛唐年成文興大雅出豫動鈞天黃鍾六律正閶闔八風宣孤竹調陽管空桑節雅弦舞林鸞更下歌山鳳欲前聞音能辨俗聽曲乃思賢感物觀治亂心恆防未然君子得其道太平何有焉同上商調曲四首君以宮唱寬大而謨明臣以商應聞義則可行有熊為政訪道於容成殷湯受命委任於阿衡忠其敬事有罪不逃刑誦其針諫言之無隱情有剛有斷四方可以寧既頌既雅天下乃升平專精一致金石為之開動其兩心妻子恩情乖苟利社稷無有不盡懷昊天降祐元首唯康哉庾子山集七樂府詩集十五詩紀百十九百川俱會大海所以深群材既聚故能成鄧林猛虎在山百獸莫敢侵忠臣處國天下無異心昔我文祖執心且危慮驅剪豺狼經營此天步今我受命又無敢逸豫惟爾弼諧各可知兢懼同上禮樂既正神人所以和玉帛有序志欲靜干戈各分符瑞俱誓裂山河今日相樂對酒且當歌道德以喻聽撞鐘之聲神姦不若觀鑄鼎之形酆宮既朝諸侯於是穆岐陽或狩淮夷自此平若涉大川言憑於舟楫如和鼎實有寄於鹽梅君臣一體可以靜氛埃得人則治何世無奇才同上風力是舉而台階序平重黎既登而天地位成功無與讓銘太常之旌世不失職受騂毛之盟輯瑞班瑞穆穆於堯門惟翰惟屏膴膴於周原功成而治定禮樂斯存復子而明辟姬旦何言同上角調曲二首止戈見於絶轡之野稱伐聞於丹水之征信義俱存乃先忘食五材並用誰能去兵雖聖人之大寶曰位實天地之大德曰生涇渭同流清濁異能琴瑟並御雅鄭殊聲擾擾蒸人聲教不一茫茫禹迹車軌未并志在四海而尚恭儉心包宇宙而無驕盈言而無文行之不遠義而無立勤則無成惻隱其心訓以慈惠流宥其過哀矜典刑庾子山集七樂府詩集十五詩紀百十九匡贊之士或從漁釣雲雨之才乍嘆幽谷尋芳者追深徑之蘭識韻者探窮山之竹克明其德貢以三事樹之風聲言於九牧協用五紀風若從事農用八政甘作其穀殊風共軌見之周南異畝同穎聞之唐叔祁寒暑雨是無胥怨天覆雲油滋焉滲漉幸無謝上古之淳人庶可以封之于比屋同上徵調曲六首乾坤以含養覆載日月以貞明照臨達人以四海為務明君以百姓為心水波瀾者源必遠樹扶疏者根必深雲雨取施無不洽廊廟求才多所任庾子山集七樂府詩集十五詩紀百十九淳風布政常無欲至道防人能變俗求仁義急於水火用禮讓多于菽粟屈軼無佞人可指獬豸無繁刑可觸王道蕩蕩用無為天下四人誰不足同上聖人千年始一生黃河千年始一清攝提以之而從紀玉燭於是而文明東南可以補地缺西北可以正天傾浮黿則東海可厲運鍤則南山可平衆仙就朝於瑤水群帝受享於明庭懷和則𩎟任並奏功烈則鐘鼎俱銘同上三光以記物呈形四時以裁成正位雷風大山嶽之響寒暑通陰陽之氣武功則六合攸同文教則二儀經緯有道則咸浴其德好生則各繁其類白日經天中則移明月橫漢滿而虧能虧能缺既無為雖盈雖滿則不危開信義以為苑囿立道德以為城池周監二代所損益郁郁乎文其可知庖犧之親臨佃漁神農之躬秉耕稼湯則救旱而憂勤禹則正冠而無暇草上之風無不偃君子之氓知可化將欲比德於三皇未始追蹤於五霸同上纖纖不絶林薄成涓涓不止江河生事之毫髮無謂輕慮遠防微乃不傾雲官乃垂拱大君鳳曆唯欽明元首類上帝而禋六宗望山川而朝群后地鏡則山澤俱開河圖則魚龍合負我之天網莫不該閶闔九關天門開卿相則風雲玄感匡贊則星辰下來既興周室之三聖乃舉唐朝之八才莘臣參謀于左相天老教政於中台其宜作則於明哲故無崇信於姦回同上正陽和氣萬類繁君王道合天地尊黎人耕植於義圃君子翱翔於禮園落其實者思其樹飲其流者懷其源咎繇為謀不仁遠士會為政群盜奔克寬則昆蟲內向彰信則殊俗宅心浮橋有月支抱馬上苑有烏孫學琴赤玉則南海輸賮白環則西山獻琛無勞鑿空於大夏不待蹶角於蹛林同上羽調曲五首樹君所以牧人立法所以靜亂首惡既其南巢元凶於是北竄居休氣而四塞在光華而兩旦是以雨施作解是以風行唯渙周之文武洪基光宅天下文思千載克聖咸熙七百在我應期實昊天有成命惟四方其訓之庾子山集七樂府詩集十五詩紀百十九運平後親之俗時亂先疏之雄踰桂林而驅象濟弱水而承鴻既浮千呂之氣還吹八律之風錢則都內貫朽倉則常平粟紅火中乃寒乃暑年和一風一雨聽鐘磬念封疆聞笙竽思蓄聚瑤琨篠簜既從怪石鉛松即序長樂善馬成廄水衡黃金為府同上百川乃宗巨海衆星是仰北辰九州攸同禹迹四海合德堯臣朝陽栖于鳴鳳靈畤牧于般麟雲玉葉而五色月金波而兩輪涼風迎時北狩小暑戒節南巡山無藏於紫玉地不愛於黃銀雖南征而北怨實西略而東賓既永清於四海終有慶於一人同上定律零陵玉管調鐘始平銅尺龍門之下孤桐泗水之濱鳴石河靈於是讓圭山精所以奉璧滌九川而賦稅乘三危而納錫北里之禾六穗江淮之茅三脊可以玉檢封禪可以金繩探册終永保於鴻名足揚光于載籍同上太上之有立德其次之謂立言樹善滋於務本除惡窮於塞源沖深其智則厚昭明其道乃尊仁義之財不匱忠信之禮無繁動天無有不屆唯時無幽不徹作德心逸日休作偽心勞日拙自非剛克掩義無所離於勦絶同上
