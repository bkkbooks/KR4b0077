body:
  text: 卷五和人日晚景宴昆明池春餘足光景趙李舊經過上林柳腰細新豐酒徑多小船行釣鯉新盤待摘荷蘭皋徒稅駕何處有凌波本集五類聚九古今歲時雜詠五文苑英華百六十四庾開府詩集上詩紀百十七對宴齊使歸軒下賓館送蓋出河堤酒正離杯促歌工別曲悽林寒木皮厚沙迥雁飛低故人儻相訪知余已執圭本集五文苑英華二百九十六庾開府詩集上詩紀百十七聘齊秋晚館中飲酒聘齊秋晚館中飲酒欣茲河朔飲對此洛陽才殘秋欲屏扇餘菊尚浮杯漳流鳴二水日色下三臺無因侍清夜同此月徘徊本集五文苑英華二百九十七庾開府詩集下詩紀百十七奉和濬池初成清晨臨泛奉和濬池初成清晨臨泛千金高堰合百頃浚源開翻逢積翠浪更識昆明灰猿嘯風還急雞鳴潮即來時看青雀舫遙逐桂舟回本集五類聚九文苑英華百六十五庾開府詩集下詩紀百十七和炅法師遊昆明池二首和炅法師遊昆明池二首遊客重相歡連鑣出上蘭值泉傾蓋飲逢花駐馬看平湖泛玉舳高堰歇金鞍半道聞荷氣中流覺水寒本集五文苑英華百六十四庾開府詩集上秋光麗晚天鷁舸泛中川密菱障浴鳥高荷沒釣船碎珠縈斷菊殘絲繞折蓮落花催十酒栖烏送一絃本集五初學記七文苑英華百六十四庾開府詩集上詩紀百十七見遊春人長安有狹斜金穴盛豪華連杯勸上馬亂果擲行車深紅蓮子艷細錦鳳凰花那能學噀酒無處似欒巴本集五庾開府詩集上詩紀百十七別周尚書弘正別周尚書弘正扶風石橋北函谷故關前此中一分手相逢知幾年黃鵠遂反顧徘徊應愴然自知悲不已徒勞減瑟絃本集五類聚二十九文苑英華二百三十庾開府詩集上詩紀百十七別張洗馬樞別席慘無言離悲兩相顧君登蘇武橋我見楊朱路關山負雪行河水乘冰渡願子著朱鳶知余在玄菟本集五文苑英華二百六十六庾開府詩集上詩紀百十七別庾七入蜀別庾七入蜀峻嶺拂陽烏長城連蜀都石銘懸劍壁沙洲聚陳圖山長半股斷樹古半心枯由來兄弟別共念一荊株本集五庾開府詩集上將命使北始渡瓜步江校尉始辭國樓船欲渡河輴軒臨磧岸旌節映江沱觀濤想帷蓋爭長憶干戈雖同燕市泣猶聽趙津歌本集五類聚二十七詩紀百十七反命河朔始入武州反命河朔始入武州輕車初逐李定遠未隨班受詔祁連返申威疏勒還飛蓬損腰帶秋鬢落容顏寄言舊相識知余生入關本集五類聚二十七詩紀百十七冬狩行四韻連句應詔冬狩行四韻連句應詔三川羽檄馳六郡良家選觀兵細柳城挍獵長楊苑驚雉逐鷹飛騰猿看箭轉鳴笳河曲還猶憶南皮返本集五庾開府詩集上詩紀百十七和王內史從駕狩冬狩出離宮還過獵武功澗橫偏礙馬山虛絶響弓更嬴承落雁韓盧鬭蟄熊猶開三面網誰肯一山重本集五庾開府詩集上詩紀百十七入道士館入道士館金華開八景玉洞上三危雲袍白鶴度風管鳳凰吹野衣縫蕙葉山巾篸笋皮何必淮南館淹留攀桂枝本集五文苑英華二百二十六庾開府詩集上詩紀百十七奉和永豐殿下言志十首立德齊今古資仁一毀譽無機抱甕汲有道帶經鋤處下唯名惠能言本姓蘧未論驚寵辱安知係慘舒本集五庾開府詩集上詩紀百十七王子從邊服臨邛惜第如星橋擁冠蓋錦水照簪裾論文報潘嶽詠史答應璩帳幕參三顧風流盛七輿同上茫茫實宇宙與善定馮虛大夫傷魯道君子念殷墟程卿既開國安平遂徙居詎能從小隱終然遊太初同上直城風日美平陵雲霧除來往金張館弦歌許史閭鳳臺迎弄玉河陽送婕妤五馬遙相問雙童來夾車同上託情欣六學遊日愛三餘覆局能懸記看碑解暗疏詎嘗遊魏冉那時說范雎池水朝含墨流螢夜聚書同上興雲榆莢晚燒剃杏花初滮池侵黍稷谷水播菑畬六月蟬鳴稻千金龍骨渠含風搖古度防露動林於同上自憐循短綆方欲問長沮茂陵體猶瘠淮陽疾未袪翻疑承毒水忽似遇昌葅漢陽嗟欲盡咎繇懼忽諸同上弱齡參顧問疇昔濫吹噓緑槐垂學市長楊映直廬連盟翻滅鄭仁義反亡徐還思建鄴水終憶武昌魚同上崩堤壓故柳衰社臥寒樗野鶴能自獵江鷗解獨漁漢陰逢荷篠緇林見杖拿阮籍長思酒嵇康懶著書同上披林求木實拂雪就園蔬濁醪非鶴髓蘭肴異蟹胥野情風月曠山心人事疏徒知守瓴甓空欲報璠璵同上率爾成詠昔日謝安石求為淮海人倣佛新亭岸猶言洛水濱南冠今別楚荊玉遂遊秦倘使如楊僕寧為關外人本集五庾開府詩集上詩紀百十七慨然成詠新春光景麗遊子離別情交讓未全死梧桐唯半生值熱花無氣逢風水不平寶雞雖有祀何時能更鳴本集五庾開府詩集上詩紀百十七奉和賜曹美人奉和賜曹美人月光如粉白秋露似珠圓絡緯無機織流螢帶火寒何年迎弄玉今朝得夢蘭訝許能含笑芙蓉宜熟看本集五庾開府詩集上詩紀百十七和趙王看伎和趙王看伎緑珠歌扇薄飛燕舞衫長琴曲隨流水簫聲逐鳳凰細縷纏鐘格圓花釘鼓床懸知曲不誤無事畏周郎本集五類聚四十二初學記十五文苑英華二百十三庾開府詩集上萬花谷後三十二詩紀百十七奉答賜酒仙童下赤城仙酒餉王平野人相就飲山鳥一群驚細雪翻沙下寒風戰鼓鳴此時逢一醉應枯反更榮本集五庾開府詩集下詩紀百十七奉答賜酒鵝奉答賜酒鵝雲光偏亂眼風聲特噤心冷猿披雪嘯寒魚抱凍沉今朝一壺酒實是勝千金負恩無以謝惟知就竹林本集五庾開府詩集上詩紀百十七正旦蒙趙王賚酒正旦蒙趙王賚酒正旦辟惡酒新年長命杯柏葉隨銘至椒花逐頌來流星向碗落浮蟻對春開成都已救火蜀使何時回本集五類聚七十二古今歲時雜詠一庾開府詩集上詩紀百十七衛王贈桑落酒奉答愁人坐狹斜喜得送流霞跂窗催酒熟停杯待菊花霜風亂飄葉寒水細澄沙高陽今日晚應有接䍦斜本集五庾開府詩集上詩紀百十七就蒲州使君乞酒就蒲州使君乞酒蕭瑟風聲慘蒼茫雪貌愁鳥寒栖不定池凝聚未流蒲城桑葉落灞岸菊花秋願持河朔飲分勸東陵侯本集五類聚七十二庾開府詩集上詩紀百十七又草堂詩箋八引秋候二韻蒲州刺史中山公許乞酒一車未送蒲州刺史中山公許乞酒一車未送細柳望蒲臺長河始一回秋桑幾過落春蟻未曾開瑩角非難馭捶輪稍可催只言千日飲舊逐中山來本集五類聚七十二庾開府詩集下詩紀百十七答王司空餉酒答王司空餉酒今日小園中桃花數樹紅開君一壺酒細酌對春風未能扶畢卓猶足舞王戎仙人一捧露判不及杯中本集五類聚七十二庾開府詩集下詩紀百十七舟中望月舟子夜離家開舲望月華山明疑有雪岸白不關沙天漢看珠蚌星橋視桂花灰飛重暈闕蓂落獨輪斜本集五初學記一文苑英華百五十二萬花谷一作庾信詩庾開府詩集下詩紀百十七望月望月夜光流未曙金波影尚賒照人非七子含風異九華蓂新半璧上桂滿獨輪斜乘舟聊可望無假逐仙槎本集五文苑英華百五十二庾開府詩集上詩紀百十七對雨繁雲猶暗嶺積雨未開庭階含侵角路鑊滿溜疏萍濕楊生細椹爛草變初螢徒勞看蟻封無事祀靈星本集五類聚二喜晴比日思光景今朝始暫逢雨住便生熱雲晴即作峰水白澄還淺花紅燥更濃已歡無石燕彌欲棄泥龍本集五初學記二文苑英華百五十五庾開府詩集下詩紀百十七詠春近餘雪應詔送寒開小苑迎春入上林絲條變柳色香氣動蘭心待花將對酒留雪擬彈琴陪遊愧竝作空見奉恩深本集五文苑英華百七十三庾開府詩集上詩紀百十七奉和初秋奉和初秋落星初伏火秋霜正動鐘北閣連橫漢南宮應鑿龍祥鸞棲竹實靈蔡上芙蓉自有南風曲還來吹九重本集五初學記三文苑英華百五十八庾開府詩集上詩紀百十七晚秋淒清臨晚景疏索望寒階濕庭凝墜露摶風卷落槐日氣斜還冷雲峰晚更霾可憐數行雁點點遠空排本集五初學記三文苑英華百五十八庾開府詩集下詩紀百十七和潁川公秋夜和潁川公秋夜泬寥空色遠葉黃淒序變洞浦落遵鴻長飆送巢燕千秋流夕景百籟含宵囀峻雉聆金柝層臺切銀箭本集五文苑英華百五十八庾開府詩集下詩紀百十七詠畫屏風詩二十四首詠畫屏風詩二十四首浮橋翠蓋擁平旦雍門開石崇迎客至山濤載妓來水紋恆獨轉風花直亂回誰能惜紅袖寧用捧金杯本集五庾開府詩集下詩紀百十七停車小苑外下渚長橋前澀菱迎擁楫平荷直蓋船殘絲繞折藕芰葉映低蓮遙望芙蓉影只言水底然同上昨夜鳥聲春驚鳴動四鄰今朝梅樹下定有詠花人流星浮酒泛粟瑱繞杯脣何勞一片雨喚作陽臺神本集五類聚六十九庾開府詩集下詩紀百十七又初學記三引鄰人二韻逍遙遊桂苑寂絶到桃源狹石分花徑長橋映水門管聲驚百鳥人衣香一園定知歡未足橫琴坐石根本集五類聚六十九文苑英華百五十七庾開府詩集下詩紀百十七三春冠蓋聚八節管絃遊石險松橫植巖懸澗豎流小橋飛斷岸高花出迥樓定須催十酒將來宴五侯本集五庾開府詩集下詩紀百十七高閣千尋起長廊四注連歌聲上扇月舞影入琴弦澗水才窗外山花即眼前但願長歡樂從今盡百年本集五類聚六十九庾開府詩集下詩紀百十七日晚金槌路朱軒流水車𨏥拂緣堤柳甍飄夾路花定迎劉碧玉將過陰麗華非是高陽路莫畏接䍦斜本集五庾開府詩集下詩紀百十七徘徊出桂苑徙倚就花林下橋先勸酒跂石始調琴蒲低猶抱節竹短未空心絶愛猿聲近唯憐花徑深同上千尋木蘭館百尺芙蓉堂落日低蓮井行雲礙芰梁流水桃花色春洲杜若香就階猶不進催來上伎床同上搗衣明月下靜夜秋風飄錦石平砧面蓮房接杵腰急節迎秋韻新聲入手調寒衣須及早將寄霍嫖姚本集五類聚六十七類聚六十九庾開府詩集上詩紀百十七出沒看樓殿間關望綺羅翔禽逐節舞流水赴絃歌細管吹叢竹新杯捲半荷南宮冠蓋下日暮風塵多本集五庾開府詩集下詩紀百十七玉柙珠簾捲金鉤翠幔懸荷香薰水殿閣影入池蓮平沙臨浦口高柳對樓前上橋還倚望遙看採菱船同上高閣千尋跨重簷百丈齊雲度三分近花飛一倍低吹簫迎白鶴照鏡舞山雞何勞愁日暮未有夜烏啼本集五初學記二十五庾開府詩集下詩紀百十七河流值淺岸斂轡暫經過弓衣濕濺水馬足亂橫波半城斜出樹長林直枕河今朝遊俠客不畏風塵多本集五庾開府詩集下詩紀百十七度橋猶徙倚坐石未傾壺淺草開長埒行營繞細廚沙洲兩鶴迥石路一松孤自可尋丹竈何勞憶酒壚同上上林春徑密浮橋柳路長龍媒逐細草鶴氅映垂楊水似桃花色山如甲煎香白石青泉上誰能待月光同上白石春泉滿黃金新埒開戚里車先度蘭池馬即來落花承舞席春衫拭酒杯行廚半路待載妓一雙回同上將軍息邊務挍尉罷從戎池臺臨戚里絃管入新豐浮雲隨走馬明月逐彎弓比來多射獵唯有上林中同上三危上鳳翼九坂度龍鱗路高山裏樹雲低馬上人懸巖泉溜響深谷鳥聲春住馬來相問應知有姓秦本集五初學記二十五庾開府詩集上詩紀百十七聊開鬱金屋暫對芙蓉池水光連岸動花風合樹吹春杯猶雜泛細果尚連枝不畏歌聲盡先看箏柱欹本集五庾開府詩集下詩紀百十七洞靈開靜室雲氣滿山齊古松裁數樹盤根無半埋愛靜魚爭樂依人鳥入懷仲春徵隱士蒲輪上計偕同上今朝好風日園苑足芳菲竹動蟬爭散蓮搖魚暫飛面紅新著酒風晚細吹衣跂石多時望蓮船始復歸本集五類聚六十九庾開府詩集下詩紀百十七金鞍聚磧岸玉舳泛中流畫鷁先防水媒龍即負舟沙城疑海氣石岸似江樓崩槎時半沒壞舸或空浮定是汾河上戈船聊試遊本集五庾開府詩集下詩紀百十七竟日坐春臺芙蓉承酒杯水流平澗下山花滿谷開行雲數番過白鶴一雙來水影搖叢竹林香動落梅直上山頭路羊腸能幾回同上贈周處士贈周處士九丹開石室三徑沒荒林仙人翻可見隱士更難尋籬下黃花菊丘中白雪琴方欣松葉酒自和遊仙吟本集五類聚三十六及文苑英華二百三十作庾肩吾尋周處士弘讓尋周處士弘讓試逐赤松遊披林對一丘梨紅大谷晚桂白小山秋石鏡菱花發桐門琴曲愁泉飛疑度雨雲積似重樓王孫若不去山中定可留本集五類聚三十六作庾肩吾文苑英華二百三十鏡玉匣聊開鏡輕灰暫拭塵光如一片水影照兩邊人月生無有桂花開不逐春試挂淮南竹堪能見四鄰本集五初學記二十五萬花谷續七作庾信詩詩紀百十七梅花常年臘月半已覺梅花闌不信今春晚俱來雪裡看樹動懸冰落枝高出手寒早知覓不見真悔著衣單本集五初學記二十八文苑英華三百二十二萬花谷後三十八作庾信詩庾開府詩集下詩紀百十七詠樹交柯乍百頃擢本或千尋楓子留為式桐孫待作琴殘核移桃種空花植棗林幽居對蒙密蹊徑轉深沉本集五類聚八十八文苑英華三百二十六庾開府詩集上詩紀百十七鬭雞開軒望平子驟馬看陳王狸膏燻鬭敵芥粉壒春場解翅蓮花動猜群錦臆張本集五類聚九十一詩紀百十七應令望別非新館開舟即舊灣浦喧征棹發亭空送客還路塵猶向水征帆獨背關本集五類聚二十九詩紀百十七杏花杏花春色方盈野枝枝綻翠英依稀映村塢爛熳開山城好折待賓客金盤襯紅瓊本集五類聚八十七詩紀百十七
