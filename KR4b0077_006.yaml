body:
  text: 卷六集周公處連句市朝一朝變蘭艾本同焚故人相借問平生如所聞本集六庾開府詩集上詩紀百十八寄徐陵故人倘思我及此平生時莫待山陽路空聞吹笛悲本集六庾開府詩集下詩紀百十八寄王琳玉關道路遠金陵信使疏獨下千行淚開君萬里書本集六類聚二十九庾開府詩集下詩紀百十八奉和趙王花徑日相攜花林鳥未棲比看中郎醉堪聞烏夜啼本集六庾開府詩集上詩紀百十八和劉儀同臻南登廣陵岸回首落星城不言臨舊浦烽火照江明本集六庾開府詩集下詩紀百十八和庾四離關一長望別恨幾重愁無妨對春日懷抱只言秋本集六庾開府詩集下詩紀百十八和侃法師三絶和侃法師三絶秦關望楚路灞岸想江潭幾人應落淚看君馬向南本集六類聚二十九庾開府詩集下詩紀百十八客遊經歲月羈旅故情多近學衡陽鴈秋分俱渡河同上回首河隄望眷眷嗟離絶誰言舊國人到在他鄉別同上送周尚書弘正二首交河望合浦玄菟想朱鳶共此無期別知應復幾年本集六庾開府詩集下詩紀百十八離期定已促別淚轉無從惟愁郭門外應足數株松同上重別周尚書二首陽關萬里道不見一人歸唯有河邊鴈秋來南向飛本集六文苑英華二百六十六庾開府詩集下詩紀百十八河橋兩岸絶橫岐數路分山川遙不見懷袖遠相聞本集六文苑英華二百六十六庾開府詩集下詩紀百十八贈別藏啼留送別拭淚強相參誰言畜衫袖長代手中浛本集六庾開府詩集上詩紀百十八徐報使來止得一相見徐報使來止得一相見一面還千里相思那得論更尋終不見無異桃花源本集六庾開府詩集下詩紀百十八行途賦得四更應詔四更天欲曙落月垂關下深谷暗藏人欹松橫礙馬本集六庾開府詩集上詩紀百十八和江中賈客和江中賈客五兩開船頭長橋發新浦懸知岸上人遙振江中鼓本集六樂府詩集四十八庾開府詩集上詩紀百十八奉和平鄴應詔天策引神兵風飛掃鄴城陳雲千里散黃河一代清本集六庾開府詩集上詩紀百十八送衛王南征望水初橫陳移營寇未降風塵馬足起先暗廣陵江本集六庾開府詩集上詩紀百十八仙山二首金竈新和藥銀臺舊聚神相看但莫怯先師應識人本集六庾開府詩集下詩紀百十八石軟如香飯鉛銷似熟銀蓬萊暫近別海水遂成塵同上山齊石影橫臨水山雲半繞峰遙想山中店懸知春酒濃同上野步值泉仍飲馬逢花即舉杯稍看城闕遠轉見風雲來本集六庾開府詩集上詩紀百十八山中澗暗泉偏冷巖深桂絶香住中能不去非獨淮南王本集六庾開府詩集上詩紀百十八閨怨明鏡圓花發空房故怨多幾年留織女還應聽渡河本集六庾開府詩集上詩紀百十八和趙王看妓和趙王看妓長思浣紗石空想搗衣砧臨邛若有便為說解琴心本集六初學記十五文苑英華二百十三庾開府詩集下詩紀百十八看舞鸞回不假學鳳舉自相關到嫌衫袖廣恆長礙舉鬟本集六庾開府詩集下詩紀百十八聽歌一絶協律新教罷河陽始學歸但令聞一曲餘聲三日飛本集六初學記十五萬花谷三十二作庾信詩庾開府詩集下詩紀百十八暮秋野興賦得傾壺酒劉伶正捉酒中散欲彈琴但使逢秋菊何須就竹林本集六庾開府詩集下詩紀百十八對酒數杯還已醉風雲不復知唯有龍吟笛桓伊能獨吹本集六文苑英華百九十五庾開府詩集上詩紀百十八春日極飲檻前聞鳥囀園裡對花開就中言不醉紅袖捧金杯本集六庾開府詩集上詩紀百十八春望春望上春臺春窗四面開落花何假拂風吹會併來本集六庾開府詩集上詩紀百十八新月鄭環唯半出秦鉤本獨懸若交臨酒影堪言照弩弦本集六庾開府詩集下詩紀百十八秋日蒼茫望落景羈旅對窮秋賴有南園菊殘花足解愁本集六庾開府詩集上詩紀百十八望渭水樹似新亭岸沙如龍尾灣猶言吟暝浦應有落帆還本集六初學記六文苑英華百六十三庾開府詩集下詩紀百十八塵鏡塵鏡明鏡如明月恆常置匣中何須照兩鬢終是一秋蓬本集六庾開府詩集下詩紀百十八草堂詩箋三十一八月詩注作磨鏡詩引一句和淮南公聽琴聞弦斷嗣宗看月夜中散對行雲一絃雖獨韻猶足動文君本集六庾開府詩集下詩紀百十八弄琴二首雉飛催晚別烏啼驚夜眠若交新曲變惟須促一絃本集六庾開府詩集上詩紀百十八不見石城樂惟聞烏噪林新聲逐絃轉應得動春心同上詠羽扇搖風碎朝翮拂汗落毛衣定似回溪路將軍垂翅歸本集六詩紀百十八題結線袋子交絲結龍鳳鏤彩織雲霞一寸同心縷千年長命花本集六庾開府詩集上詩紀百十八賦得鸞臺九成吹玉琯百尺上瑤臺能將秦女去終是鳳皇來本集六庾開府詩集下詩紀百十八賦得集池鴈逢風時迥度逐侶乍爭飛猶憶方塘水今秋已復歸本集六類聚九十一詩紀百十八詠鴈詠鴈南思洞庭水北想鴈門關稻粱俱可戀飛去復飛還本集六類聚九十一詩紀百十八忽見檳榔忽見檳榔緑房千子熟紫穗百花開莫言行萬里曾經相識來本集六類聚八十七庾開府詩集下詩紀百十八賦得荷秋衣行欲製風蓋漸應欹若有千年蔡須巢但見隨本集六庾開府詩集下詩紀百十八移樹酒泉移赤奈河陽徙石榴雖言有千樹何處似封侯本集六庾開府詩集下詩紀百十八奉梨接枝秋轉脆含情落更香擎置仙人掌應添瑞露漿本集六庾開府詩集上庾開府詩集下詩紀百十八傷往二首見月長垂淚花開定斂眉從今一別後知作幾年悲本集六庾開府詩集下詩紀百十八鏡塵言苦厚蟲絲定幾重還是臨窗月今秋迥照松同上春日離合二首秦青初變曲未有逐琴心明年花樹下月月來相尋本集六庾開府詩集下詩紀百十八田家足閒暇士友暫流連三春竹葉酒一曲鵾雞絃同上和回文和回文旱蓮生竭鑊嫩菊養秋鄰滿池留浴鳥分橋上戲人本集六類聚五十六詩紀百十八問疾封中録形骸違學宦狹巷幸為閒虹回或有雨雲合又含寒橫湖韻鶴下回溪狹猿還懷賢為榮衛和緩惠綺紈本集六庾開府詩集上詩紀百十八示封中録二首貴館居金谷關扃隔藁街冀君見果顧郊間光景佳本集六庾開府詩集上詩紀百十八高階既激澗廣閣更交柯葛巾久乖角菊徑簡經過同上秋夜望單飛鴈失群寒鴈聲可憐夜半單飛在月邊無奈人心復有憶今暝將渠俱不眠本集六初學記三十詩紀百十八代人傷往二首青田松上一黃鶴相思樹下兩鴛鴦無事交渠更相失不及從來莫作雙本集六庾開府詩集上詩紀百十八雜樹本唯金谷苑諸花舊滿洛陽城正是古來歌舞處今日看時無地行同上
