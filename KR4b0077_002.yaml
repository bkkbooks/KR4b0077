body:
  text: 卷二歌對酒歌春水望桃花春洲藉芳杜琴從綠珠借酒就文君取牽馬向渭橋日曝山頭脯山簡接䍦倒王戎如意舞箏鳴金谷園笛韻平陽塢人生一百年歡笑惟三五何處覓錢刀求為洛陽賈本集二文苑英華百九十五樂府詩集二十七庾開府詩集上詩紀百十四昭君辭應詔昭君辭應詔歛眉光祿塞還望夫人城片片紅顏落雙雙淚眼生冰河牽馬渡雪路抱鞍行胡風入骨冷夜月照心明方調琴上曲變入胡笳聲本集二文苑英華二百四樂府詩集二十九庾開府詩集上詩紀百十四王昭君王昭君拭啼辭戚里回顧望昭陽鏡失菱花影釵除卻月梁圍腰無一尺垂淚有千行綠衫承馬汗紅袖拂秋霜別曲真多恨哀絃須更張本集二文苑英華二百四樂府詩集二十九庾開府詩集上詩紀百十四出自薊北門行薊門還北望役役盡傷情關山連漢月隴水向秦城笳寒蘆葉脆弓凍紵弦鳴梅林能止渴複姓可防兵將軍朝挑戰都護夜巡營燕山猶有石須勒幾人名本集二樂府詩集六十一又類聚四十一引情鳴兵名四韻庾開府詩集下詩紀百十四結客少年場行結客少年場行結客少年場春風滿路香歌撩李都尉果擲潘河陽隔花遙勸酒就水更移床今年喜夫壻新拜羽林郎定知劉碧玉偷嫁汝南王本集二文苑英華百九十五樂府詩集六十六庾開府詩集上詩紀百十四道士步虛詞十首道士步虛詞十首渾成空教立元始正圖開赤玉靈文下朱陵真氣來中天九龍館倒景八風臺雲度弦歌響星移空殿迴青衣上少室童子向蓬萊逍遙聞四會倏忽度三災本集二文苑英華百九十三樂府詩集七十八庾開府詩集上詩紀百十四無名萬物始有道百靈初寂絕乘丹氣玄明上玉虛三元隨建節八景逐迴輿赤鳳來銜璽青烏入獻書壞機仍成機枯魚還作魚栖心浴日館行樂止雲墟本集二樂府詩集七十八庾開府詩集上詩紀百十四凝真天地表絕想寂寥前有象猶虛豁忘形本自然開經壬子世值道甲申年迴雲隨舞曲流水逐歌弦石髓香如飯芝房脆似蓮停鸞讌瑤水歸路上鴻天本集二文苑英華百九十三樂府詩集七十八庾開府詩集上詩紀百十四道生乃太乙守靜即玄根中和煉九氣甲子謝三元居心受善水教學重香園鳧留報關吏鶴去畫城門更以忻無迹還來寄絕言本集二樂府詩集七十八庾開府詩集上洞靈尊上德虞石會明真要妙思玄牝虛無養谷神丹丘乘翠鳳玄圃御斑麟移梨付苑吏種杏乞山人自此逢何世從今復幾春海無三尺水山成數寸塵本集二文苑英華百九十三樂府詩集七十八庾開府詩集上詩紀百十四東明九芝蓋北燭五雲車飄颻入倒景出沒上煙霞春泉下玉霤青鳥向金華漢帝看桃核齊侯問棗花上元應送酒來向蔡經家本集二類聚七十八初學記二十三文苑英華百九十三樂府詩集七十八庾開府詩集上詩紀百十四歸心遊太極迴向入無名五香芬紫府千燈照赤城鳳林採珠實舂山種玉榮夏簧三舌響春鍾九乳鳴絳河應遠別黃鵠來相迎本集二類聚七十八文苑英華百九十三樂府詩集七十八庾開府詩集上詩紀百十四北闕臨玄水南宮生絳雲龍泥印玉策大火煉真文上元風雨散中天歌吹分靈駕千尋上空香萬里聞本集二類聚七十八初學記二十三樂府詩集七十八庾開府詩集上詩紀百十四地鏡階基遠天窗影迹深碧玉成雙樹空青為一林鵠巢堪煉石蜂房得煮金漢武多驕慢淮南不小心蓬萊入海底何處可追尋本集二類聚七十八樂府詩集七十八庾開府詩集上詩紀百十四麟洲一海闊玄圃半天高浮丘迎子晉若士避盧敖經餐林慮李舊食綏山桃成丹須竹節刻髓用蘆刀無妨隱士去即是賢人逃同上行俠客行俠客重連鑣金鞍被桂條細塵障路起驚花亂眼飄酒醺人半醉汗濕馬全驕歸鞍畏日晚爭路上河橋本集二類聚三十二作庾信詩文苑英華百九十六庾開府詩集下詩紀百十七從軍行從軍行河圖論陣氣金匱辨星文地中聞鼓角天上下將軍函犀恆七屬絡鐵本千群飛梯聊度絳合弩暫凌汾寇陣先中斷妖營即兩分連烽對嶺度嘶馬隔河聞箭飛如疾雨城崩似壞雲英王於此戰何用武安君本集二文苑英華百九十九樂府詩集三十二庾開府詩集上詩紀百十五烏夜啼二首桂樹懸知遠風竿詎肯低獨憐明月夜孤飛猶未栖虎賁誰見惜御史詎相攜雖言入絃管終是曲中啼本集二類聚四十二文苑英華二百六樂府詩集四十七庾開府詩集下詩紀百十四促柱繁弦非子夜歌聲舞態異前溪御史府中何處宿洛陽城頭那得棲彈琴蜀郡卓家女織錦秦川竇氏妻詎不自驚長淚落到頭啼烏恆夜啼本集二類聚四十二文苑英華二百六樂府詩集四十七庾開府詩集下詩紀百十四怨歌行怨歌行家住金陵縣前嫁得長安少年回頭望鄉淚落不知何處天邊胡塵幾日應盡漢月何時更圓為君能歌此曲不覺心隨斷弦本集二樂府詩集四十二庾開府詩集下詩紀百十四舞媚娘朝來戶前照鏡含笑盈盈自看眉心濃黛直點額角輕黃細安秪疑落花謾去復道春風不還少年唯有歡樂飲酒那得留殘本集二樂府詩集七十三庾開府詩集下詩紀百十四燕歌行代北雲氣晝昏昏千里飛蓬無復根寒雁嗈嗈渡遼水桑葉紛紛落薊門晉陽山頭無箭竹疎勒城中乏水源屬國征戍久離居陽關音信絕能踈願得魯連飛一箭持寄思歸燕將書渡遼本自有將軍寒風蕭蕭生水紋妾驚甘泉足烽火君訝漁陽少陣雲自從將軍出細柳蕩子空床難獨守盤龍明鏡餉秦嘉辟惡生香寄韓壽春分燕來能幾日二月蠶眠不復久洛陽遊絲百丈連黃河春冰千片穿桃花顏色好如馬榆筴新開巧似錢蒲桃一杯千日醉無事九轉學神仙定取金丹作幾服能令華表得千年本集二文苑英華百九十六樂府詩集三十二庾開府詩集下詩紀百十四又類聚四十二引根門源居疎書軍濱雲柳守壽連穿錢仙年十七韻楊柳歌河邊楊柳百丈枝別有長條踠地垂河水衝激根株危倏忽河中風浪吹可憐巢裡鳳凰兒無故當年生別離流槎一去上天池織女支機當見隨誰言從來蔭數國直用東南一小枝昔日公子出南皮何處相尋玄武陂駿馬翩翩西北馳左右彎弧仰月支連錢障泥渡水騎白玉手板落盤螭君言丈夫無意氣試問燕山那得碑鳳凰新管簫史吹朱鳥春窗玉女窺銜雲酒盃赤瑪瑙照日食螺紫琉璃百年霜露奄離披一旦功名不可為定是懷王作計誤無事翻復用張儀不如飲酒高陽池日暮歸時倒接䍦武昌城下誰見移官渡營前那可知獨憶飛絮鵝毛下非復青絲馬尾垂欲與梅花留一曲共將長笛管中吹本集二庾開府詩集上詩紀百十四又文苑英華三百三十七引枝垂危吹兒離池隨枝馳支陂吹窺璃知披為儀移知垂吹二十三韻
