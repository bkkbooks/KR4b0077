body:
  text: 卷十一為上黃侯世子與婦書為上黃侯世子與婦書昔仙人導引尚刻三秋神女將梳猶期九日未有龍飛劍匣鶴別琴臺莫不銜怨而心悲聞猿而下淚人非新市何處尋家別異邯鄲那應知路想鏡中看影當不含啼欄外將花居然俱笑分杯帳裏卻扇床前故是不思何時能憶當學海神逐潮風而來往勿如織女待填河而相見藝文類聚三十二趙國公集序竊聞平陽擊石山谷為之調大禹吹筠風雲為之動與夫含吐性靈抑揚詞氣曲變陽春光迴白日豈得同年而語哉柱國趙國公發言為論下筆成章逸態橫生新情振起風雲爭飛魚龍各變方之珪璧塗山之會萬重譬似雲霞赤城之巖千丈文參曆象即入天官之書韻涉絲桐咸歸總章之觀論其壯也則鵬起半天語其細也則鷦巢蚊睫豈直熊熊旦上增城抱日月之光燄燄宵飛南斗觸蛟龍之氣昔者屈原宋玉始於哀怨之深蘇武李陵生於別離之世自魏建安之末晉太康以來雕蟲篆刻其體三變人人自謂握靈蛇之珠抱荊山之玉矣公斟酌雅頌諧和律呂若使言乖節目則曲臺不顧聲止操縵則成均無取遂得棟梁文囿冠冕詞林大雅扶輪小山承蓋藝文類聚五十五初學記二十一周使持節大將軍廣化郡開國公丘乃敦崇傳周使持節大將軍廣化郡開國公丘乃敦崇傳崇恆州代郡鼓城縣廣義鄉孝讓里人也昔壽丘建國賜姓者十二人平陽舉賢登朝者十六族況復大電繞樞流星入昴派分源別幹其嗣興者乎魏道武皇帝以命世雄圖飲馬河洛兄弟十人分為十姓辨風吹律丘氏即其一焉五代祖邈驃騎大將軍開府儀同三司營丘郡開國公于時天道西北既稟謀謨馬首東南實資匡贊因以封名仍為賜氏與夫南公伯即有連類宗則樂正非無準則曾祖雙軌使持節驃騎大將軍司徒青兗二州刺史范陽文昭公洛食之始上馬治國登庸之初昇槐論道生則絕席武宮死則配祠清室夫人太原王氏三世為將四代為公社稷大宗鍾鼎貴族伉儷是歸秦晉匹也祖提使持節衛將軍駙馬都督河交二州刺史靈壽縣開國公公子公孫聲名籍甚增輝增耀弱冠昇朝夫人清廉郡長公主孝文帝之第二女也王姬有行車服不繫故得衛青上將張耳賢夫父願使持節大都督徐州諸軍事徐州刺史平陽縣開國公食邑四千戶少年習象多見兵書澆沙聚石之營卻日橫雲之陣彎弧則戟破小支抽劍則泉飛枯井夫人宇文氏周文皇帝之第三妹也母儀令範女師賢哲德高隆慮義重河陽魏受其終周新其命式墓封墳追旌盛德乃贈使持節大將軍廣化郡開國公食邑一千戶夫人贈安德郡長公主遊魂冤結非無廣漢之城久客思歸唯有東平之樹自永安以來魏室大壞海水群飛天星亂動禮樂征伐不出於人主舉賢誅暴議在於強臣高丞相驅率風雲奄荒齊晉我舅氏文皇帝駕馭龍虎據有周秦南北渝盟東西敵怨既而各受圖書竝當珪璧百姓則父南子北兄東弟西事主則憂親求生則慮禍大周親戚徧鍾荼炭輸之城旦下之織室關河嚴隔三十餘年天厭喪亂人思反德彼之風塵既靜函谷此之冠蓋屢涉漳濱中山冤枉之餘代郡凋殘之澤竝遇革音咸蒙禮送崇賓兄弟二人相看氣息親愛凋零方寸久亂恆山殺翮豈望同飛而安國徒中鬱為卿相班超絕域遂得生還天和四年至於新邑朝廷以舅甥之國外內之親乃授賓使持節驃騎大將軍開府儀同三司大都督安樂縣開國公食邑一千戶賓得免虎口仍上龍門聲價已高風飆即遠方欲討論國恥申雪家冤橫尸原野是所甘心時不我與先從朝露春秋若干衛國興文子之慟長安有詔葬之悲乃贈本官加少傅蒲虞勳三州諸軍事蒲州刺史以天和六年某月日葬於長安之洪瀆原妻青州石氏長城郡君胤子孤煢生妻嫠室即能有節還成守義崇蒙授使持節大都督驃騎大將軍開府儀同三司廣化縣開國公食邑一千戶昆季二人同年上將彤廷交映棨戟相臨昔二馮同德繼踵當官兩杜齊名夾河為郡比斯榮寵彼將慚色俄然賓疾奄捐館舍崇兄弟勝衣備罹禍酷同氣長養得及全人今者來歸更連凶閔每一悲慟行路傷心撫養愛子情深馬援之慈恭事寡嫂義甚顏含之孝天和六年授大將軍餘如故龍庭賞出塞之功玉門勞旋師之寵異代同和見之今日建德二年授使持節都督宜州諸軍事宜州刺史忽忽橫閤但有誦書瞹瞹重帷惟聞善政清不置水明非舉燭乃是入境移風非直停車待雨有敕大將軍宜州刺史廣化郡公崇自夏季無雨以迄於今雖靡神不禱仍未降感知彼州內獨蒙滂澤諒由大將軍精誠所至憂念郡人豐稔可希良以為慰又敕廣化公崇知此存心政術治勤黎人受委稱職嘉尚無已古人有言非行之難念加勉勗以致盡善指令宣納抑操賜齊陳物如別宜諭朕懷昔陽平太守別降紅粟之恩荊州刺史偏蒙袞衣之賜治績尤異此之謂乎崇清淨為政廉明為法人不忍背吏不忍欺性不飲酒無所嗜欲深沉牆仞喜慍不形文必正詞絃惟雅曲仁義禮節是所用心緹帙緗素愛翫無已當今四郊多壘尚有公卿之辱鼓鼙不息猶勞將帥之謀語其讎恥唯願橫行死地思其報國不吝身膏原野但令天假之年時綏之福忠貞之事公其取焉略書梗概陳之直史文苑英華七百九十二答移市教昔張楷碩儒尚移弘農之市宜官玅篆猶致酒壚之客況復德總郇周聲高梁楚希風慕義之士舉袂成帷臥轍反車之流摩肩相接遂使王充閱市之處遠出荒郊石苞販鐵之所翻臨崖岸聖德謙虛未忘諠湫欲令吹簫舞鶴還反舊鄽賣卜屠羊請辭新闠而交貿之黨好留豳岐之眾難遣藝文類聚六十五初學記二十四移齊河陽執事文周天和四年四月二十七日使持節車騎大將軍儀同三司大都督陝西總管府移齊河陽執事自疆場臥鼓邊鄙收烽義讓之行未能朞月孔誠誨盜即值苞藏是以板載之師須時而動自安封域非求拒防雖復風塵暫接旗鼓無侵五將即迴雙崤已靜始奉朝旨獲彼移書令受叛城使迴軍實想彼邊司已奉處分既有此還輒須領納未知何日可遣戍兵指附行人遲能速報盟且不渝鄰境相善顧瞻原野幸甚實多故移文苑英華六百五十周天和四年十一月十日陝州總管長史梁昕移齊河陽執事自拭玉繼書通關去傳實謂上方銷劍山陽息馬故茲禦客或慢重扃屬故司疆陰行善盜君一臣二上穆下乖國家以邊鄙心搖須固備守大司馬齊國公天子介弟中軍元帥駕馭孫吳驅馳𧴈虎舉因農隙義異城郎師巡我境曾非反鄆縮載甫畢前旗已迴彼國兵馬不防殿後餘塵遂致相接建旌壘上未及五申安鄴城傍先驚七伏當時鋒刃或膏原野所獲彼將夏州刺史梁老首領今以相還戶鄉不遠無令久客馬驢甲兵具條相勒封人宜依領納宿無鬭志不獲交綏致此埃塵誰階其咎故移文苑英華六百五十移虜留使文年月朔日某官告配某州郡前本欲發遣彼使但某入境以來國祥甫邇自秋迄冬未申款接且狼星表邦嚴霜已戒浮河亂濟長路苦寒時當獻歲維新三元告慶珪贄盈庭華裔參軫式觀盛禮洽此嘉讙陽和既動澤漸萬邦便當遣使相隨永敦鄰睦故移文苑英華六百五十
