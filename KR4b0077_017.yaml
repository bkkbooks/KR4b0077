body:
  text: 附録七夕牽牛遙映水織女正登車星橋通漢使機石逐仙槎隔河相望近經秋離別賖愁將今夕恨復著明年花玉臺新詠八古今歲時雜詠二十五失題不愁風嫋嫋正奈雪垂垂氣惟憑酒平章卻要詩全芳備祖前集卷一梅花部引白雲巖際出清月波中上誠齊詩話作庾信詩杜鵑杜鵑闕文藏海詩話失題藏書凡幾代看博已千年升菴詩話一引庾子山詩經陳思王墓詩經陳思王墓詩公子獨憂生丘壟擅餘名採樵枯樹盡犁田荒隧平寧追宴平樂詎想謁承明旦余來錫命兼言事結成飄颻河朔遠颭飆颶風鳴雁與雲俱陳沙將蓬共驚枯桑落古社寒鳥歸孤城隴水哀笳曲漁陽慘鼓聲離家來遠客安得不傷情文苑英華三百六作庾肩吾愁賦攻許愁城終不破蕩許愁門終不開何物煮愁能得熟何物燒愁能得然閉門欲驅愁愁終不肯去深藏欲避愁愁已知人處海録碎事九又漫叟詩話引處一韻誰知一寸心乃有萬斛愁海碌碎事九失題風吹雲夢凍合船官漫叟詩話引作庾子山賦又苕溪漁隱叢話前集四十九鴛鴦賦昔有一雙鳳飛來入魏宮今成兩株樹若個是韓馮觀林詩話蕩子賦佩珠翠的叉梁粟填海録碎事五搖蕩寒關蒼茫晚日施顧注蘇詩三春衫急手裁施顧注蘇詩二十七象賦恣誦詞烽專撝談柄施顧注蘇詩三十三失題雜蘊藻而俱浮問芙蓉而外發全芳備祖後集二菱部引作梁庾信啓瑋禪師碑游極箕張建標霞起觀林詩話襄州鳳林寺碑干霄秀出建標起同上宇文盛墓志銘宇文盛墓志銘受圖黃石不無師表之心學劍白猿遂得風雲之志潘子真詩話又能改齊漫録八宇文順文集序章表健筆一付陳琳新刊校定集注杜詩十七又見二十二
