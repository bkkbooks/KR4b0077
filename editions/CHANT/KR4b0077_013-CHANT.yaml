body:
  text: 卷十三陝州弘農郡五張寺經藏碑蓋聞如來說法萬萬恆沙菩薩轉輪生生世界豈直優波提舍祇夜脩多而已哉是以熙連禪河質多羅樹七處八會三清四說皮紙骨筆木葉山花象負之所未勝龍藏之所不盡雖復銀函東度金㲲南翻秦景遙傳竺蘭私記譬猶得海水之一珠不下崑山之片玉若夫法雲深藏師子雷音梵志往生聲聞說戒雪山羅漢之論鷲嶺菩提之法本無極際何可勝言弘農五張寺者南陽張元高寓居此地昔者千金之族見徙五陵大姓之民移家六郡蓋其流也元高五子負荷遺訓離經辨志竝是成名入室生光咸能顯德加以尊承慧業敬受法門兄弟同居共捨為寺伽藍肇建即以五張為名是知城居趙信仍名趙信之城殿入蕭何即號蕭何之殿加以象馬無吝衣裘是捨春園柳路變入禪林蠶月桑津迴成定水平輿雖盛豈可獨擅二龍扶風最良不得專稱五馬寺主三藏大法師法映邑主洛州刺史張隆等財行法檀身心罄竭兼化鄉邑道俗數千敬造一切德輪見成三百餘部雷篆雲書金繩玉檢削蒸栗之簡裝酸棗之珠竝入香城咸封禪閣坐堂伏檻羌非湘水之神綠房紫的足擬恭王之殿高掌西望長河北臨鼎氣常浮爐煙咸起戶牖寥廓吹萬龍門之風梁楝崢嶸落實河源之樹僧徒雲集不遠燉煌之城學侶相奔更合華陰之市兩陝昔分實基王化二陵今阻翻馳羽檄虞公屈產交亂風塵召伯甘棠凋零霜露雖復兼能共治未遣渡河之獸烽柝是警實擾移關之民是以法王御世天人論道汲引四流周圓五怖故能調伏怨憎消除結縛法水津梁得無砥柱之難香山轍迹非復終南之險天子命我試守此邦墨竈未黔孔席無暖纔臨都尉之境即有樓船之役既而南風不競北道言旋幕府既開邦君且止鄉俗耆老依然此別屬茲法事須余制文聊以課虛為銘云爾舍衛之國祇洹之園三明極地八會窮源連河競說勝辨爭論波提東度祇夜南翻非空即色離有無言達人止是獨悟重昏身雖繫馬心避騰猿禪樓卻月義殿翔鵾迴風香蓋反露珠幡西臨砥柱東背轘轅河鳴陽硤山響蘇門翔禽歌囀流澗絃喧渡河餘獸移關舊村昔為畿服今成塞垣城疑廣武地似樓煩爟烽竝照象馬單奔無鐘襲莒有雨圍原不資十方誰釋三怨風傾地柱火及天元銀鉤永固金牒長存封君馬首方事南蕃言從楊僕請謝劉昆文苑英華八百五十周上柱國齊王憲神道碑昔者軒皇受姓十有四人周室先封十有五國自爾承基纂冑保姓受氏雖復千年一聖終是百世同宗故知昔之東京既稱炎漢再受今之周曆即是酆都中興公諱憲字毗賀突恆州武川人也晉太康之世據有黃龍魏孝昌之初奄荒玄菟太祖以百二諸侯三分天下函谷先登鴻溝大定功業如此人臣以終公含章天挺命世誕生降太一之神下文昌之宿珠角擅奇山庭表德儀範清泠風神軒舉聳動廊廟光華城闕未逾齠齓已議論天下事人或曰是謂若木一枝旁蔭數國長河一直自然千里風飆欲遠光景將昇後魏二年封涪城縣開國公時年五歲也虹蜺滿野是廢當途之高鸑鷟鳴岐實始維新之命國家光宅受圖欽明秉曆大風初卷長沙始封周元年進爵安城郡公食邑二千戶仍授使持節驃騎大將軍開府儀同三司開府同於馬駿秩擬六卿驃騎等於劉蒼位高三事宗子維城彼多慚色武成二年授使持節大將軍都督益壽寧等二十四州諸軍事益州刺史改封齊國公食邑萬戶公時年十有六王武子以上將開府未滿立年荀中郎為十州都督才踰弱冠方之於公已為老矣加復營丘負海齊桓公受脤之城岷山導江漢武帝求仙之地自非召陵孤竹聲振沉黎豈得南至穆陵西登積石幸無白虎之患寧待黃龍之盟邛筰畏威微盧仰德生為立廟刻石頌功成都有文翁之祀非謂生前漢陽有諸葛之碑止論身後比之今日豈可同年而語哉保定四年與大司馬蜀國公圍金墉城師臨洛浦則廣武營奔兵上邙山則河橋路斷八川風俗五方名利鐵市銅街風飛塵起天和元年徵還行雍州牧公以日月之明威神其政漆沮既從荊岐即乂少陽用事路不喘牛仲秋以殷民無驚水二年拜大司馬仍理小冢宰營室殿軍器太監天官以邦國為基是司六典夏官以兵戈為主專謀七德是以器械填委既包吳漢之功宮殿崢嶸彌壯蕭何之法時以白露涼風務閑農隙督兵三萬出自宜陽拔伏龍之城平姚萇之壘馬陵削樹魏將路窮平陰聽烏齊師其遁天子冢弟禮絕群公仁義所往事資道德建德元年進爵為王仍拜大冢宰姬旦封於曲阜不廢居中劉交國於彭陽無妨常從豈直周召二南竝居師傅晉鄭兩國俱為卿士而已哉匈奴突於武川爟火通於灞上公述職巡御治兵朔方馬邑星飛龍城月動撓留犁之酒經略不前失燕支之山下馬而去東鄰逆命反道敗德囚箕子於塞庫羈文王於玉門天子將有孟津之師召公獨議公報以誕應天命克成厥勳昔者秦昭起師於蜀直問張儀晉武用兵於吳惟謀羊祜於是中軍無帥僉曰有歸五年拜上柱國元戎東討給王鐵騎二萬先襲太原斗建麾兵天離轉戰虎嘯風騰雲飛電掩林胡棗栗詎得充饑晉陽荻蒿何能拒防又加王精兵六萬長圍晉州然後六軍星陳萬騎雷動中權始及前茅已戰自爾即為前鋒橫行入鄴觀彼車絓槐本馬驚旋濘積甲高昆陽之城尸封塞富平之水莫不如彼建瓴同斯破竹一朝指揮六合大定是用光昭下武翼亮中都足以攄祖宗之宿憤解生民之怨黷方當待彼石閭部斯玉鼓經緯天地光華日月既而赤鳥夾日黃熊入寢實沉無祀桑林不祭宣政元年六月二十八日薨春秋三十有四季友之亡魯可知矣齊喪子雅姜其危哉公器宇淹曠風神透遠璣鏡照林山河容納置樽待酌懸鐘聽扣聲動天下光照四鄰武皇帝以介弟懿親特垂愛友而密謀奇策加禮敬焉常謂左右曰孔子云自吾有回門人日親其齊王之謂也用之作宰則萬方協和用之撫軍則四表懾伏豈直皋繇為士國無不仁隨會為卿民無群盜愛翫書籍敦崇禮樂管絃入耳則溪谷俱調文雅沿心則煙霞竝韻養由百發落鴈吟猿應奉五行綈緗縹帙雍容舉止抑揚談論當世以為楷模搢紳以為軌範則少有壯志頗挍兵書玄水降靈穀城授策飛風長柳月角星眉莫不吟誦在心撰成於手所著兵法凡有五卷六韜九法不用吳起舊書三令五申無勞孫武先誡可謂有忠孝焉有壯武焉不自驕矜謙光下物宋人獻玉不貪為寶伯成子高守仁為富不謂以信致欺為善非樂天年不享嗚呼哀哉以某年月日葬於石安縣洪瀆川之里原隰悽愴埋於盛德幾年丘陵搖落蘊於才良永矣乃為銘曰悠哉朔方逖矣窮陰山連鳥道地盡龜林重黎業大伯翳功深冑其積德必有君臨太祖撥亂喪君有君功迴地軸策動天文猶臨赤水尚復黃雲諸侯八百天下三分公之挺生寔惟天假翠微神降文昌星下照於四國充於兩社舟楫江河棟梁華夏水通詞鋒風飛文雅純深之性義極天經忠貞之道事感百靈君親惟一臣子惟寧忠泉出井孝笋生庭乃宰天官為國之輔是居上將為天之柱乃聖乃神惟文惟武策高開闢威移雲雨九宮神略三術謨明天離轉陣月德迴兵黎陽水駭官渡山驚冀州既載東原底平溟波欲運弱木將危中峰岳斷半海鵬垂鳳沉丹穴龍亡黑陂臨淄廢市東武山移千齡萬古英聲在斯文苑英華八百九十周太子少保步陸碑周太子少保步陸碑公諱逞字季明本姓陸吳郡人也君子至止既紹虞賓鳳皇于飛實興齊國南越使者解漢帝之衣西陵將軍覆吳王之蓋曾祖載為宋王司馬留鎮關中赫連之亂仗劍魏室黃河參陵或亡追路烏江艤船更無歸迹今為河南洛陽人也高祖冠軍將軍營州刺史吳人有降附者悉領為別軍自是官師擁鐸更為吳越之兵君子習流別有樓船之陣父政驃騎大將軍儀同三司恆州刺史中都獻公太祖扶危濟傾經綸夷阻報君之恥遠襲平原以高平霸業所基委命留事關中餽食非直滎陽之師河內供軍豈但淇園之竹公秉照晉之靈降明神之德猛虎振檻七年不驚羝羊觸藩九齡能對諸兄以公先君愛子稱之曰仁推而襲封雖復季末大成之心守節既遭燻穴翻從壓紐太祖初封函谷始合諸侯以公詞令參謀機密故得戎政克宣師言無漏賜姓步陸孤氏委鹿輅而論都入鴻門而舞劍方之吹律綽有餘榮出身羽林監輕車將軍除尚書右丞官聯會計務殷平準水衡貫朽常平粟紅授使持節車騎大將軍儀同三司增邑千戶尋遷駕部中大夫領吏部中大夫歷蕃部御伯中大夫東京鼎實先加鄧騭之勳西晉官人多用山濤之啟豈若五王登朝必司賓主之禮六龍御轡取定鸞和之節御正以官觸父名不拜會稽有王會之名其子不為太守博陵有王沉之封其兒不為刺史遷驃騎大將軍開府入掌納言治司宗伯又為軍司馬職居常伯勤問於南宮位管王言連官於北斗豈止郊天祀地龍門嶰谷之聲贊鼓頒旗白露涼風之月闇夜有人餉羅數十匹公閉門不受行人干觸具以聞奏朝野稱之太尉楊震直推故吏之金涼州張奐高揖羌人之馬清畏人知我無慚德齊國通和封人受使以公有出境之才見命張旜之禮既珠盤歃血定楚國之連名匕首登壇反齊人之侵地是謂使乎固稱光國三輔公侯五陵鐘鼎桐街柳市塵起風飛乃授京兆尹增邑通前一千六百戶餘官如故上林兵息蘭池盜靜不學王陽平生鑄金之術未同張敞終日章臺之遊家僮暮行還得遺錢於道并白絁十匹公訪得其主即以還之見金於路指以示人得錢於道持留掛樹方之今日異代同風俄遷司會治小司馬重揔六軍再操八柄考績入於歲成論功書之年表尋授都督宜州諸軍事宜州刺史露冕觀風停車待雨百城解印憚朱穆之威千里相迎愛王基之德曾未朞月被敕追還眷眷吏民不無河內之請依依故老實念黎陽之別少陽養德前星守器尊師讓齒必俟賢能乃授太子太保方之劉寔道高於大邦譬以山濤榮深於小輦本有消渴之疾常餌金石自理舊疾微增奄捐館舍茂陵之下不留封禪之書挍尉之營惟餘服食之器嗚呼哀哉春秋四十有七建德二年五月十一日也天子以大臣之喪躬輟聽訟東朝以師傅之尊親臨攢祭詔贈某官謚某公禮也以今三年正月十日葬於京兆之高陽原夫人郁久閭西遇王姬受敬肅恭言容令淑有聞箴盥無廢紘綖爰在盛年先從大夜今節婦開墳松柏已拱季孫成寢丘陵始同況復圖畫賢妃方在甘泉之室瘞埋才子即用高陽之原公儀表外明風神內照器量深沉階基不測事君惟忠事親惟孝言為世範行為士則留連墳索怊悵文詞霜府錄於尚書天官總於司會出入匡贊常帶數職身具六龜腰恆四綬陳平密謀既非天子所見荀彧上策又非諸侯所聞其為郡也惟取赤土封書其為州也唯以青鹽換粟留家則千樹無資遺子則一經而已嫡子操至性過禮純孝不遺墳前之樹染淚者先枯庭際之禽聞悲者則下銘曰山連日觀水枕滇機富春沙起開陽柱飛大夫屈節將軍振威南越受吏西陵解圍昔我烈祖垂翅秦中白馬無路烏江不通笛吟鄉里琴哀土風營州恆州擁旄世載壯節旃矜人雄關塞直河穿趙平雲臨代生謂立功沒為留愛降茲岳瀆誕此貞明祥符雲氣慶合星精宮帷定策殿柱書名忠泉暗漏孝笋寒生世屬殷周時逢楚漢天下三分鴻溝一半以我明略來參匡贊日乃再中天成兩旦遞參三事歷副六卿天師光宅地載謨明春官定禮夏官治兵讖言默識溫樹無名謙恭周密言行無乖忠公兕殪陰德虵埋軍國紛總部領瑱階馬不入廄金不入懷具瞻惟德高山惟仰甲觀初登龍樓初上東國桓榮西京疎廣年齡俄頃風電相摧銘旌兩沒池柳雙迴煢煢胤子御疚銜哀身彰野火心懼天雷日月其除榮終哀始馬歸司隸書還太史曆對天星墳連地市山勢接飛松形蓋起德音無絕平原忽矣文苑英華九百周大將軍崔說神道碑公諱說字某博陵郡安平縣人也昔者華陽之野降龍首之神烈山之都啟龜文之繇匡周則盟津有會佐夏則龍門始鑿西遊則起家秦相東入則載世齊卿備乎史籍可得言矣祖辯平遠將軍武邑郡守父楷散騎常侍光祿大夫殷州刺史竝厲風霜俱張鋒穎邸史疊迹官曹凜然是謂鮑恢都官百城振懼葛豐握節京師歛手公特稟英靈偏鍾山岳雄姿俊茂眉目疎朗觀虎於檻齠髮不驚稱象於船勝衣能對至於拉虎羈熊摧斑碎掌忘歸繁弱落鴈吟猨故得氣蓋關中威申河外解褐領軍府錄事轉諮議參軍時當塗失御政在權門始論函谷之兵即起韓陵之戰太師賀拔勝作牧西荊公為假節冠軍將軍防城都督及南陽失守卷甲奔梁樂毅羈旅猶思燕路陳軫愴悽終戀秦聲幸值和鄰言歸舊國授衛將軍都督封安昌縣開國子食邑三百戶弘農克復沙苑揮鋒進爵為侯增邑并前一千一百戶信珪則更受司勳穀璧則還輸典瑞鐵馬有河橋之戰戈船有汾水之兵除京兆太守移民下邑未學邊韶走馬章臺不同張敞遷帥都督持節撫軍通直散騎常侍大都督尋遷使持節車騎大將軍儀同三司都官尚書定州大中正五曹奏事有朱穆之忠九品論人見楊喬之直改封安國縣侯益邑合前一千四百戶賜姓宇文改名為說漢王改婁敬之族事重論都魏后變程昱之名恩深捧日遷車騎大將軍開府儀同三司加侍中竇憲連官單于之寶鼎可致張寬固位渭橋之流星可識司木七工既掌丘陵之賦司會六典乃均邦政之才居官得人於斯為盛進爵為公改封萬年縣通前二千四百戶除隴州刺史都督隴州諸軍事隴坻路遙秦川望遠鄧仲華之不去馬文淵之願歸尋除涼州刺史總督河西甘瓜諸軍事地似伏龍城如飛鳥燉煌實錄宛在胸襟玉門亭障無勞圖畫有馬如羊不以入廄有金如粟不以入懷柱國齊王今上之介弟龔行薄伐問罪河陽以公為行軍長史參謀帷幄中軍之司既舉魏絳上卿之佐實用荀林以公方之差無慚德除使持節大將軍大都督崇德安義建忠九曲安樂三泉伏流周張平泉固安蠻通谷凡十三防禦熊和中三州黃蘆起谷王晏供超牽羊溫狐交河大嶺避雨木柵寺一十戍諸軍事崇德防主宜陽上地更有秦兵熊耳山前還逢積伏用是連營函谷獵騎黎陽威振兩河名陵三晉改封安平縣公淮陰一國韓信之故人戶牖萬家陳平之鄉里公此衣錦足為連類建德四年正月十日薨於長安之永貴里私第春秋六十有四詔贈敷延丹綏恆五州諸軍事敷州刺史謚曰莊公禮也即以其年二月二十四日葬於京兆平原鄉之吉遷里北陵追遠大司馬有賜綬之恩西京贈行冠軍侯有詔葬之禮嗚呼哀哉世子儀同衍生事以禮死葬以禮愛親有王祥之孝同氣有姜肱之睦百行之本於斯備焉況復松檟深沉既封青石之墓丘陵標榜須勒黃金之碑乃為銘曰華陽之神厲山之祖鳳野匡周龍門佐禹日浴溟池山浮海浦甫穆霸國營丘樂土胤斯宗邑承此壤王移封東武就君安陽中軍節目鎮北鋒芒商飆獵草電火驅霜公之輪奐繼體貞幹儀表丘墟風神墻岸孝有至德忠能匡贊不廢橫琴無妨欹案既班三事又貳六官衛青受詔韓信登壇長城馬窟廣武兵欄軍吏無犯營民不寒乃用六謀乃論三策城壘向背星辰主客劍起沉犀弓開伏石楚后讓盟秦君還璧百齡危脆千仞摧藏諸侯地裂邊將星亡輕車騎士玄甲黃腸社如齊地廟似桐鄉銘功贊德碑闕相望文苑英華九百四周大將軍司馬裔碑周大將軍司馬裔碑公諱裔字遵胤河內溫人也昔顓頊之命始則南正司天重黎之後又以羲和掌曆夏陽適晉得隨會而同奔東海避秦與毛公而俱隱其後金行受命玉笥南遷帝系極於輿圖中朝至於江表曾祖楚之晉太傅錄尚書揚州牧會稽文孝王之次子元顯之幼弟也元顯見害之後桓玄篡逆之初爰自齠齔客身屠釣河內道左抱劍長號代郡城前慟悲靈祭江淮志節之士汝潁風塵之客感激一言咸多依附既而雲生伏龜星出鯨魚太白經天蚩尤映野公乃收合餘燼泣血登埤臨武牢之關據成皋之坂擁眾萬家歸於魏室魏明元皇帝遙授平南大將軍荊州刺史襲封瑯琊郡王尚河內公主命王承制從賓國之儀于時宋兵憑陵旗鼓侵逼虎牢不封金墉無援魏太武皇帝授王使持節侍中安南大將軍開府儀同三司給前後部鼓吹元戎啟行志雪冤恥登壇慷慨三軍掩泣黃河漕粟已出石門白馬連旗將臨野坂既而雲中柝起代郡烽燃反旆南轅途窮北略贈征西大將軍都督梁益秦寧荊兗青豫郢洛十州諸軍事揚州牧司徒謚貞王祖金龍封瑯琊鎮西大將軍儀同三司吏部尚書贈司空謚康王父悅鎮南將軍豫州刺史漁陽莊侯以荊河刺舉時值亂離釁起蕭墻遂終非命公遺腹載誕流離寇逆複壁襁負深山擁樹程嬰之匿趙武從役家臣王成之藏李燮為傭酒市遭太夫人憂苫草墳塋以終灰燧形骸毀瘠逾於喪禮年十有五始幹家事楹前鑿柱即取遺書石上開松仍求故劍出身司徒府參軍除中堅將軍員外散騎常侍值魏室多難所在蜂起孟津以北無復封畿嵩山以南即為鋒鏑公建議脩武立柵溫城函谷西封河橋北斷長亭籍馬竝入武城百里租車咸輸溫縣太祖文帝締構關都經綸夷阻招攜以禮懷遠以德馬文淵之擇主去隴坻而歸身竇周公之入朝在河西而奉詔大統七年蒙授平東將軍北徐州刺史十年河內故義四千餘家願立忠誠須公衣錦乃授使持節領河內太守加前將軍懷州拓境兩鎮奔波柳泉轉戰三城授首十三年太祖召山東諸立義之將能率眾入關者有加重賞公率先而至領戶千室即以為封固辭不受其菽粟之賜或以指囷馬牛之賞將同量谷朝廷以華陽西極漢水東流歎孟達之奔兵怪劉封之失策魏前元年移鎮漢中除白馬城主領華陽郡守昔稱導漾今聞上瀦烟沉冰井雨歇雲門其年授大都督加散騎常侍柱國蜀國公開金牛之道通牧馬之關公卷甲北塞懸車束馬遂得策預葭萌勳參綿竹封龍門縣開國子蒲州刺史仍領新州尋授使持節車騎大將軍儀同三司大中正隆周授圖天保大定以公才望仍為舊臣遂乃義深追遠恩隆繼絕即改封瑯琊縣公邑五百戶仍遷驃騎大將軍開府儀同三司都督巴州諸軍事巴州刺史武成二年被敕赴援信州魚復道阻屢卻岑彭荊門水急幾沉吳漢公乃月峽先登瞿唐直上天子以公操履忠勤儀刑亮直乃徵為大御伯尋轉大御正邑一千一百戶樞機近侍出納絲言所謂多識舊章殿中無雙者矣四年大軍東討公所領義眾先守枳關授都督懷州諸軍事懷州刺史偃師張幕河陽牧馬雖接戰於富平已連營於官渡五年詔追還拜始州刺史更討信州賊山彰尋寶渝恃險峽路五尺絙約纔通縣水三門橋飛濟渡既而風行草偃谷靜山空前後平十一城獲九千餘口馬歸平樂金輸水衡天保二年除信州刺史都督信州諸軍事朝發白帝暮宿江陵氣振巴丘之兵威警建平之戍五年遷潼州刺史益州柱國公降帝子之重鎮天井之星延閣擬於叢臺岷山方於代郡公仰稟雄謨參謀遠略故得身預舞陽之功位極長平之寵六年授使持節大將軍大都督西寧州諸軍事西寧州刺史方欲關沫若徼牂牁見夜郎之侯習昆彌之戰而飛鳶墮水馬援去而無歸金馬騁光王褒行而不返嗚呼哀哉七年正月十日薨春秋六十有五詔贈使持節大將軍懷邵汾晉四州諸軍事懷州刺史夫人襄城公主魏獻帝之曾孫趙穆王之季女王姬肅恭褕翟禮典四教競莊三星令淑有光隆慮之賢足表平陽之盛生則從夫以秩死則同穴以禮建德元年八月十二日合葬於武功三畤原大夫墓樹以柏諸侯墳高於雉于嗟滕公來居此里詔謚定公禮也公資忠履孝蘊義懷仁直幹千尋澄波萬頃逢蒙射法力牧兵書星辰高下之占風雨逢迎之氣故得師出以律天幸將軍者也至如官曹案牘未嘗煩壅戎馬交馳不妨餘裕足使四岳彌峻三台更明在朝四十一年身經一百餘戰凡任四郡歷八州未嘗以貨殖經懷去如始至渭南千畝之竹更懼盈滿池陽二頃之田常思止足身歿之日家無餘財素車白馬狹室崎嶇黃腸玄甲階庭仄陋有詔冬官為營寢室朱邑祭酹無所漢后是以賜金陳表妻子露立吳王為之開館嗚呼哀哉世子侃孝家忠國揚名顯親是以勒此豐碑懼從陵谷殖之松柏不忍凋枯銘曰欽若曆象平秩寅賓少梁奔華地入咸秦族夷興馬書窮獲麟玉鏡云始金行乃搆象浦通關龍沙開候上糝石起河陽水鬭五馬南浮三星東宿太傅作牧奄有江沱司徒避亂承制荊河南勞推轂猶思枕戈龍媒被野蒼兕凌波莊侯季年禍機相接誕公遺嗣崎嶇懷挾山竄趙武家藏李燮伍員道阻燕丹路遙南奔楚塞北避秦橋水流登壟寒風度遼有功都護則重嫖姚懷書上馬習禮從戎陣圖六甲兵占八風藏松寶劍射柳琱弓推誠賈復屈節廉公八翼頻飛六循亟秉勇此仁義行茲寬猛持印山開沉黎盜靜取甲無丘均田不井懋功賜爵上將賞官軍中受詔塞外登壇方屠參合更鏖皋蘭渝川毒水僰道災氛地亡都尉灘悲使君谷寒無日山空足雲北風吹旐秋霖泣軍遣奠雙設銘旌兩布沁水同墳平陽合墓悲哀嗣子攀號靡訴慟甚風枝悲深霜露自此何世從斯幾年麒麟欲鬭華表中燃地形樓起松心蓋圓茫茫丘壟代代英賢文苑英華九百四周柱國大將軍拓拔儉神道碑周柱國大將軍拓拔儉神道碑蓋聞放勛立而羲和昇重華登而元凱用思皇多士既成西伯之功俊德克明乃定南巢之伐是知惟賢非后弗食惟后非賢弗乂若夫君臣一德啟心沃心見之昌寧文公矣公諱儉字慶明恆州高陸人也北岳天孫之星燕河帝子之國故多奇節甚茂華風高闕圖南二王齊軫長城拔本十族分源高祖太尉北平王光輔五君允釐百揆恆衛既從淮沂其乂祖豹龍驤將軍恆州刺史常山刺舉非無取代之符龍驤總戎或似平吳之號父戫年止弱冠榮終解印公以五常蘊智六氣資德乘天則策馬秉靈降神則牽狼應象直心於物水火恬然無負於天雷霆不懼富貴自取豈資唐舉之言聲名有聞無勞李膺之識年十八解褐員外散騎侍郎尋授輕車將軍羽林監太祖文皇帝駕馭天綱苞羅英傑選公才德光佐中書諸葛亮之西歸玉壘成三分之業管夷吾之入仕葵丘有一匡之功天水黠羌漁陽群盜乃遷秦州長史防城大都督封信都縣開國伯三年滑州蟻聚保鄣沉命靡旗亂轍乘冰渡河丞相大行臺授假節撫軍行滑州刺史大統元年授持節西夏州刺史加散騎常侍郅支抱馬如聞耿秉之戰單于願識似畏王商之威五年遷使持節鎮東將軍都督東北三夏州諸軍事西夏州刺史增邑千戶改伯為公既而江漢遼遠車書寂寞蜀主的顱未出檀溪之水秦王飛雉猶向南陽之城六年以公為使持節都督三荊二襄南雍平信江隨郢浙一十二州諸軍事荊州刺史東南道行臺僕射楚城鄰境實有讓田吳人對營無妨贈藥部內屬城為人所訟公遂集文武肉袒自罰兄弟不讓延壽責躬吏民有過翁歸引咎天子異之璽書勞問贈賄加幣王人接踵大丞相書云此之美事耳目之所未經歎賞無極故遣專使公善於撫馭長於接引山藪無棄苞苴不行示人赤心與人顏色盜不敢發民不忍欺至是將校耆老於州城之南起清德之樓勒賢臣之頌杜鎮南之作牧當世樹碑竇車騎之臨戎生年刻石方之今日彼獨何人于時戶口日增荒萊畢墾華實紛敷黔黎茂豫但恐袞職有闕待公而補鼎飪未和須公而正是以漢陰民望荊南杞梓竝皆上書詣闕連名乞留河內之借寇恂更慚謁帝交州之請士燮還著上表九年授車騎大將軍儀同三司十二年除大行臺尚書仍為大丞相司馬以公識度嚴明志節清儉遂改公名儉字慶明非關書月詎待看碑幸得千畝不同二山無廢十三年加開府餘官如故十四年除尚書右僕射加侍中進驃騎大將軍居上星執法在文昌之位以公才望兼而有之十五年更除東南道行臺僕射都督十五州諸軍事行荊州事十六年大丞相總十六軍剋清河洛公又中分麾下參謀幃幄高選霸僚公為長史其年加都督南道三十六州諸軍事餘官如故南陽文學更遇王基章華袞衣還迎郭賀昔日伐蜀之謀張儀與秦昭計合平吳之利羊祜與晉武意同太祖始定成都即有江陵之志公密獻其策懸符深旨糧運久積梯衝立備一戰而舉鄢郢再戰而燒夷陵遂得席捲三荊此又公之勳也詔賞奴婢三百口太祖與公書云由公立計果如所謀公頃自鎮江陵以安蜀地後魏二年改武川昌寧郡開國公櫟陽居民非惟景丹之封曲逆戶口豈但陳平之國其年授大將軍太和之中曹真於府內受冊元封之末衛青於軍中即拜公之此比綽有餘榮詔曰吳人未復須助謀謨今使梁王兵馬受公節度三年加都督東南道五十三州諸軍事增邑萬戶維周革命光宅欽明作貳天官允諧邦治元年授小冢宰保定二年治蒲州刺史檢校六防諸軍事四年治襄州仍授柱國大將軍餘官如故秩登四岳階平六府豈不功重昭陽名高蔡賜控馭五十州風行數千里拔園葵而去織婦無三惑而絕四知一室之中未免虛白日膳之資三杯而已詔乃賜繒綵一千段粟麥二千斛天和元年陝州刺史都督八州二十防諸軍事解荊州總管餘悉如故路出王官城臨河曲戍清陝右高視棠陰部領宴煩晦明為疾天和四年謝病故京薨于私第春秋七十有八鑾蹕降臨軒懸徹樂九旒龍旆之錫三河騎士之送詔贈太保涼夏靈銀長原河鄯甘瓜十州諸軍事涼州刺史謚曰文公狀貌丘墟風神磊落玉山秀立喬松直上烟霞之涯際莫尋江海之波瀾不測少遭荼苦在山服終攀柏樹枯侵松獸死盡忠事國竭力從政其門如市其心若水奇策密謀百僚仰止忠貞亮直明主敬焉至如風后陰陽之占力牧星辰之度魏公子之兵書李將軍之射法莫不成誦在心取為時用居常服翫或以布被松床盤案之間不過桑杯石鼎遺令山陵一無所用公私贈襚竝不得受止依太祖陵側無忘事君墩等兄弟竝至性善居喪號慕墳埏奉遵遺訓是以衛青之塚仍陪漢武之陵管仲之墳即接齊桓之墓天和六年天子以四海未寧三方鼎峙有懷將帥之志言念封疆之臣既畫雲臺乃題麟閣更贈公為鄶國公邑五千戶追崇列辟事極神魂再改銘旌恩隆封墓公在民留愛身後見思吉日良辰郊祠野祭儀同趙超等六百九十七人表求立廟陳請象魏有詔許焉桂棟杏梁綠墀青瑣按歌會舞鳳蓋霓裳南浦送而行雲東風飄而零雨是知漢陽郡前非徒武侯之廟臨淄城下豈獨欒公之社嗚呼哀哉乃為銘曰道鍾屯剝世屬雲雷地軸左轉天關北開容車周室繫馬秦臺乃齊七政爰答三才烈祖燮諧九龔梁棟取才逢獵求賢入夢匡贊官雲謀猷紀鳳律定公族珪分職貢乃惟嗣德寔秉英靈身圖斗宿面繞樞星青衿敬業童子離經信陵虛左干木分庭忠孝純深樞機周密孔光不言曹參勿失溫席扇枕承顏悅膝凍浦魚驚寒林笋出肅肅風政沉沉器局直似貞筠溫如瑞玉清不置水明非舉燭馬願如羊金須似粟上將克昇元戎既序夏陽三捷夷陵一舉憑軾下齊凌江入楚鼎反歷室鐘歸大呂六卿咸事天官是司二南作伯棠陰實治清風有頌綠竹聞詩贈行之冊超然帝師昔侍蘭苑今陪杏林死生契闊無違一心風雲積慘山障連陰陵田野寂松逕寒深夏嬰之隴橋玄之墓馬見千年車回三步左無長樂前非武庫直望高碑增悲行路文苑英華九百五
