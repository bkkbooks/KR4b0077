body:
  text: 卷十擬連珠四十四首蓋聞經天緯地之才拔山超海之力戰陣勇於風飆謀謨出乎胸臆斬長鯨之鱗截飛虎之翼是以一怒而諸侯懼安居而天下息蓋聞蕭曹贊務雄略所資魯衛前驅威風所假是以黃池之會可以爭長諸侯鴻溝之盟可以中分天下蓋聞解封豕之結塞長蛇之源必須製裳千里喢血轅門是以開百里之圍用陳平之一策盟千乘之國須季路之一言蓋聞得賢斯在不藉揮鋒股肱良哉無論應變是以屈倪參乘諸侯解方城之圍干木為臣天下無西河之戰蓋聞邯鄲已危徒思馬服薊城去矣空用荊軻是以竹杖扶危不能正武擔之石蘆灰縮水不能救宣房之河蓋聞穴蟻衝泉未知遠慮玄禽巢幕何能支久是以大廈既焚不可灑之以淚長河一決不可障之以手蓋聞膏脣喋喋市井營營或以如簧自進或以狙詐相傾是以子貢使乎五都交亂張儀見用六國縱橫蓋聞謀猷是習權變須長時增齊竈或臥燕墻是以井陘之兵如鴻毛之遇火長平之卒若秋草之中霜蓋聞彼黍離離大夫有喪亂之感麥秀漸漸君子有去國之悲是以建章低昂不得猶瞻灞岸德陽淪沒非復能臨偃師蓋聞市朝遷貿山川悠遠是以狐兔所處由來建始之宮荊棘參天昔日長洲之苑蓋聞天方薦瘥喪亂弘多空思說劍徒聞枕戈是以劉琨之英略莫知自免祖逖之慷慨裁能渡河蓋聞穀林長遠蒼梧不從惟桐惟葛無樹無封是以隋珠日月無益驪山之火雀臺絃管空望西陵之松蓋聞雷驚獸駭電激風驅陵歷關塞枕跨江湖是以城形月偃陣氣雲鋪非綠林之散卒即驪山之叛徒蓋聞死別長城生離函谷遼東寡婦之悲代郡孀妻之哭是以流慟所感還崩杞梁之城灑淚所沾終變湘陵之竹蓋聞三世用兵既非貽厥陰謀累葉必以凶終是以李都尉之風霜上蘭山而箭盡陸平原之意氣登河橋而路窮蓋聞營魂不反燐火宵飛時遭獵夜之兵或斃空亭之鬼是以射聲營之風雨時有冤魂廣漢郡之陰寒偏多夜哭蓋聞江黃戎馬之徼鄢郢風飆之格乍有去而不歸或無期而遠客是以章華之下必有思子之臺雲夢之傍應多望夫之石蓋聞無怨生離恩情中絕空思出水之蓮無復迴風之雪是以樓中對酒而綠珠前去帳裏悲歌而虞姬永別蓋聞樹彼司牧既懸百姓之命及乎厭世復傾天下之心是以一馬之奔無一毛而不動一舟之覆無一物而不沉蓋聞嚴霜之零無所不肅長林之斃無所不摽是以楚塹既填遊魚無託吳宮已火歸燕何巢蓋聞名高八俊傷於閹豎之黨智周三傑斃於婦女之計是以洪澤之蛟遂挫長饑之虎平皋之蟻能摧失水之龍蓋聞吳艘蜀艇不能無水而浮以紅間綠不能無弦而射是以籠樊之鶴寧有六翮之期骯髒之馬無復千金之價蓋聞性靈屈折鬱抑不揚乍感無情或傷非類是以嗟怨之水特結憤泉感哀之雲偏含愁氣蓋聞遷移白羽流徙房陵離家析里悽恨撫膺是以吳起之去西河潸然出涕荊軻之別燕市悲不自勝蓋聞廉將軍之客館翟廷尉之高門盈虛倏忽貴賤何論是以平生故人灌夫不去門下賓客任安獨存蓋聞執珪事楚博士留秦晉陽思歸之客臨淄羈旅之臣是以親友會同不妨懷撫悽愴山河離異不妨風月關人蓋聞五十之年壯情久歇憂能傷人故其哀矣是以譬之交讓實半死而言生如彼梧桐雖殘生而猶死蓋聞秋之為氣惆悵自憐耿恭之悲疎勒班超之念酒泉是以韓非客秦避讒無路信陵在趙思歸有年蓋聞懸鶉百結知命不憂十日一炊無時何恥是以素王之業乃東門之貧民孤竹之君實西山之餓士蓋聞胸中無學猶手中無錢今之學也未見能賢是以扶風之高鳳無故棄麥中牟之甯越徒勞不眠蓋聞十室之邑忠信在焉五步之內芬芳可錄是以日南枯蚌猶含明月之珠龍門死樹尚抱咸池之曲蓋聞百尺之高累於九碁之上千鈞之重懸於一木之枝是以截虎尾而非險傷龍鱗而未危蓋聞居蘭處鮑在其所習白羽素絲隨其所染是以金性雖質處劍即凶水德雖平經風即險蓋聞豫章七年斃於豐草芳蘭九畹淪於幽谷是以欲求其真晉陽有自埋之蒿若賞其聲吳亭有已枯之竹蓋聞明鏡蒸食未為得所干將補履尤可傷嗟是以氣足凌雲不應止為武騎才堪王佐不應直放長沙蓋聞勢之所歸威之所假必能繫風捕影暴虎馮河是以輕則鴻毛沉水重則磐石凌波蓋聞意氣難干非資扛鼎風神自勇無待翹關是以曹劌登壇汶陽之田遽反相如睨柱連城之璧更還蓋聞卷葹不死誰必有心甘蕉自長故知無節是以螺蚌得路恐異驪淵雀鼠同歸應非丹穴蓋聞北邙之高魏君不能削穀洛之鬭周王不能改是以愚公何德遂荷鍤而移山精衛何禽欲銜石而塞海蓋聞君子無其道則不能有其財忘其貧則不能恥其食是以顏回瓢飲賢慶封之玉杯子思銀珮美虞公之垂棘蓋聞水之激也實濁其源木之蠹也將拔其根是以延年之家預論掃墓羊舌之族先知滅門蓋聞磨礪脣吻脂膏齒牙臨風扇毒向影吹沙是以敬而遠之豺有五子吁可畏也鬼有一車蓋聞虛舟不忤令德無虞忠信為琴瑟仁義為庖廚是以從莊生則萬物自細歸老氏則眾有皆無蓋聞三關頓足長城垂翅既羈既旅非才非智是以烏江艤楫知無路可歸白雁抱書定無家可寄文苑英華七百七十一
