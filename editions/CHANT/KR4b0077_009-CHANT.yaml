body:
  text: 卷九謝滕王集序啟某啟伏覽制垂賜集序紫微懸映如傳闕里之書青鳥遙飛似送層城之璧若夫甘泉宮裏玉樹一叢玄武闕前明珠六寸不得譬此光芒方斯照燭有節有度即是能平八風愈唱愈高殆欲去天三尺殿下雄才蓋代逸氣橫雲濟北顏淵關西孔子譬其毫翰則風雨爭飛論其文彩則魚龍百變蒲桃繞館新開碣石之宮修竹夾池始作睢陽之苑琉璃泛酒鸚鵡承杯鳳穴歌聲鸞林舞曲況復行雲逐雨迴雪隨風湖陽之尉既成為喜之因舂陵之侯便是銷憂之地某本乏材用無多述作加以建鄴陽九劣免儒硎江陵百六幾從士隴至如殘編落簡竝入塵埃赤軸青箱多從灰燼比年痾恙彌留光陰視息桑榆已逼蒲柳方衰不無秋氣之悲實有途窮之恨是以精采瞀亂頗同宋玉言辭蹇吃更甚揚雄一吟一詠其可知矣好事者不求知音者不用非有班超之志遂已棄筆未見陸機之文久同燒硯至於凋零之後殘缺所餘又已雜用補袍隨時覆醬聖慈憐愍遂垂存錄始知揄揚過差君子失辭比擬縱橫小人迷惑荊玉抵鵲正恐輕用重寶龍淵削玉豈不徒勞神慮匠石迴顧朽材變於彫梁孫陽一言奔蹄成於駿馬故知假人延譽重於連城借人羽毛榮於尺玉溟池九萬里無踰此澤之深華山五千仞終愧斯恩之重即日金門細管未動春灰石壁輕雷尚藏冬蟄伏願聖躬與時納豫南陽寶雉幸足觀瞻酈縣菊泉差能延壽伏遲至鄴可期從梁有日同杞子之盟會必欲瞻仰風塵共薛侯而來朝謹當逢迎冠蓋魚腸尺素鳳足數行書此謝辭終知不盡謹啟文苑英華六百五十六答趙王啟某啟仰承張幕全韓連營上地澠池置陣解鄧禹之圍函谷開關削王元之印蜂旗朝上刁斗夜鳴彌雄壯士之心足起橫行之志況復才人出娉還得賢夫塞外有夫人之城軍中有女子之氣都尉青旗即時春色將軍大樹已復花開雲氣浮壘流星泛枕細舞長歌橫簫直笛當乎此時青雲之上信不學無術本分泥沉忽逢天造搜揚仄陋今者遂總憲司預聞刊鼎獻歲刑書既應懸法上春木鐸方須狥人但年髮已秋性靈久竭嘉石肺石無以測量舌端筆端惟知繁擁乖展一月遂涉兩年傾首東瞻山河千里風塵未盡霜露霑衣仰願珍宜以為身寶謹啟文苑英華六百六十五謝趙王示新詩啟某啟鄭叡至奉手教累紙并示新詩八體六文足驚毫翰四始六義實動性靈落落詞高飄飄意遠文異水而湧泉筆非秋而垂露藏之山巖可使雲霧鬱起濟之江浦必當蛟龍繞船首夏清和聖躬怡裕琉璃彤管鵲顧鸞迴婉轉綠沉猿驚鴈落下風傾首以日為年犍為舍人實有誠願碧鷄主簿無由遂心寂寞荊扉疎蕪蘭徑驂駕來梁未期卜日遣騎到鄴希垂枉道文苑英華八百五十六謝趙王賚絲布等啟某啟鄭叡至蒙賜絲布綾等十段王褒至又蒙許賜錢等望外之恩實符大賚非常之錫乃溢生涯曳練且觀無勞白馬之望流泉欲委佇見青鳧之飛楊池掘荷李園移樹既欣谷利彌思青木陳留下粟有媿深恩櫟陽雨金翻慚曲施靈臺久客從此數炊黍谷長寒於今更暖從雲夢之田不踰此樂得豐城之劍未均斯喜謹啟文苑英華六百五十五謝趙王賚絲布啟某啟奉教垂賚雜色絲布三十段去冬凝閉今春嚴勁霰似瓊田凌如鹽浦張超之壁未足鄣風袁安之門無人開雪覆鳥毛而不暖燃獸炭而逾寒遠降聖慈曲垂矜賑諭其蠶月殆罄桑車津實秉杼幾空織室遂令新市數錢忽疑販綵平陵月夜驚聞擣衣妾遇新縑自然心伏妻聞裂帛方當含笑莊周車轍實有涸魚信陵鞭前元非窮鳥仰蒙經濟伏荷深慈謹啟文苑英華六百五十五謝趙王賚絲布啟某啟某息苟娘昨蒙恩引曲賜絲布等五段南冠獲宥既預禮延稚子勝衣還蒙拜謁關尹津梁之織鄴地雙絲扶風彩文之機仙園獨繭青衿宜襲書生無廢學之詩春服既成童子得雩沂之舞況復栖烏挾子同知桂樹之恩澤雉將雛共喜行春之令根株一潤枝葉俱榮謹啟文苑英華六百五十五謝趙王賚白羅袍袴啟謝趙王賚白羅袍袴啟某啟垂賚白羅袍袴一具程據上表空論雉頭王恭入雪虛稱鶴氅未有懸機巧綜變躡奇文鳳不去而恆飛花雖寒而不落披千金之暫暖棄百結之長寒永無黃葛之嗟方見青綾之重對天山之積雪尚得開衿冒廣樂之長風猶當揮汗白龜報主終自無期黃雀謝恩竟知何日藝文類聚八十五文苑英華六百五十五謝滕王賚巾啟某啟奉教垂賜鹿子巾一枚解角新胎戴藤初孕落星交映連珠疎點盤龍之刀既剪長命之縷仍縫翠羽懸推芙蓉高讓遊斯隱士足笑鼓皮入彼春林方誇笋籜某蓬鬢鬆颯衰容耆朽三秋不沐實荷今恩十年一冠彌欣此賚謹啟文苑英華六百五十五謝明皇帝絲布等啟謝明皇帝絲布等啟臣某啟奉敕垂賜雜色絲布綿絹等三十段銀錢二百文某比年以來殊有闕乏白社之內拂草看冰靈臺之中吹塵視甑懟妻狠妾既嗟且憎瘠子羸孫虛恭實怨王人忽降大賚先臨天帝賜年無踰此樂仙童贈藥未均斯喜張袖而舞玄鶴欲來撫節而歌行雲幾斷所謂舟楫無岸海若為之反風薺麥將枯山靈為之出雨況復全抽素繭雪坂疑傾併落青鳧銀山或動是知青牛道士更延將盡之命白鹿真人能生已枯之骨雖復拔山超海負德未勝垂露懸針書恩不盡蓬萊謝恩之雀白玉四環漢水報德之虵明珠一寸某之觀此寧無愧心直以物受其生於天不謝謹啟文苑英華六百五十五謝趙王賚犀帶等啟某啟奉教垂賚犀裝帶錢十貫魏君寶帶特賜劉楨趙王國租偏資裴楷貫藏文馬如燒安息之銀帶插通犀似獵雲南之獸北郭騷之長貧是所甘愜南宮敬之載寶殊非念望花開四照唯見其榮鼇戴三山深知其重昔沈羲將盡逢司命而還生士燮行埋值仙人而更活今日慈矜斯之謂矣馬前驅而導路或似識恩雞未曉而開關容能報主謹啟文苑英華六百五十五謝趙王賚米啟某啟奉教垂賚米十石丹烏銜穟既集西周黃雀隨車還飛東市漬而為種不無霜雪之精取以論兵即有山川之勢某陋巷簞瓢櫛風沐雨剝榆皮於秋塞掘蟄鷰於寒山仰費國租遂開塵甑非丹竈而流珠異荊臺而炊玉東方朔之捧米既息長饑西門豹之墾田方慚此賚藝文類聚七十二文苑英華六百五十五謝趙王賚乾魚啟某啟蒙賚乾魚十番醴水朝浮光疑朱鼈文鰩夜觸翼似青鸞況復洞庭鮮鮒溫湖美鯽波瀾成雨鱗甲防寒某本吳人常想江湖之味及其饑也唯資藜藿之餘慈賚渥恩膏腴流竈不勞獅子之亭即勝雷池之長翻驚河伯獨不受人足笑任公終年垂釣謹啟文苑英華六百五十五謝滕王賚馬啟某啟奉教垂賚烏騮馬一匹柳谷未開翻逢紫鷰陵源猶遠忽見桃花流電爭光浮雲連影張敞畫眉之暇直走章臺王濟飲酒之歡長驅金埒謹啟藝文類聚九十三文苑英華六百五十五謝滕王賚豬啟某啟奉教垂賚肥豕一腔白頭見珍度遼東之水赤欄為重對襄陽之城忽降全恩謹充炮烙孫弘牧於淄水唯以求錢卜式養於上林豈知其味謹啟文苑英華六百五十五謝趙王賚馬并繖啟某啟奉教垂賚紫騮馬并銀釘乘具紫紬繖一張上天降雨特垂深澤若水流光偏蒙私照迴茲翠蓋事重劉基之恩降此青驪榮深李忠之賜北部丹帷便須高捲西河竹馬即已郊迎在命之輕鴻毛浮於弱水知恩之重龜背負於靈山況復驚鴻別水但見徘徊黃鶴去關唯知反顧棲戀之心事同於此文苑英華六百五十五謝趙王賚雉啟夏翟秋飛江翬春澗中牟縣之客遂得坐觀賈大夫之妻已應含笑仰費中廚來供下客山川道遠口腹知恩藝文類聚九十
