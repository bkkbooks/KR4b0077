body:
  text: 卷十二自古聖帝名賢畫讚二十七首黃帝見廣成子黃帝見廣成子治身紫府問政青丘龍湖鼎沒丹竈珠流興雲即雨落木先秋至道須極長生可求藝文類聚十一文苑英華七百八十堯登壇受圖讚堯登壇受圖讚登壇洛汭沉玉河湄丹圖馭馬緑甲乘龜榮光上幕休氣連帷雖存克讓於見文思藝文類聚六十四文苑英華七百八十舜舞干戚讚舜舞干戚讚平風變律擊石來儀先齊七政更服三危朱干獨舞玉戚空麾南風一曲恭己無為藝文類聚十一文苑英華七百八十禹渡江讚禹渡江讚三江初鑿九谷新成風飛鷁涌水起龍驚樂天知命無待憂生危舟遂靜亂楫還平藝文類聚十一御覽八十二文苑英華七百八十湯解祝網讚湯解祝網讚連珠兩起合玉雙沉穀為祥樹桑成樂林三方落網一面驅禽德矣聖政仁乎用心藝文類聚十二文苑英華七百八十文王見呂尚讚文王見呂尚讚言歸養老垂釣西川岸止磻石溪唯小船風雲未感意氣怡然有此相望于茲幾年藝文類聚十二御覽八十四文苑英華七百八十武丁迎傅說讚虞田路斷辭澗泉飛躬勞版築有弊韋衣賢臣入夢天賜無違千巖之下遂得同歸文苑英華七百八十成王刻桐葉封虞讚成王刻桐葉封虞讚虞叔百里居河之汾帝刻桐葉天書掌文禮以成德樂以歌薰天子無戲唐其有君藝文類聚十二文苑英華七百八十漢高祖置酒沛宮讚漢高祖置酒沛宮讚遊子思舊來歸沛宮還迎故老更召歌童雖欣入沛方念移豐酒酣自舞先歌大風藝文類聚十二文苑英華七百八十漢武帝聚書讚漢武帝聚書讚獻書路廣藏書柱開秦儒出谷漢簡吹灰芝泥印上玉匣封來坐觀風俗不出蘭臺藝文類聚十二文苑英華七百八十袁盎諫文帝讚千乘峻轍六轡危行跡回松坂山斜柳城龍淵地狹華蓋風驚賢臣攬轡可謂忠貞初學記十七文苑英華七百八十朱雲折檻讚上書直諫有忤明君先求斬馬遂請魚文身摧欄檻義烈風雲應從御史翻賴將軍初學記十七文苑英華七百八十周公戒伯禽讚周公戒伯禽讚伯禽居魯鳴玉來朝周公政治為國風謠北山有梓南山有橋禮容雖備俯仰無驕藝文類聚二十三文苑英華七百八十五月披裘負薪讚五月披裘負薪讚披裘當夏俗則為心雖逢季子不拾遺金禽巢欲遠魚沉唯深清聲滅跡何必山林藝文類聚三十六文苑英華七百八十王祥扣冰魚躍讚王祥之母鮮鱗是求冰連釣浦凍塞寒流精誠有感無假沉鉤二老同膳雙魚共浮文苑英華七百八十孫叔敖逢蛇讚孫叔敖逢蛇讚叔敖朝出容悴還家母氏顧訪知埋怪蛇爾有陰德陽報將加終為楚相卒享榮華藝文類聚九十六文苑英華七百八十高鳳好書不知流麥讚高鳳好書不知流麥讚高鳳好學專心不回流連經笥對玩書臺石門雲渡銅梁雨來麥流雖遠書卷猶開藝文類聚六十五文苑英華七百八十張良遇黃石公讚張良遇黃石公讚張良取履跪授無辭兵書一卷長者三期昔稱韓相今為漢師穀城餘石還歸舊祠藝文類聚三十六文苑英華七百八十師尚父授丹書讚尚父一遇周王是親赤雀既下丹書已陳自論秉鉞長別垂綸獨有磻石留名渭濱文苑英華七百八十榮啓期三樂讚榮啓期三樂讚榮期三樂唯人與年夫子相遇即以為賢性靈造化風雲自然雅琴雖古獨有鳴絃藝文類聚三十六文苑英華七百八十夫子見程生讚程生夫子一遇相知薄言傾蓋桑陰遂移清陽共美賢聖同羈陳詩難別贈絹傷離文苑英華七百八十鉏麑見趙盾讚趙盾將朝端衣整笏鉏麑受命衝冠怒髮惆悵賢臣顧瞻城闕利劍不抽青槐先絶文苑英華七百八十蔡澤就唐生相讚蔡澤就唐生相讚蔡澤羈旅唐生決疑無勞神策不問靈龜富貴自取年壽須期雖云異相會待逢時藝文類聚七十五文苑英華七百八十李陵蘇武別讚李陵北去蘇武南旋歸驂欲動別馬將前河橋兩岸臨路悽然故人此別知應幾年文苑英華七百八十樊噲見項王讚樊噲將軍漢王車右不憚鋒刃何辭巵酒霸上屯軍鴻門固守持謝范增唯留玉斗文苑英華七百八十秦穆王飲盜駿馬讚秦穆王飲盜駿馬讚駿馬遇盜秦王不嗔先傾美酒翻畏傷人鄰兵向國窮寇侵秦于時大盜還作功臣藝文類聚九十三文苑英華七百八十延陵季子遇徐君讚徐君有禮季子惟賢經過一遇如舊依然人非別後心許生前長松雖合寶劍猶懸文苑英華七百八十鶴讚鶴讚武成二年春二月雙白鶴飛集上林園大將鄭偉布弋設罝竝皆禽獲六翮已摧雙心俱怨相顧哀鳴孤雄先絶孀妻向影天子愍焉信奏事階墀立使為讚九皋遙集三山回歸華亭別唳洛浦仙飛不防離繳先遭見羈籠摧月羽弋碎霜衣塞傳餘號關承舊名南遊湘水東入遼城雲飛欲舞露落先鳴六翮摧折九門嚴閉相顧哀鳴肝心斷絶松上長悲琴中永別藝文類聚九十文苑英華七百八十四並序秦州天水郡麥積崖佛龕銘並序麥積崖者乃隴底之名山河西之靈嶽高峰尋雲深谷無量方之鷲島迹遁三禪譬彼鶴鳴虛飛六甲鳥道乍窮羊腸或斷雲如鵬翼忽已垂天樹若桂華翻能拂日是以飛錫遙來度杯遠至疏山鑿洞鬱為淨土拜燈王於石室乃假馭風禮花首於山龕方資控鶴大都督李允信者籍於宿植深悟法門乃於壁之南崖梯雲鑿道奉為亡父造七佛龕似刻浮檀如攻水玉從容滿月照曜青蓮影現須彌香聞忉利如斯塵野還開說法之堂猶彼香山更對安居之佛昔者如來追福有報恩之經菩薩去家有思親之供敢緣斯義乃作銘曰鎮地鬱盤基乾峻極石關十上銅梁九息百仞崖橫千尋松直陰兔假道陽烏回翼載䉊疏山穿龕架嶺糾紛星漢回旋光景壁纍經文龕重佛影雕輪月殿刻鏡花堂橫鐫石壁暗鑿山梁雷乘法鼓樹積天香嗽泉珉谷吹塵石床集靈真館藏仙冊府芝洞秋房檀林春乳水谷銀沙山樓石柱異嶺共雲同峰別雨冀城餘俗河西舊風水聲幽咽山勢崆峒法雲常住慧日無窮方域芥盡不變天宮文苑英華七百八十五終南山義谷銘並序終南山義谷銘並序周保定二年歲次壬午七月己巳朔大冢宰晉國公命鑿石關之谷下南山之材維公匡濟彝倫弘敷庶績燮理餘暇披閲山經以為終南敦物日月虧蔽杶幹栝柏椅桐梓漆年代蘊積于何不有乃謀山澤之官兼引衡虞之匠東出藍田則控灞乘滻西連子午則據涇浮渭派別八溪流分九谷銅梁四柱石關雙啓青綺春門溝渠交映緑槐秋市舟楫相通蓄之則為屯雲泄之則為行雨青牛文梓白鶴貞松運以置宮崇斯雲屋千櫨抗殿龍首干雲萬頃踈苗蟬鳴再熟川后讓德山靈景從豈如運石甘泉才通櫟陽之殿穿渠穀水直繞金墉之城將事未勞為功實重國富人殷方傳千載因功立事敢勒山阿銘曰寥廓上浮崢嶸下鎮壁立千丈峰橫萬仞桂月危懸風泉虛韻乘輿嶺阪舉鍤雲根八溪分注九谷通源北涵桐井南浮石門模象大壯規繩百堵膠葛九成徘徊千柱桂棟凌波柏梁垂雨疏川奠谷落實摧柯事均刊木功侔鑿河初學記五文苑英華七百八十七玉帳山銘玉帳山銘玉帳寥廓崑山抵鵲揔葉成帷連雲起幕玉策難移金花不落隱士彈琴仙人看博巖留舊鼎竈聚新荊煮石初爛燒丹欲成桑田屢變海水頻盈長聞鳳曲永聽簫聲文苑英華七百八十七藝文類聚七以為庾肩吾作吹臺山銘江寧吹嶺雖山出筠秦簫下鳳此岫為真青槐避日朱草司晨石名新婦樓學仙人吳中字玉城南姓秦比花依樹登榭要春舞能留客聲便度新雕梁數振無復輕塵文苑英華七百八十七望美人山銘望美人山銘高唐礙石洛浦無舟何處相望山邊一樓峰因五婦石是三侯嶮踰地肺危陵天柱禁苑斜通春人常聚樹裏聞歌枝中見舞恰對粧臺諸窗晝開斜看已識直喚便回豈同織女非秋不來文苑英華七百八十七藝文類聚七以為徐陵作至仁山銘峰橫鶴嶺水學龍津瑞雲一片仙童兩人三秋雲薄九日寒新真花暫落畫樹常春橫石臨砌飛簷枕嶺壁繞藤苗窗銜竹影菊落秋潭桐疏寒井仁者可樂將由愛靜文苑英華七百八十七明月山銘竹亭標嶽四面臨虛山危簷迥葉落窗疏看椽有笛對樹無風風生石洞雲出山根霜朝唳鶴秋夜鳴猿堤梁似堰野路疑村船橫埭下樹夾津門寧殊華蓋詎識桃源文苑英華七百八十七行雨山銘行雨山銘山名行雨地異陽臺佳人無數神女羞來翠幔朝開新粧旦起樹入床頭花來鏡裏草緑衫同花紅面似開年寒盡正月遊春俱除錦帔併脫紅綸天絲劇藕蝶粉生塵橫藤礙路弱柳低人誰言洛浦一箇河神藝文類聚七文苑英華七百八十七刀銘三首風伯吹爐雲師煉冶鐵焰朝流金精夜下價重十城名高千馬千金穎合百鍊鋒成光連斗氣焰動山精身文水動刃古珠生斗精遙降山靈下從水文千曲蛇鱗百重燕砥斂刃蜀水開鋒氣生分景環成屈龍文苑英華七百八十九思舊銘並序歲在攝提星居監德梁故觀寧侯蕭永卒嗚呼哀哉人之滅也既非金石所移士之悲也寧有春秋之異高臺已傾稷下有聞琴之泣壯士一去燕南有擊筑之悲項羽之晨起帳中李陵之徘徊岐路韓王孫之質趙楚公子之留秦無假窮秋於時悲矣況復魚飛武庫預有棄甲之徵鳥伏翟泉先見橫流之兆星紀吳亡庚辰楚滅紀侯大去鄅子無歸原隰載馳轘轅長別甲裳失矣餘皇棄焉河傾酸棗杞梓與樗櫟俱流海淺蓬萊魚鱉與蛟龍共盡焚香復道詎假遊魂載酒屬車寧消愁氣芝蘭蕭艾之秋形殊而共瘁羽毛鱗介之怨聲異而俱哀所謂天乎乃曰蒼蒼之氣所謂地乎其實摶摶之土怨之徒也何能感焉雕殘殺翮無所假於風飆零落春枯不足煩於霜露幕府昔開賢俊翹首為羈終歲門人謝焉至於東首告辭西陵長往山陽車馬望別郊門潁川賓客遙悲松路嵇叔夜之山庭尚多楊柳王子猷之舊徑唯餘竹林王孫葬地方為長樂之宮烈士埋魂即是將軍之墓昔嘗歡宴風月留連追憶平生宛然心目及乎垂趐秦川關河羈旅降乎悲谷之景實有憂生之情美酒酌焉猶思建鄴之水鳴琴在操終思華亭之鶴重為此別嗚呼甚哉麟亡星落月死珠傷瓶罄罍恥芝焚蕙歎所望鐘沉德水聲出風雲劍沒豐城氣存牛斗潸然思舊乃作銘云風雲上慘舟壑潛移駸駸霜露君子先危紀侯大去懷王不返玉樹長埋風流遂遠荀伯舊縣慶封餘邑萬里歸魂修門詎入墳橫武庫山枕盧龍思歸道遠返葬無從徒留送雁空靡長松平陵之東無復梧桐松聲蕭瑟長起秋風疇昔隆貴提攜語默託情嵇阮風雲相得有酒如澠終溫且克朝陽落鳳大野傷麟佳城鬱鬱流寓於秦山陽相送唯餘故人孀機嫠緯獨鳳孤鸞閨深夜靜風高月寒生平已矣懷舊何期匣中絃絶鄰人笛悲昔為幕府今成繐帷藝文類聚三十四文苑英華七百九十
