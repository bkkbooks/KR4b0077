body:
  text: 卷十五周大將軍襄城公鄭偉墓志銘公諱偉字子直滎陽開封人也周宣母弟就封於鄭河洛之地即有民人虢鄶之君非無郡邑其後蛇鬭於門黿嘗於鼎韓侵負黍晉滅陽城其祀忽諸以國為氏祖徹撫軍贈濟州刺史父先護驃騎大將軍儀同三司襄城郡公青州刺史永安中洛城晝掩黃河凌合翟泉會盟之地蒼鳥忽飛武庫兵欄之中鱗魚遂上三帥北絏五馬南浮梁武帝大造中原樹君伊洛公憑軾棧車言歸舊壤起為通直散騎侍郎天厭魏德政在強臣公恥入亂階乃於陳留起義太祖封函谷而待諸侯坐酆宮而朝群后威懷是接席卷西飛大統三年入朝蒙授武陽縣開國伯食邑六百戶尋除龍驤將軍北徐州刺史開河橋之陳解玉璧之圍張旃於富平被練於伊闕探虎穴而揮戈上魚門而懸胄故以策名司勳功高舍爵魏將侯景狼顧荊河天子命我偏師赴接垂餌虎口中途背盟事獲交綏公之力也除中軍將軍散騎常侍大都督襲襄城郡公食邑二千戶仍除使持節車騎大將軍儀同三司餘如故遷驃騎大將軍開府加侍郎常伯位重霍去病之登朝上將官尊公孫敖之出塞以今方昔異代同榮魏後二年授大將軍江陵防主都督十五州諸軍事吳兵教士艫舳習流島嶼憑陵波瀾衝激公暫臨江界已悉南越之兵裁泛樓船即善昆彌之戰遂得安歌澧浦弭節涔陽留魯侯而宴章臺對齊人而畋雲夢周保定元年授使持節都督宜州諸軍事宜州刺史天和六年授都督華州刺史餘如故崤函重嶂汧渭分流陽陵之溢既奔華陰之學還聚而消渴連年屢有相如之患至於大漸遂如范增之疾桐君對藥分闕神明李柱侍醫更無方便以天和六年四月十七日薨年五十七詔贈本官加少傅都督司豫洛相冀五州諸軍事司州刺史諡曰肅公禮也天子輟朝彌深大臣之誼群公會葬咸得同盟之禮夫人李氏頓丘貴姓卿相之門賢才之室霜露先侵策封郊次以其年十一月六日合葬於咸陽之長安縣某原合葬非古既異三王之前死則同穴還同六載之始雖復銜珠兩鶴同歸紫蓋之松出匣雙龍共沒延平之水嗚呼哀哉乃薦銘曰國有巖邑朝多君子武公莊公平王卿士溫麥渝盟祊田廢祀驂乘停輿來朝識履惟祖惟考既侯既公樞機周密出納清通治繁政簡處亂心雄濟河遺惠海岱餘封世濟其美載誕其器忠無不為孝則不匱幽冀紛梗關河鼎沸自北自南聲聞梁魏揚旌汝潁威震三川擁旄江漢席捲樓船成皋塵起廣武烽燃麋興鹿箭鴈落驚弦揔衛蘭錡申威河外山類鼓樓樹如車蓋都護兩道將軍獨拜梧桐茂苑楊柳倡家千金回雪百日流霞凋零倏忽悽愴榮華河陽古樹金谷殘花隴昏雲暝山深路晚風氣才高松聲即遠疇昔親友歡愈交結不為平生應為此別文苑英華九百四十七周驃騎大將軍開府侯莫陳道生墓志銘君諱道生字某朔州武川人也本系陰山出自國族降及於魏在秦作劉父少興武川鎮將山河抗拒關塞被邊早擅威聲咸多雄烈君子讀書馬上清談劍端獨運六奇專精三略雖復身居末將而勇冠旌門位在支軍而謀參幕府魏正光五年任統軍隸天柱爾朱榮征北海王永安三年隨太師賀拔勝入關尋轉別將滑源卷甲關城束馬並皆剋捷君有力焉永熙三年補都督太祖文皇帝奄有關河令行天下以君幹略委之爪牙名洽中涓功參上造兵臨河曲前登白馬之津寇發蒲城先戰黃沙之苑臨晉橫船既禽趙將馬陵削樹復下齊兵班瑞司勳披圖疏爵授驃騎大將軍金紫光祿大夫鄠縣開國公食邑五百戶趙儼之為驃騎止駕單車張湛之拜光祿長乘白馬以斯連類朝野榮之大統九年更姓侯莫陳氏隨大將軍拓跋遠經始陽二水長鬭三川無市擐甲搆病死於轅門春秋五十一贈持節都督朔州刺史君在武川文皇帝同鄉里霸功既立王業克成不忘捨講猶論償博今嗣德惟新功臣追遠東都馬鳴不無見日之歎北陵車過終憶平生之言有詔更贈使持節驃騎大將軍開府儀同三司都督宜敷絳三州諸軍事敷州刺史諡某公禮也夫人拓跋氏安邑郡夫人庭有鐘鼓家承針誡教容教德言告言歸天和五年六月薨即以其年十月同葬於京兆某縣洪源鄉武子成寢請西階而合葬平陽下嫁即廬山而共墳銘曰凝陰遠寂廣漠平寒沙窮瀚海地盡皋蘭塞鴻秋去胡桑夏乾風土壯氣山河凜然師旅上谷威雄武川君則繼踵代不乏賢匣有忠劍庭流孝泉魏室多故餘風未殄天保讓德當途廢典上將指蹤中涓力展洛城夜捷河梁朝剪鐵劍金龜榮追玉鉉身胄漢祚門承魏緒並擅華宗俱稱當路伉儷云匹年齡並故趙瑟秦聲同為丘墓小陵石槨洪原鄉墓芻靈兩引池柳雙前隧路仍合松城即連霜隨柳白月逐墳圓芝蘭幾代陵谷何年文苑英華九百四十七周車騎大將軍贈小司空宇文顯墓志銘公諱顯字某上黨武鄉人也自大霧浮河長虹映渚承源於若水纂系於蒼林上黨居韓之西常山在趙之北因地為氏可略而言焉祖求南衛將軍冀州刺史父金殿征南將軍定州刺史並控鶴兵俱張戎樂聲榮之盛繼踵當年周車騎大將軍贈小司空宇文顯墓志銘公稟山嶽之靈擅風雲之氣容止矜莊聲名籍甚彎弧挽強左右馳射故得名高上谷威振樓煩襲爵安吉縣侯食邑五百戶永興三年幽并叛換有無君之心帝顧謂公曰天下洶洶將若之何公曰擇善而從之乃誦詩云彼美人兮西方之人兮帝曰是吾心也乃定入關之策以公母老家大令預為計公曰今日之事忠孝不並君不密則失臣臣不密則失身帝愴然改容曰卿是我王陵遷朱衣直閣閣內大都督改封長廣縣公邑一千五百戶武帝初至潼關太祖親迎溱水太祖素知公名而未之識也目於衆疑而不問直云令此人射水傍小烏應手即著太祖喜云我知卿名矣即用為帳內都督滄州諸軍事滄州刺史增邑并前二千五百戶黃公衡之決事魏后是以推心潘承明之忠壯吳王為之降禮異代同榮見之今日東夏邊隅地連荒服井陘塞道飛狐路斷乃以公為使持節衛將軍都督東夏州諸軍事東夏州刺史白波青犢之兵銅馬金繩之亂莫不交臂屈膝牽羊抱馬在州遘疾解任還朝小馬留廄餘狀挂衽吏人攀戀刊石陘山雖非漢陽之城還似扶風之路授使持節車騎大將軍儀同三司加散騎常侍以魏後元年疾甚亡於同州春秋五十七天子輟樂群公會喪太祖親臨弔祭哀慟左右于時兵革交侵普斷贈諡即以本官印綬權葬於同州之北山今建德二年二月二十三日遷葬於咸陽長安縣之洪瀆原時逢禮樂之遷代屬謳歌之變國雖異政人足追榮乃贈使持節驃騎大將軍開府儀同三司小司空丹延綏三州諸軍事延州刺史諡某公禮也夫人高氏渤海人也柔參晉政拒曹爽之異謀起在漢庭共王陵而俱對況乎針訓有儀言容以德肅恭中饋賢才內則豈直不聽雜樂以變齊國之風不食鮮禽以斷荊王之獵昔之合葬季武子之西寢今之同穴長平侯之北陵世子神舉兄弟至性純孝善居喪禮有終有始於身無改是以宦成名立孝顯忠存銘曰北嶽二名蔥河兩本其峻惟極其源惟遠俗稟山川人資台袞義烈桓桓才雄悃悃乃祖乃父繼踵威雄摐金北陸鳴玉南宮隱若吳漢賢哉竇融貴霜依德無雷向風挺此含章生茲秉德孝實天性忠為人則暢轂鏤膺燕南趙北若水將通九部可勒帷幄參謀宮闈典職善擇忠言能防變色繁弱已徑淇園乃直戟中小支禽穿左翼建旟赤谷揮戈武州長城萬里河水雙流潁川多恙淮水未瘳義重穿壁恩深置郵于谷之口于渭之陽丘山零落碑闕低昂草銜秋火樹抱春霜書劍俱沒人琴並亡哀哀嗣子純心靡託孝水未枯悲松先落室進巢鵀門通弔鶴功臣身殞會圖麟閣文苑英華九百四十七周大將軍琅琊莊公司馬裔墓志周大將軍琅琊莊公司馬裔墓志公諱裔字遵胤河內溫人也南正司天北正司地是謂羲和之官即嗣重黎之政卬之歸楚與章邯而並封豫之避秦共毛公而俱去祖金龍仍居選部水鏡三臺父悅再牧荊河威風千里而身遭禍機遂為季布所哭獲存遺嗣實賴程嬰之忠國家追念功臣更撫叔敖之子言思官族還求女齊之胤公始應辟為河內功曹除員外郎常侍汲郡治兵黃河浮馬摧鋒軹關之捷逐北長城之陳授平東將軍北徐州刺史柳泉風塵三城席卷棠陰鋒鏑千室入關遷車騎大將軍儀同三司開國龍門縣伯仍除巴州刺史雖復巴水三回夷歌數曲徒逢白竹之弩已濟青衣之功朝廷以漢之功臣須開上將之府晉之代胄宜紹琅琊之國遷驃騎大將軍開府改封琅琊公食邑一千五百戶宮闈近密實俟忠貞詔為大御伯仍除大御正職司常伯任總夔龍王道既平絲言惟允尋除始州刺史都督始州諸軍事蠻夷恃險狼顧鴟張高山尋雲深谷無景九地縱橫三門起伏峰危馬束水險橋飛遂得谷靜山空冰消霧散仍為信州刺史都督信州諸軍事精兵守於白帝足懼巴州之城船柿下於荊州彌動西陵之戍即授使持節大將軍都督西寧州諸軍事西陵州刺史將啓北戶之人向通南雲之國聞寵若驚奄從深夜天和六年正月十八日亡春秋六十五詔贈本官加懷邵汾晉四州刺史諡莊公禮也以建德元年七月十三日葬於武功郡之三疇原公愛敬純深有隱無犯忠貞亮直知無不為在戎四十二年身經六十九戰至於多竈唱籌並得成功飛沙擁石未嘗乖律恂恂教義吳起西河之風間間鼓旗李牧長平之政身死之日家無餘財山木所資一由詔葬有始有卒生榮死哀銘曰祝融是命重黎克舉公族乃建天官即序避世於秦承家於楚金行失馭玉鏡淪輝我之烈祖識變乘機黃旗東沒青蓋西飛落星置道長州出圍及我皇父荊河再撫世屬喪亂身沒猾豎嗟我遺嗣崎嶇趙武寒覆鳥翼飢吞獸乳獲歸河內更襲琅琊年方竹馬怨結長蛇藏兵九地置劍千家雪山埋馬冰河陷車既乃班政超然榮守朱鷺頻飛金龜轉紐築塞長榆營軍高柳玉案推食河橋勸酒石門冰釋金堤電散蘆水門關茅津成觀馭風逸翮修途始半建武功臣先悲吳漢沉寥搖落遊場浸微金城路斷郿塢人稀風松雲蓋白水山衣賢已星殞人沒蘭衰文苑英華九百四十七周大將軍懷德公吳明徹墓志周大將軍懷德公吳明徹墓志公諱明徹字通昭兗州秦郡人也西都列國長沙王功被山河東京貴臣大司馬名高霄漢豈直西河有守智足抗秦建平有城威能動晉而已也祖尚南譙太守父標右軍將軍抗拒淮沂平夷濟漯代為名將見於斯矣公志氣縱橫風情倜儻圯橋取履早見兵書竹林逢猿遍知劍術故得勇爵登朝材官入選起家東宮司直後除左軍葛瞻始嗣兵戈仍遭蜀滅陸機才論功業即值吳亡公之仕梁未為達也自梁受終齊卿得政禮樂征伐咸歸舜後是以威加四海德教諸侯蕭索煙雲光華日月公以明略佐時雄圖贊務鱗翼更張風飆遂遠冠軍侯之用兵未必師古武安君之養士能得人心擬於其倫公之謂矣為左衛將軍尋遷鎮軍丹陽尹北軍中候總政六師河南京尹冠冕百郡文武是寄公無愧焉蕭湘之役憑陵島嶼風船火艦周瑜有赤壁之兵蓋舳襜艫賀齊有橫江之戰仍為平南將軍開府儀同三司都督湘衡桂武四州刺史遂得左廣回扃轔車反暢長沙楚鐵更入兵欄洞浦藏犀還輸甲庫雖復戎歌屢凱軍幕猶張淮南望廷尉之囚合淝稱將軍之寇莫不失穴驚巢沉水陷火為使持節侍中司空車騎大將軍都督南北兗青譙五州諸軍事南兗州刺史南平郡開國公食邑八千戶鼓吹一部中台在玄武之宮上將列文昌之宿高蟬臨鬢吟鷺陪軒平陽之邑萬家臨淄之馬千駟坐則玉案推食行則中分麾下生平若此功業是焉既而金精氣壯師出有名石鼓聲高兵交可遠故得艫舳所臨蓋於淮泗旌旗所襲奄有龜蒙魏將已奔猶書馬陵之樹齊師其遁空望平陰之烏俄而南仲出車方叔蒞止暢轂文茵鉤膺鞗革遂以天道在北南風不競昔者裨將失律衛將軍於是待罪中軍爭濟荀桓子於焉受戮心之憂矣胡以事君宣政元年屆於東都之亭有詔釋其鸞鑣蠲其釁社始弘就館之禮即受登壇之策拜持節大將軍懷德郡開國公邑二千戶歸平津之館時聞櫪馬之嘶舍廣成之傳裁見諸侯之客廉頗眷戀寧聞更用之期李廣盤桓無復前驅之望霸陵醉尉侵辱可知東陵故侯生平已矣大象二年七月二十八日氣疾暴增奄然賓館春秋七十七即以其年八月十九日寄瘞於京兆萬年縣之東郊詔贈某官諡某禮也江東八千子弟從項籍而不歸海島五百軍人為田橫而俱死焉嗚呼哀哉毛修之埋於塞表流落不存陸平原敗於河橋死生慚恨反公孫之柩方且未期歸連尹之尸竟知何日遊魂羈旅足傷溫序之心玄夜思歸終有蘇韶之夢遂使廣平之里永滯冤魂汝南之亭長聞夜哭嗚呼哀哉乃為銘曰九河宅土三江貢職彼美中邦君之封殖負才矜智乘危恃力浮磬戢鱗孤桐垂翼五兵早竭一鼓前衰移營減竈空幕禽飛羊皮詎贖畫馬何追荀罃永去隨會無歸存沒俄頃光陰愴悽嶽裂中台星空上將眷言妻子悠然亭障魂或可招喪何可望壯志沉淪雄圖埋沒西隴足抵黃塵碎骨何處池臺誰家風月墳隧羈遠營魂流寓霸岸無封平陵不樹壯士之壟將軍之墓何代何年還成武庫文苑英華九百四十七周大將軍上開府廣饒公鄭常墓志銘公諱常字某滎陽人也周宣王之弟初封其國鄭穆公之孫始成其姓祖思慶建威將軍山陽太守考頊儀同三司豫州刺史南陽坐嘯值此邦君西河建隼逢斯刺舉公侯繼踵冠冕連鑣可得而言傳於史籍公髫齔知禮早年馳譽就經黌舍略見書堂習武兵欄偏知劍術雖復年猶小學已為儒者所稱位在偏裨即入將軍之賞大統三年起義華陽授永安縣開國男文皇帝霸迹初基英雄輻輳公拔劍轅門潁川從我洛城逆戰壯於白馬之兵河橋解圍勇於烏林之策授平東將軍帥都督襲父封魏後二年授持節車騎大將軍儀同三司車騎用郭淮之勳儀同取王沉之貴公之此授僉曰得人進爵廣饒縣公邑千戶保定三年授使持節都督遷州諸軍事遷州刺史即總領金州兵馬開拓北戎高山尋雲深谷無景梯繩乃上浮竹裁通閩越影響勾吳聲勢公出戰短兵並皆奔北瓦解冰碎山空谷靜授持節開府儀同大將軍柏梁高宴有大將軍之詩幕府初開有平陵侯之國比之今日豈可同年而語哉自是使車被之繡服風謠是察刑政是觀公露節東驅風奔群盜埋輪當路威振中原武皇帝有盟津之師以公為中權之徑外從決勝內侍軍謀及文軌既同旃旌已偃司勳行賞軍吏舉功乃授使持節上開府增邑五百戶賜姓宇文與國同乘之榮周之宗盟非復異姓之後蕃屏是寄隆寵所歸公室無疏此之謂矣九州都督須得其才千里諸侯實俟其政乃為使持節都督東徐州諸軍事徐州刺史尋遷南兗州諸軍事南兗州刺史公頻總六條再勞十部俗變風移人懷吏畏滯穗遺秉有利疲人山桑野蠶足充貢賦化被殊俗威行鄰境奏事京師四方第一謂真刺史其在斯乎春秋未高奄然遘疾以大象元年薨於州鎮時年六十三嗚呼哀哉吏人扳慕飛走變色河濟輟舂淮沂罷市以今年歸葬於滎陽之山詔贈某官禮也嗟陵谷之貿遷懼徽猷之永遠地久天長敢鐫貞石銘曰荊河惟豫洛食之本水繞滎波山斜陸渾德星猶照祥風未遠代不乏賢文無闕袞公之生也實降英靈忠為德本孝稟天經觀書虎館學劍龍亭雕弓偃月行馬流星置陳黎陽麾兵官渡平陰聽烏馬陵書樹氣視回津星占飛步火斷羌營沙崩賊路及驅犀節乃牧雄州吏不驚犬人無喘牛西蠶得歲東作逢秋草爛獄戶星低市樓五將星亡三台嶽坼哀哉天道遂當明哲楝梁崩壞風雲寂滅北郭長悲東都永別幽深此地宅兆斯憑山回虎圈路上魚陵悲風夜烈苦露晨凝蘭芬菊茂終古相承文苑英華九百四十七周大將軍聞喜公柳遐墓志周大將軍聞嘉喜公柳遐墓志君諱遐字子升河東解縣人也秦始征晉之地漢開平越之鄉律中夷則星居鶉首況復莊謀於衛既為社稷之臣喜對於齊無廢諸侯之職祖叔珍宋員外散騎常侍義陽內史有徐邈之應對居於散騎之省有汲黯之正直理於淮陽之郡父季遠臨川王咨議參軍宜都太守蘭臺石室是所洽聞白馬飛狐逾高詞氣西都吳融擅名江表言談相會宛如舊焉君膺令德之靈稟沖天之氣齠齔髻髮夙智早成愛敬自天虔恭得性含仁抱義履信居貞世父儀同忠惠公特加器異乃謂公曰吾昔逮事伯父太尉公見語云我昨夢汝登一高樓樓盡峻麗吾以坐席乞汝汝或富貴恨吾不及見耳吾向聊復晝寢又夢將昔時坐席還復賜汝汝位官當復見及王祥佩刀世為卿族鮑永驄馬家傳司隸以此連類差無慚德輕車西昌侯作藩襄漢君時年十二以民禮修謁進止端詳神情雅正侯目送之不輟試遣左右踐君衣裾欲視舉動君徐步稍前曾無顧眄魏侯之見劉廙不覺斂容漢主之觀田鳳遂令題柱比之今日曾何足云驃騎廬江王帝子出藩懸衡高選以君華望召為主簿張坦直諫既稱荀令之香鄒湛知言彌見羊公之德咨議府君於都薨背君奔赴六日即屆京師形骸毀瘁不復可識靈柩泝江中川薄晚亂流乘選回風反帆舟中之人相視失色抱棺號慟誓不求生俄爾之間風波即靜咸以君精誠所致成都孝子自赴江流桂陽先賢身彰野火並存靈柩咸可傷嗟太夫人乳間發瘡醫云惟得人吮癑血或望可差君方寸已亂應聲即吮旬日之間遂得痊復君之事親可謂至矣從兄右衛擁旌嶺表苦相攜致昔馬遊志氣為馬援所知班嗣才學為班彪見賞復聞於今日矣乃除永化縣令靜除欹案或吟長岑之遠乍撫鳴琴不以河陽為陋日南金柱合浦珠泉莫肯經懷未嘗留目解巾平西邵陵王法曹參軍仍轉尚書工部侍郎始入禮闈既登蘭閣尚書僕射陳郡謝舉人望國華引君言論謂同坐曰江漢英靈見於此矣西中郎嶽陽王以緑車之重臨西河之牧敕用君為本州治中尋遷別駕王叔理以品物流名陳仲舉以題軒馳譽君之展驥兼而有之及乎大盜移國王室騷然月動星搖雲平虹直嶽陽王承制陝左當璧漢南天網所頓英賢畢集授君散騎侍郎吏部員外郎散騎常侍兼太子侍讀監儲甲觀事重史丹侍講桂宮名高張禹俄遷車騎大將軍大都督賜爵聞喜縣公侍中開府儀同三司餘如故方之驂乘霍去病為侍中譬彼將兵公孫敖為驃騎足以照曜六府謨明九德豈直允諧上將匡贊中軍而已哉既而言從梁國服政酆都管仲有詞即受下卿之禮臧孫見德還奉嘉賓之宴有詔授使持節驃騎大將軍開府儀同三司霍州諸軍事霍州刺史犀節去關袞衣馳傳迎郊則文學前驅賓衛則邦君負弩直以五溪遼遠馬伏波之思歸三湘卑濕賈長沙之不願是以宜城刺史直會鹿門白沙故地仍留龍種夭厲弗戒奄然終極天和某年歸窆於襄陽白沙之舊塋君器宇祥正風鑒弘敏澡身浴德遊藝依仁汝南令望扶風長者不言財利王夷甫之為德不談人物阮嗣宗之為人從容亂離之機保此令名舒卷風雲之際無妨貴仕張衡渾儀之後即賦歸田杜預沉碑已來遂停鄉里王仲宣有讀書之樓諸葛亮有彈琴之宅實欲因此謝病間居終焉鳴琴在膝或對故人寶劍自隨時遇稚子百年俄頃嗚呼哀哉遂使君子之陵止埋銅劍賢臣之墓唯銘石函銘曰有莊有惠居魯居衛義是隨時才堪濟世北部尚書東京司隸必復其始侯君相繼華蓋一嶽文昌一星青襟辨志童子離經義勗非馬書勤映螢往年靈柩漂泊江沱以君哀慟川后停波揚名北海馳譽西河誰登九折不入朝歌蔚炳胥變攀陪遂遠白鹿隨軒丹暈附冕位參上將榮兼本選蛇盤綬結龜回印轉來朝平樂歸政咸陽藩維即啓軍幕仍張起茲禮數峻此戎章長離宛宛刷羽陵江世急奔流年催驚隼滅沒頓轡扶桑搖軫智士石坼賢人星殞西鄂芝枯南陽菊盡愴焉啓手生榮終極相杵輟舂鳴機罷織煢煢胤子視陰餘息霜露履之哀哉欒棘龍巢北望鳳闕前觀松長風遠地厚泉寒書埋簡落琴覆絃寬贈行之册書而納棺文苑英華九百四十八故周大將軍義興公蕭公墓銘故周大將軍義興公蕭公墓銘昔司徒之敷五教當堯讓之初丞相之總萬機值秦亡之後若殷人受氏乃承微子之封梁運應圖實啓延陵之國公諱太字世怡蘭陵人也太祖文皇帝之孫鄱陽忠烈王之子派別天潢支分若木直幹自高澄源已遠茂親明德是稱毛畢之功宗子維城乃建邢茅之國大同元年年十六封豐城縣開國侯食邑五百戶山臨鶴塞非無陶侃之賓氣連斗牛即有張華之劍解巾給事中仍太子洗馬公子出身非郎官而同品中朝洗馬異式道而前驅以公居之誠為高選大同元年入直殿省其年轉太子中書舍人南宮宿衛職司蘭錡北閣從班榮參顧問通籍兩宮得賢斯在大同三年授持節仁威將軍譙州刺史褰帷祥氣之境刺舉消憂之地南陽風俗文學更多美稷相迎童兒逾遠既而亂離瘼矣王室騷然大夫有行役之悲君子有無期之怨背關懷楚扁舟而行江漢奉當璧之君章華歸中興之主承聖元年拜侍中無雙對問實踵武於丁鴻多識舊章足齊衡於王粲二年除持節平西將軍臨川內史仍轉平南將軍桂陽內史尚方鑄劍再轉金龜御史分符雙封銅虎豈直鄧攸清白見稱五鼓之歌劉寵廉能名為一錢之郡遂以天保未定王途多梗還吳不可歸蜀無路臨淄負海翻然改途竄身清漳垂翅渤海蒙授車騎大將軍散騎常侍仍為持節都督永州刺史而秦亭壓境邾柝聞城鼓角地鳴將軍天落雖復瓶缶聽聲無防於地道冠繩柴結不卻於雲梯請命受降翻歸都護周朝以楚材晉用不停於平章趙璧秦求無論於羇遠以保定五年除使持節驃騎大將軍開府儀同三司義興郡開國公食邑一千三百戶天和二年授使持節都督蔡州諸軍事蔡州刺史楚頃襄之愛子既布衣而戍谷魏安釐之母弟亦羇旅於邯鄲憂既傷人降年不永春秋五十有一薨於蔡州之鎮送故入關空餘袞服歸軒在道還更垂帷嗚呼哀哉有詔贈官諡某禮也五年十一月葬於長安北原樗里子之墳正臨武庫太史公之墓直對皋門銘曰玄鳥遠烈相土弘謨東封宋社西斂秦圖人承佐漢國紹開吳有美令德茂親藩邸建國皇支承家帝弟率由冥會亮直天啓轅固聞詩唐都習禮博望之苑金華之宮文林講德武帳參戎名書柱上策滿帷中託身淄右蒞政淮東秦亭西逼楚澤南窮時驚獵火或懼秋風屬期遠略逢茲應變陳橫十里兵圍一面月暈孤城塵驚虛援春筍非糧秋蒿無箭垂翅臥龍夷矜輟戰時值懷來恩加始賞王爵愈峻戎章更上朱鷺才飛虞歌即響泣子留恨藏書長往炎涼迭運零落山丘霜氛幕月松氣陵秋嗟南國之王子成東陵之故侯文苑英華九百四十八故周大將軍趙公墓志銘故周大將軍趙公墓志銘公諱廣字乾歸邵惠公之元孫豳孝公之長子若木拂日長蛇委天龍圖幕河之光神鼎連雲之氣六辨搆字五運徵祥是以維嶽降神自天生德凝脂點漆日角珠庭為子則名高五都為臣則光照千里華蓋中天之峰未階其峻虞淵浴日之水不盡其源歲在雕車年方竹馬月內桂樹切問能訓石上木生懸思即悟年十一孝公薨煢煢在疚孺慕過禮泉驚孝水竹動寒林三行克宣八翼斯舉大周建國宗子維城設壝封人分司典命開國天水郡公食邑二千戶元年授使持節驃騎大將軍開府儀同三司其年四月授都督秦州刺史孝公久牧汧隴遺愛在人今茲見撫我君之子豈獨司隸之臺鮑宣纍葉丞相之府韋賢重代二年拜大將軍方衛青之張幕册重元勳譬韓信之登壇榮高獨拜武成元年遷都督興梁等十九州諸軍事梁州刺史嶓冢導漾乃濟漢之東流蔡蒙旅平實華陽之西極其年九月改封蔡國公食邑萬戶地接韓城關鄰楚鄣戶封八縣恩深寇恂之功邑啓萬家事極曹參之賞保定元年授少司寇犴戶苔生囹關籥動載酒屬車幸無冤氣觀囚軍府或聽鳴琴二年敕守蒲城都督潼關等六防諸軍事其年閏月遷都督秦渭等十二州諸軍事秦州刺史公亟牧冀城頻藩隴坻豪桀斂手貪殘解印加以上谷精兵漁陽噪鼓北臨高柳南望長榆胸奴下馬之山貴相藏酒之谷莫不遠慕威聲遙承風化二年奉詔向甘州迎皇后有文在手仲子之歸紀裂繻來卿為君逆自非名高絶國威被和鄰豈得稱族而行尊君之命四年授柱國大將軍昭陽以功高見用項梁以名將當官以今方之彼有慚德天和三年授都督陝虞等八州甘防諸軍事陝州刺史屈産垂棘既有滅虢之兵王官羈馬非無絶秦之路公以正正鼓旗間間車軌服叛威邊算無遺策但以中外久勞積斯災疾山川則並走群望賓客則諸侯在門是以請謁承明言歸湯沐方詢夏郊之祀或辨桑林之祟更除秦州刺史仍襲父爵豳國公分流之嶺未登晚塞之城空望太夫人以公羸瘠悲泣相守胸氣交衝奄捐館舍公頓伏苫寢水漿不入雖王人勸奪創巨愈增母死於子子死於親慈孝之道一朝總集大漸之辰春秋二十有九四關罷市三軍行哭言尋聽訟猶見寒棠還顧空營惟餘衰柳諡贈某官禮也六年六月歸葬於秦州之某原玄甲啓路追旌驃騎之功龍旗贈行深悼東平之遠公亮直惟忠溫恭惟孝居之仁義飾以禮樂風神機警聰睿精明有仞於宮牆無形於喜慍金版玉策之記枕籍忘疲蘭葉芝花之圖膏映必舉碣石秋雲昭陽落月思風含臆言泉流吻翩翩書記則阮瑀陳琳荏荏風流則王濛謝朓語其百發弓絶於猿吟論其百中劍深於鴈陳枚乘之望梁苑不憚棄官樂毅之求燕路無辭千里至如應變將略雷電立成帷帳謀猷孫吳暗合有品藻人倫之志有清平天下之心鵬路忽催龍津遂壅嗚呼哀哉太宰早茂三荊長辭萬始撫養遺孤連枝同氣馬援之誡兄子義存謹飭王沉之事世叔情深愛敬同德比義此之謂乎乃為銘曰御乾從紀乘離作聖白環讓德玄圭受命平一地紐增輝天鏡傍廕數國前臨七政地屬先登時逢下武玉璜撥亂金縢光輔衛晉承家邢茅祚土波分建木派流玄扈景命寅序徽猷淵塞忠有令圖孝為全德山節蒞政桓圭守國瀚海將臨燕山行勒平樂高宴金華説經論儒璧水親禮明庭相風待賦承露須銘乘舟向日策馬隨星德舉克明能賢允淑上將授脤元戎推轂趙失東漁胡亡南牧箭下聊城泥封函谷袞衣頻露丹襜亟卷約法情推繁辭理遣盜烏懸察疑蛇立辨人共官園家同野繭籋雲推景轉風落仞星裂中台山傾左鎮夏楹舍爵殷階啓殯縿幕躐行明旍庭引秦川直望隴水分飛山河滿目容衛靈歸陵圖石馬車畫袞衣小山搖落長林變衰淒愴原隰荒涼宅兆樹密人稀山多路小十里松城千年華表夜臺方寂窮泉無曉文苑英華九百四十八
