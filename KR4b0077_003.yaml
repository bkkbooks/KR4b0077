body:
  text: 卷三江奉和泛江春江下白帝畫舸向黃牛錦纜回沙磧蘭橈避荻洲濕花隨水泛空巢逐樹流建平船柿下荊門戰艦浮岸社多喬木山城足迥樓日落江風靜龍吟回上游本集三初學記六文苑英華百六十二庾開府詩集下詩紀百十五又類聚八作王臺卿引牛洲流樓四韻奉和山池奉和山池樂宮多暇豫望苑暫回輿鳴笳陵絶浪飛蓋歷通渠桂亭花未落桐門葉半疏荷風驚浴鳥橋影聚行魚日落含山氣雲歸帶雨餘本集三類聚九文苑英華百六十五庾開府詩集下詩紀百十五陪駕幸終南山和宇文內史陪駕幸終南山和宇文內史玉山乘四載瑤池宴八龍黿橋浮少海鵠蓋上中峰飛狐橫塞路白馬當河衝水奠三川石山封五樹松長虹雙瀑布圓闕兩芙蓉戍樓鳴夕鼓山寺響晨鐘新蒲節轉促短筍籜猶重樹宿含櫻鳥花留釀蜜蜂迎風下列缺灑酒召昌容且欣陪北上方欲待東封本集三類聚七文苑英華百五十九庾開府詩集上詩紀百十五和宇文內史春日遊山遊客值春輝金鞍上翠微風逆花迎面山深雲濕衣雁持一足倚猿將兩臂飛戍樓侵嶺路山村落獵圍道士封君達仙人丁令威煮丹於此地居然未肯歸本集三文苑英華百六十庾開府詩集上詩紀百十五遊山遊山聊登玄圃殿更上增城山不知高幾里低頭看世間唱歌雲欲聚彈琴鶴欲舞澗底百重花山根一片雨婉婉藤倒垂亭亭松直豎本集三文苑英華百五十九庾開府詩集上詩紀百十五和宇文京兆遊田小苑禁門開長楊獵客來懸知畫眉罷走馬向章臺澗寒泉反縮山晴雲倒回熊饑自舐掌雁驚獨銜枚美酒餘杭醉芙蓉即奉杯本集三庾開府詩集上詩紀百十五奉報寄洛州舟師會孟津甲子陳東鄰雷轅驚戰鼓劍室動金神幕府風雲氣軍門關塞人長旍析鳥羽合甲抱犀鱗星芒一丈焰月暈七重輪黎陽水稍淥官渡柳應春無庸奉天眷驅傳牧南秦繁詞勞簡牘雜俗弊風塵上洛逢都尉商山見逸民留滯終南下唯當一史臣本集三文苑英華二百四十庾開府詩集上詩紀百十五奉報窮秋寄隱士奉報窮秋寄隱士王倪逢齧缺桀溺偶長沮藜床負日臥麥隴帶經鋤自然曲木几無名科斗書聚花聊飼雀穿池試養魚小村治澀路低田補壞渠秋水牽沙落寒藤抱樹疏空枉平原騎來過仲蔚廬本集三類聚三十六文苑英華二百三十二庾開府詩集上詩紀百十五上益州上柱國趙王二首銅梁影棠樹石鏡寫褰帷兩江如漬錦雙峰似畫眉穿荷低晚蓋衰柳掛殘絲風流盛儒雅泉湧富文詞無因同子淑暫得侍臨淄本集三庾開府詩集下詩紀百十五寂寞歲陰窮蒼茫雲貌同鶴毛飄亂雪車轂轉飛蓬雁歸知向暖鳥巢解背風寒沙兩岸白獵火一山紅願想懸鶉弊時嗟陋巷空同上謹贈司寇淮南公謹贈司寇淮南公危邦久亂德天策始乘機九河聞誓衆千里見連旗虢亡垂棘返齊平寶鼎歸久弊風塵俗殊勞關塞衣絆驥還千里垂鵬更九飛猶憐馬齒進應念節旄稀回軒入故里園柳始依依舊竹侵行徑新桐益幾圍寒谷梨應重秋林栗更肥美酒還參聖雕文本入微促歌迎趙瑟遊絃召楚妃小人司刺舉明揚實濫吹南部治都尉軍謀假建威商山隱士石丹水鳳凰磯野亭長被馬山城早掩扉傳呼擁絳節交戟映彤闈遂令忘楚操何但食周薇三十六水變四十九條非丹竈風煙歇年齡蒲柳衰同僚敢不盡疇日懼難追本集三文苑英華二百四十七又周書元偉傳引歸一韻庾開府詩集上詩紀百十五正旦上司憲府正旦上司憲府詰旦啓門闌繁辭湧筆端蒼鷹下獄吏獬豸飾刑官司朝引玉節盟載捧珠盤窮紀星移次歸餘律未殫雪高三尺厚冰深一丈寒短笋猶埋竹香心未起蘭孟門久失路扶搖忽上摶栖烏還得府棄馬復歸欄榮華名義重虛薄報恩難枚乘還起疾貢禹遂彈冠方垂蓮葉劍未用竹根丹一知懸象法誰思垂釣竿本集三又類聚五十四引端官盤摶欄難冠丹竿九韻庾開府詩集下詩紀百十五州酬薛文學見贈別任洛州酬薛文學見贈別子居河之曲英彥本連蹤鹽形或變虎鼎氣乍成龍若人承載德宮墻定數重五衢開辨路四照起文烽曰余濫推轂民願始天從上洛分都尉弘農開附庸羊腸連九阪熊耳對雙峰白石仙人芋青林隱士松北梁送孫楚西隄別葛龔故人倘書札黎陽土足封本集三庾開府詩集上詩紀百十五正員將命至鄴酬祖王正員我皇臨九有聲教洎無隄興文盛禮樂偃武息氓黎承乏驅騏驥旌旗事琬圭古碑文字盡荒城年代迷被隴文瓜熟交塍香穗低投瓊實有慰報李更無蹊本集三類聚五十三文苑英華二百九十六庾開府詩集下詩紀百十五將命至鄴大國修聘禮親鄰自此敦張旃事原隰負扆報成言西過犯風露北指度轘轅交歡值公子展禮覿王孫何以譽嘉樹徒欣賦采蘩四牢盈折俎三獻滿罍樽人臣無境外何由欣此言風俗既殊阻山河不復論無因旅南館空欲祭西門眷然惟此別夙期幸共存本集三類聚五十三初學記二十文苑英華二百九十六庾開府詩集下廣文選十詩紀百十五入彭城館襄君前建國項氏昔稜威鶂飛傷楚戰雞鳴悲漢圍年代殊氓俗風雲更盛衰水流浮磬動山喧雙翟飛夏餘花欲盡秋近燕將稀槐庭垂緑穗蓮浦落紅衣徒知日云暮不見舞雩歸本集三文苑英華二百九十七庾開府詩集下詩紀百十五又類聚二十七引威圍衰飛稀衣六韻同州還赤岸繞新村青城臨綺門范雎新入相穰侯始出蕃上林催獵響河橋爭渡喧竄雉飛橫澗藏狐入斷原將軍高宴晚來過青竹園本集三文苑英華二百八十九庾開府詩集上詩紀百十五從駕觀講武挍戰出長楊兵欄入鬭場置陳橫雲起開營雁翼張門嫌磁石礙馬畏鐵菱傷龍淵觸牛斗繁弱駭天狼落星奔驥騄浮雲上驌驦急風吹戰鼓高塵擁貝裝駭猿時落木驚鴻屢斷行樹寒條更直山枯菊轉芳豹略推全勝龍圖揖所長小臣欣寓目還知奉會昌本集三文苑英華二百九十九又類聚五十九引場張驦裝行五韻庾開府詩集上詩紀百十五奉報趙王出師在道賜詩上將出東平先定下江兵彎弓伏石動振鼓沸沙鳴橫海將軍號長風駿馬名雨歇殘虹斷雲歸一雁征暗巖朝石濕空山夜火明低橋澗底渡狹路花中行錦車同建節魚軒異泊營軍中女子氣塞外夫人城小人乖攝養岐路阻逢迎幾月芝田熟何年金竈成哀笳關塞曲嘶馬別離聲王子身為寶深思不倚衡本集三文苑英華二百九十九庾開府詩集上詩紀百十五和趙王送峽中軍和趙王送峽中軍樓船聊習戰白羽試撝軍山城對卻月岸陳抵平雲赤蛇懸弩影流星抱劍文胡笳遙警夜塞馬暗嘶群客行明月峽猿聲不可聞本集三文苑英華二百九十九庾開府詩集上詩紀百十五韻奉和趙王途中五韻飄飄映車幕出沒望連旗度雲還翊陳回風即送師峽路沙如月山峰石似眉村桃拂紅粉岸柳被青絲錦城遙可望回鞍念此時本集三類聚二十七作王褒庾開府詩集下詩紀百十五侍從徐國公殿下軍行八風占陳氣六甲候兵韜置府仍張幕麾軍即秉旄長旗臨廣武烽火照成皋巡寒重挾纊酌水勝單醪陳後雲逾直兵深星轉高電焰驅龍馬山精鏤寶刀塞迥翻榆葉關寒落雁毛既得從神武何須念久勞本集三庾開府詩集上詩紀百十五伏聞遊獵虞旗喜旦晴獵馬向山橫石關魚貫上山梁雁翅行雪平尋兔跡林叢聽雉聲馬嘶山谷響弓寒桑柘鳴聞弦鳥自落望火獸空驚無風樹即正不凍水還平誰知茂陵下願入睢陽城本集三庾開府詩集上詩紀百十五見征客始還遇獵二師新受詔長平正凱歸猶言乘戰馬未得解戎衣上林遇逐獵宜春暫合圍漢帝熊猶憤秦王雉更飛故人迎借問念舊始依依河邊一片石不復肯支機本集三庾開府詩集上詩紀百十五奉和闡弘二教應詔奉和闡弘二教應詔五明教已設三元法復開魚山將鶴嶺清梵兩邊來香煙聚為塔花雨積成臺空心論佛性貞氣辨仙才露盤高掌滴風烏平翅回無勞問待詔自識昆明灰本集三庾開府詩集上詩紀百十五又類聚七十六引開來臺才四韻至老子廟應詔至老子廟應詔虛無推馭辨寥廓本乘霓三門臨苦縣九井對靈溪成丹須竹節量藥用刀圭石似臨邛芋芝如封禪泥毻毛新鵠小盤根古樹低野戍孤煙起春山百鳥啼路有三千別途經七聖迷唯當別關吏直向流沙西本集三文苑英華百七十庾開府詩集上詩紀百十五又類聚三十八引溪圭西三韻奉和趙王遊仙藏山還採藥有道得從師京兆陳安世成都李意期玉京傳相鶴太乙授飛龜白石香新芋青泥美熟芝山精逢照鏡樵客值圍棊石紋如碎錦藤苗似亂絲蓬萊在何處漢后欲遙祠本集三類聚七十八初學記二十三文苑英華二百二十五庾開府詩集下詩紀百十五圖奉和同泰寺浮圖岧岧凌太清照殿比東京長影臨雙闕高層出九城栱積行雲礙幡搖度鳥驚鳳飛如始泊蓮合似初生輪重對月滿鐸韻擬鸞聲畫水流全住圖雲色半輕露晚盤猶滴珠朝火更明雖連博望苑還接銀沙城天香下桂殿仙梵入伊笙庶聞八解樂方遣六塵情本集三類聚七十六廣弘明集三十上文苑英華二百三十三庾開府詩集下詩紀百十五奉和法筵應詔五城鄰北極百雉壯西崑鉤陳橫復道閶闔抵靈軒千柱蓮花塔由旬紫柑園佛影胡人記經文漢語翻星窺朱鳥牖雲宿鳳凰門新禽解雜囀春柳臥生根早雷驚蟄戶流雪長河源建始移交讓徽音種合昏風飛扇天辨泉湧屬絲言羈臣從散木無以預中天遙可望終類仰鵾弦本集三庾開府詩集上詩紀百十五和從駕登雲居寺塔和從駕登雲居寺塔重巒千仞塔危磴九層臺石關恆逆上山梁乍斗回階下雲峰出窗前風洞開隔嶺鐘聲度中天梵響來平時欣侍從於此暫徘徊本集三文苑英華二百三十三庾開府詩集上詩紀百十五又類聚七十六引臺開來三韻和何儀同講竟述懷無名即講道有動定論機安經讓禮席正業理儒衣似得遊焉趣能同捨講歸石渠人少歇華陰市暫稀秋雲低晚氣短景側餘輝螢排亂草出雁捨斷蘆飛別有平陵徑蕭條客鬢衰饑噪空倉雀寒驚懶婦機實欣懷諛問逢君理入微本集三又初學記二十一引微衣歸稀輝飛衰微八韻庾開府詩集上詩紀百十五奉和趙王隱士洛陽徵五隱東都別二賢雲氣浮函谷星光集潁川霸陵採樵路成都賣卜錢鹿裘披稍裂藜床坐欲穿阮籍唯長嘯嵇康訝一弦澗險無平石山深足細泉短松猶百尺少鶴已千年野鳥繁絃囀山花焰火然洞風吹戶裏石乳滴窗前雖無亭長識終見野人傳本集三庾開府詩集下詩紀百十五又類聚三十六文苑英華二百三十二並引賢川錢穿絃泉年然船九韻擬詠懷二十七首步兵未飲酒中散未彈琴索索無真氣昏昏有俗心涸鮒常思水驚飛每失林風雲能變色松竹且悲吟由來不得意何必往長岑本集三類聚二十六作詠懷詩庾開府詩集上詩紀百十六赭衣居傅巖垂綸在渭川乘舟能上月飛幰欲捫天誰知志不就空有直如弦洛陽蘇季子連衡遂不連既無六國印翻思二頃田本集三庾開府詩集上詩紀百十六俎豆非所習帷幄復無謀不言班定遠應為萬里侯燕客思遼水秦人望隴頭倡家遭強聘質子值仍留自憐才智盡空傷年鬢秋同上楚材稱晉用秦臣即趙冠離宮延子産羈旅接陳完寓衛非所寓安齊獨未安雪泣悲去魯悽然憶相韓唯彼窮途慟知余行路難同上惟忠且惟孝為子復為臣一朝人事盡身名不足親吳起嘗辭魏韓非遂入秦壯情已消歇雄圖不復申移住華陰下終為關外人同上疇昔國士遇生平知己恩直言珠可吐寧知炭可吞一顧重尺璧千金輕一言悲傷劉孺子悽愴史皇孫無因同武騎歸守灞陵園本集三類聚二十六