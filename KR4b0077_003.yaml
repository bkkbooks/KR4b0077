調急節亂杵變新聲石燥砧逾響桐虛杵絶鳴鳴石出華陰虛桐採鳳林北堂細腰杵南市女郎砧擊節無勞鼓調聲不用琴竝結連枝縷雙穿長命針倡樓驚別怨征客動愁心同心竹葉碗雙去雙來滿裙裾不奈長衫袖偏宜短龍文鏤剪刀鳳翼纏篸管風流響和韻哀怨聲悽斷新聲繞夜風嬌轉滿空中應聞長樂殿判徹昭陽宮花鬟醉眼纈龍子細文紅濕摺通夕露吹衣一夜風玉階風轉急長城雪應暗新綬始欲縫細錦行須纂聲煩廣陵散杵急漁陽摻新月動金波秋雲泛濫過誰憐征戍客今夜在交河栩陽離別賦臨江愁思歌復令悲此曲紅顏餘幾多本集三庾開府詩集上詩紀百十六又類聚六十七引城明成聲鳴陰林砧針心十韻預麟趾殿校書和劉儀同預麟趾殿校書和劉儀同止戈興禮樂修文盛典謨壁開金石篆河浮雲霧圖藝香上延閣碑石向鴻都誦書徵博士明經拜大夫璧池寒水落學市舊槐疏高談變白馬雄辨塞飛狐月落將軍樹風驚御史烏子雲猶汗簡溫舒正削蒲連雲雖有閣終欲想江湖本集三初學記十二文苑英華二百四十又見三百十一庾開府詩集上詩紀百十六和宇文內史入重陽閣和宇文內史入重陽閣北原風雨散南宮容衛踈待詔還金馬儒林歸石渠徒懸仁壽鏡空聚茂陵書竹淚垂秋筍蓮衣落夏蕖顧成始移廟陽陵正徙居舊蘭憔悴長殘花爛熳舒別有昭陽殿長悲故婕妤本集三文苑英華三百十四庾開府詩集上詩紀百十六忝在司水看治渭橋忝在司水看治渭橋大夫參下位司職渭之陽富平移鐵鎖甘泉運石梁跨虹連絶岸浮黿續斷航春洲鸚鵡色流水桃花香星精逢漢帝釣叟值周王平隄石岸直高堰柳陰長羡言杜元凱河橋獨舉觴本集三初學記七又類聚九引陽梁航香四韻庾開府詩集上詩紀百十六北園新齊成應趙王教北園新齊成應趙王教虹枌跂鳥翼山節拱蘭枝畫梁雲氣繞雕窗玉女窺月懸唯返照蓮開長倒垂盤根紐壞石行雨暴澆池長藤連格徙高樹帶巢移鳥聲唯雜曲花風直亂吹白虎題書觀玄熊帖射皮文絃入舞曲月扇掩歌兒玉節調笙管金船代酒巵若論曹子建天人本共知本集三文苑英華百七十九庾開府詩集上詩紀百十六同會河陽公新造山池聊得寓目同會河陽公新造山池聊得寓目橫階仍鑿澗對戶即連峰暗石疑藏虎盤根似臥龍沙洲聚亂荻洞口礙橫松引泉恆數派開巖即十重北閣聞吹管南鄰聽擊鐘菊寒花正合杯香酒絶濃由來魏公子今日始相逢本集三文苑英華六十五庾開府詩集上詩紀百十六登州中新閣跨虛凌倒景連雲拒少陽璇極龍鱗上雕甍鵬翅張千尋文杏照十里木蘭香開窗對高掌平坐望河梁歌響聞長樂鐘聲徹建章賦用王延壽書須韋仲將龍來隨畫壁鳳起逐吹簧石作芙容影池如明鏡光花梁反披葉蓮井倒垂房徒然思燕賀無以預鵾翔本集三文苑英華三百十四庾開府詩集上詩紀百十六歲晚出橫門年華改歲陰遊客喜登臨據鞍垂玉帖橫腰帶錦心冰弱浮橋沒沙虛馬跡深倚弓依石岸回床向柳陰智瓊來勸酒文君過聽琴明朝雲雨散何處更相尋本集三庾開府詩集上詩紀百十六北園射堂新成北園射堂新成軒臺聊可習仙的不難登轉箭初調筈橫弓先望堋驚心一鴈落連臂兩猿騰直知王濟巧誰覺魏舒能空心不死樹無葉未枯藤擇賢方知此傳巵欣得朋本集三類聚七十四庾開府詩集上詩紀百十六
