body:
  text: 卷四園庭杖鄉從物外養學事間郊窮愁方汗簡無遇始觀爻谷寒已吹律簷空更剪茆樵隱恆同路人禽或對巢水蒲開晚結風竹解寒苞古槐時變火枯楓乍落膠倒屣迎懸榻停琴聽解嘲香螺酌美酒枯蚌藉蘭殽飛魚時觸釣翳雉屢懸庖但使相知厚當能來結交本集四庾開府詩集上詩紀百十六歸田務農勤九穀歸來嘉一廛穿渠移水碓燒棘起山田樹陰逢歇馬魚潭見灑船苦李無人摘秋瓜不直錢社雞新欲伏原蠶始更眠今日張平子翻為人所憐本集四庾開府詩集上詩紀百十六寒園即目寒園星散居搖落小村墟遊仙半壁畫隱士一床書子月泉心動陽爻地氣舒雪花深數尺冰床厚尺餘蒼鷹斜望雉白鷺下看魚更想東都外群公別二疏本集四庾開府詩集上詩紀百十六幽居值春山人久陸沉幽徑忽春臨決渠移水碓開園掃竹林欹橋久半斷崩岸始邪侵短歌吹細笛低聲泛古琴錢刀不相及耕種且須深長門一紙賦何處覓黃金本集四庾開府詩集上詩紀百十六臥疾窮愁危慮風霜積窮愁歲月侵留蛇常疾首映弩屢驚心稚川求藥録君平問卜林野老時相訪山僧或見尋有菊翻無酒無弦則有琴詎知長抱膝獨為梁父吟本集四庾開府詩集上詩紀百十六山齋寂寥尋靜室蒙密就山齋滴瀝泉澆路穹窿石臥階淺槎全不動盤根唯半埋圓珠墜晚菊細火落空槐直置風雲慘彌憐心事乖本集四文苑英華三百十七庾開府詩集上詩紀百十六望野試策千金馬來登五丈原有城仍舊縣無樹即新村水向蘭池泊日斜細柳園涸渚通沙路寒渠塞水門但得風雲賞何須人事論本集四庾開府詩集上詩紀百十六蒙賜酒金膏下帝臺玉曆在蓬萊仙人一遇飲分得兩三杯忽聞桑葉落正值菊花開阮籍披衣進王戎含笑來從今覓仙藥不假向瑤臺本集四庾開府詩集下詩紀百十六又草堂詩八九日詩注作庾信詩引開一韻奉報趙王惠酒奉報趙王惠酒梁王修竹園冠蓋風塵喧行人忽枉道直進桃花源稚子還羞出驚妻倒閉門始聞傳上命定是賜中樽野爐然樹葉山杯捧竹根風池還更暖寒谷遂長暄未知稻粱鴈何時能報恩本集四類聚七十二庾開府詩集上詩紀百十六有喜致醉忽見庭生玉聊欣蚌出珠蘭芬猶載寢蓬箭始懸弧既喜枚都尉能歡陸大夫頻朝中散客連日步兵廚雜曲隨琴用殘花聽酒須脆梨裁數實甘查唯一株兀然已復醉搖頭歌鳳雛本集四庾開府詩集上詩紀百十六喜晴應詔敕自疏韻御辨誠膺録維皇稱有建雷澤昔經漁負夏時從販柏梁驂駟馬高陵馳六傳有序屬賓連無私表平憲河堤崩故柳秋水高新堰心齋愍昏墊樂徹憐胥怨禪河秉高論法輪開勝辨王城水鬭息洛浦河圖獻伏泉還習坎歸風已回巽桐枝長舊圍蒲節抽新寸山藪欣藏疾幽棲得無悶有慶兆民同論年天子萬本集四文苑英華百七十三庾開府詩集上詩紀百十六同顏大夫初晴同顏大夫初晴夕陽含水氣反景照河隄濕花飛未遠陰雲斂向低燕燥還為石龍殘更是泥香泉酌冷澗小艇釣蓮溪但使心齊物何愁物不齊本集四庾開府詩集上詩紀百十六又類聚二初學記二萬花谷二引低泥二韻奉和趙王喜雨奉和趙王喜雨玄霓臨日谷封蟻對雲臺投壺欲起電倚柱稍驚雷白沙如濕粉蓮花類洗杯驚烏灑翼度濕鴈斷行來浮橋七星起高堰六門開猶言祀蜀帝即似望荊臺厥田終上上原野自莓莓本集四庾開府詩集下詩紀百十六又類聚二引臺雷杯來開苞六韻和李司録喜雨和李司録喜雨純陽實久亢雲漢乃昭回臨河沈璧玉夾道畫龍媒離光初繞電震氣始乘雷海童還碣石神女向陽臺雲逐魚鱗起渠從龍骨開崩沙雜水去臥樹擁槎來嘉苗雙合穎熟稻再含胎屬此欣膏露逢君摛掞才愧乏瓊將玖無酬美且偲本集四文苑英華百五十三庾開府詩集上詩紀百十六又類聚二引雷開來胎四韻郊行值雪風雲俱慘慘原野共茫茫雪花開六出冰珠映九光還如驅玉馬暫似獵銀獐陳雲全不動寒山無物香薛君一狐白唐侯兩驌驦寒關日欲暮披雪渡河梁本集四庾開府詩集上詩集百十六奉和趙王西京路春旦直城龍首抗橫橋天漢分風烏疑近日露掌定高雲新渠還入渭舊鼎更開汾漢獵熊攀檻秦田雉失群宜年動春律御宿斂寒氛弄玉迎簫史東方覓細君楊柳成歌曲蒲桃學繡文鳥鳴還獨解花開先自薰誰知灞陵下猶有故將軍本集四文苑英華百五十七庾開府詩集上詩紀百十六奉和夏日應令奉和夏日應令朱簾捲麗日翠幕蔽重陽五月炎蒸氣三時刻漏長麥隨風裏熟梅逐雨中黃開冰帶井水和粉雜生香衫含蕉葉氣扇動竹花涼早菱生軟角初蓮開細房願陪仙鶴舉洛浦聽笙簧本集四初學記三文苑英華百七十九作庾亮詩紀百十六和樂儀同苦熱和樂儀同苦熱火井沉熒散炎洲高焰通鞭石未成雨鳴鳶不起風思為鸞翼扇願借明光宮臨淄迎子禮中散就安豐美酒含蘭氣甘瓜開蜜筒寂寥人事屏還得隱墻東本集四文苑英華二百十樂府詩集六十五庾開府詩集上詩紀百十六和裴儀同秋日和裴儀同秋日蕭條依白社寂寞似東皋學異南宮敬貧同北郭騷蒙吏觀秋水萊妻紡落毛旅人嗟歲暮田家厭作勞霜天林木燥秋氣風雲高栖遑終不定方欲涕沾袍本集四庾開府詩集上詩紀百十六詠園花暫往春園傍聊過看果行枝繁類金谷花雜映河陽自紅無假染真白不須粧燕送歸菱井蜂銜上蜜房非是金爐氣何關柏殿香裛衣偏定好應持奉魏王本集四類聚八十八詩紀百十六西門豹廟君子為利博達人樹德深蘋藻由斯薦樵蘇幸未侵恭聞正臣祀良識佩韋心容範雖年代徽猷若可尋菊花隨酒馥槐影向窗臨鶴飛疑逐舞魚驚似聽琴漳流鳴磴石銅雀影秋林本集四類聚三十八文苑英華三百二十庾開府詩集下詩紀百十六和王少保遙傷周處士和王少保遙傷周處士冥漠爾遊岱悽涼余向秦雖言異生死同是不歸人昔余仕冠蓋值子避風塵望氣求真隱伺關待逸民忽聞泉石友芝桂不防身悵然張仲蔚悲哉鄭子真三山猶有鶴五柳更應春遂令從渭水投弔往江濱本集四類聚三十四文苑英華三百二庾開府詩集上詩紀百十六王司徒褒傷王司徒褎褒昔聞王子晉輕舉逐神仙謂言君積善還得嗣前賢四海皆流寓非為獨播遷豈意中台坼君當風燭前自君鍾鼎族江東三百年寶刀仍世載雕戈本舊傳緑紱紆槐綬黃金飾侍蟬地建忠臣國家開孝子泉自能枯木潤足得流水圓以君承祖武諸侯無間然青矝已對日童子即論天潁陰珠玉麗河陽脂粉妍名高六國共價重十城連辨足觀秋水文堪題馬鞭回鸞抱書字別鶴繞琴弦擁旄裁甸服垂帷非被邊靜亭空繫馬間烽直起煙不廢披書案無妨坐釣船茂陵忽多病淮陽實未痊侍醫逾默默神理遂綿綿永別張平子長埋王仲宣柏谷移松樹陽陵買墓田陝路秋風起寒堂已颯焉丘楊一搖落山火即時然昔為人所羡今為人所憐世途旦復旦人情玄又玄故人傷此別留恨滿秦川定名於此定全德以斯全唯有山陽笛悽余思舊篇本集四文苑英華三百二庾開府詩集上詩紀百十六仰和何僕射還宅懷故紫閣旦朝罷中臺夕奏稀無復千金笑徒勞五日歸步簷朝未掃蘭房晝掩扉苔生理曲處網積回文機故瑟餘弦斷歌梁秋鴈飛朝雲雖可望夜帳定難依願憑甘露入方假慧燈輝寧知洛城晚還淚獨沾衣本集四玉臺新詠八庾開府詩集下詩紀百十六送炅法師葬送炅法師葬龍泉今日掩石洞即時封玉匣摧談柄懸河落辨鋒香爐猶是柏麈尾更成松郭門未十里山回已數重尚聞香閣梵猶聽竹林鐘送客風塵擁寒郊霜露濃性靈如不滅神理定何從本集四初學記十四文苑英華三百五庾開府詩集下詩紀百十六
