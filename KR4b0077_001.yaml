body:
  text: 卷一並序三月三日華林園馬射賦並序臣聞堯以仲春之月刻玉而遊河舜以甲子之朝披圖而巡洛夏后瑤臺之上或御二龍周王玄圃之前猶驂八駿我大周之創業也南正司天北正司地平九黎之亂定三危之罪雲紀御官鳥司從職皇王有秉歷之符玄圭有成功之瑞豈直天地合德日月光華而已哉皇帝以上聖之姿膺下武之運通乾象之靈啓神明之德夷典秩宗見之三禮夔為樂正聞之九成克己備於禮容威風總於戎政加以卑躬菲食皂帳綈衣百姓為心四海為念西郊不雨即動皇情東作未登彌回天眷兵革無會非有待於丹烏宮觀不移故無勞於白燕銀甕金船山車澤馬豈止竹葦兩草共垂甘露青赤三氣同為景星雕題鑿齒識海水而來王烏弋黃支驗東風而受吏于時玄鳥司曆蒼龍御行羔獻冰開桐華萍生皇帝幸於華林之園玉衡正而太階平閶闔開而勾陳轉千乘雷動萬騎雲屯落花與芝蓋同飛楊柳共春旗一色乃命群臣陳大射之禮雖行祓禊之飲即用春搜之儀止立行宮裁舒帳殿階無玉璧既異河間之碑戶不金鋪殊非許昌之賦洞庭既張承雲乃奏騶虞九節貍首七章正繪五彩之雲壺寧百福之酒唐弓九合冬幹春膠夏箭三成青莖赤羽於是選朱汗之馬挍黃金之埒紅陽飛鵲紫燕晨風唐成公之驌驦海西侯之千里莫不飲羽銜竿吟猿落鴈鐘鼓震地埃塵漲天酒以罍行肴由鼎進彩則錦市俱移錢則銅山合徙太史聽鼓而論功司馬張旃而賞獲上則雲布雨施下則山藏海納實天地之至樂景福之歡欣者也既若木將低金波欲上天顧惟穆賓歌惟醉雖復暫離北闕聊宴西城即同酆水之朝更是岐山之會小臣不舉奉詔為文以管窺天以蠡酌海盛德形容豈陳梗概歲次昭陽月在大梁其日上巳其時少陽春史司職青祇效祥徵萬騎於平樂開千門於建章屬車釃酒復道焚香皇帝翊四圍於帝間回六龍於天苑對宣曲之平林望甘泉之長坂華蓋平飛風烏細轉路直城遙林長騎遠帷宮宿設帳殿開筵傍臨細柳斜界祈年開鸛列之陳靡魚鬚之旃行漏抱刻前旌載鳶河湄剃草渭口澆泉堋雲五色的暈重圓陽管既調春絃實撫揔章協律成均樹羽翔鳳為林靈芝為圃草銜長帶桐垂細乳鳥囀歌來花濃雪聚玉律調鐘金錞節鼓於是咀銜拉鐵逐日追風並試長楸之埒俱下蘭池之宮鳴鞭則汗赭入埒則塵紅既觀賢於大射乃頒政於司弓變三驅而畫鹿登百尺而懸熊繁弱振地鐵驪踏空禮正六耦詩歌九節七札俱穿五豝同穴弓如明月對堋馬似浮雲向埒鴈失群而行斷猿求林而路絶控玉勒而搖星跨金鞍而動月乃有六郡良家五陵豪選新回馬邑之兵始罷龍城之戰將軍戎服來參武宴尚帶流星猶乘奔電始聽鼓而唱籌即移竿而標箭馬噴沾衣塵驚灑面石堰水而澆園花乘風而繞殿熊耳刻杯飛雲畫罍水衡之錢山積織室之錦霞開司筵賞至酒正杯來至樂則賢乎秋水歡笑則勝上春臺既而日下澤宮筵闌相圃悵徙蹕之留歡眷回鑾之餘舞欲使石梁銜箭銅山飲羽橫弧於楚水之蛟飛鏃於吳亭之虎況復恭己無為南風在斯非有心於蜓翼豈留情於戟枝唯觀揖讓之禮蓋取威雄之儀文苑英華五十八藝文類聚四初學記四小園賦若夫一枝之上巢父得安巢之所一壺之中壺公有容身之地況乎管寧藜床雖穿而可坐嵇康鍛竈既暖而堪眠豈必連闥洞房南陽樊重之第緑墀青瑣西漢王根之宅余有數畝弊廬寂寞人外聊以擬伏臘聊以避風霜雖復晏嬰近市不求朝夕之利潘嶽面城且適間居之樂況乃黃鶴戒露非有意於輪軒爰居避風本無情於鐘鼓陸機則兄弟同居韓康則舅甥不別蝸角蚊睫又足相容者也爾乃窟室徘徊聊同鑿坯桐間露落柳下風來琴號珠柱書名玉杯有棠梨而無館足酸棗而非臺猶得欹側八九丈縱橫數十步榆柳三兩行梨桃百餘樹撥蒙密兮見窗行欹斜兮得路蟬有翳兮不驚雉無羅兮何懼草樹混淆枝格相交山為簣覆地有堂坳藏貍並窟乳鵲重巢連珠細茵長柄寒匏可以療飢可以棲遲佹嶇兮狹室穿漏兮茅茨簷直倚而妨帽戶平行而礙眉坐帳無鶴支床有龜鳥多間暇花隨四時心則歷陵枯木髮則睢陽亂絲非夏日而可畏異秋天而可悲一寸二寸之魚三竿兩竿之竹雲氣蔭於叢蓍金精養於秋菊棗酸梨酢桃榹李薁落葉半床狂花滿屋名為野人之家是謂愚公之谷試偃息於茂林乃久羡於抽簪雖有門而長閉實無水而恆沉三春負鋤相識五月披裘見尋問葛洪之藥性訪京房之卜林草無忘憂之意花無長樂之心鳥何事而逐酒魚何情而聽琴加以寒暑異令乖違德性崔駰以不樂損年吳質以長愁養病鎮宅神以薶石厭山精而照鏡屢動莊舄之吟幾行魏顆之命薄晚間閨老幼相攜蓬頭王霸之子椎髻梁鴻之妻燋麥兩甕寒菜一畦風騷騷而樹急天慘慘而雲低聚空倉而雀噪驚懶婦而蟬嘶昔草濫於吹噓藉文言之慶餘門有通德家承賜書或陪玄武之觀時參鳳皇之墟觀受釐於宣室賦長楊於直廬遂乃山崩川竭冰碎瓦裂大盜潛移長離永滅摧直轡於三危碎平途於九折荊軻有寒水之悲蘇武有秋風之別關山則風月悽愴隴水則肝腸斷絶龜言此地之寒鶴訝今年之雪百齡兮倏忽光華兮已晚不雪鴈門之踦先念鴻陸之遠非淮海兮可變非金丹兮能轉不暴骨於龍門終低頭於馬坂諒天造兮昧昧嗟生民兮渾渾藝文類聚六十五文苑英華九十七竹杖賦桓宣武平荊州外白有稱楚丘先生來詣門下桓公曰名父之子流離江漢孤之責矣及令引進乃曰噫子老矣鶴髮雞皮蓬頭歷齒乃是江漢英靈衡荊杞梓雖有聞於十室幸無求於千里寡人有銅環靈壽銀角桃枝開木瓜而未落養蓮花而不萎迎仙客於錦市送遊龍於葛陂先生將以養老將以扶危先生笑而言曰中國明於禮義暗於知人心之憂矣惟我生民雖復疏條徑柘促節貞筠杖端刻鳥角首圖麟豈能相豫此疾將豫此身若乃世變市朝年移陵谷猿吟鷹厲風霜慘黷楚漢爭衡袁曹競逐獸食無草禽巢無木于時無懼而栗不寒而戰胡馬哀吟羌笳悽囀親友離絶妻孥流轉玉關寄書章臺留釧寒關悽愴羈旅悲涼疏毛抵於矰繳脆骨被於風霜髮種種而愈短眉髟髟而競長是以憂幹扶疏悲條鬱結宿昔僛醜俄然耆耋變田鳳於承宮改陽文於鬷蔑潘嶽秋興嵇生倦遊桓談不樂吳質長愁並皆年華未暮容貌先秋豫此衰矣雖然有以非鬼非蜮乃心憂矣未見從心先求順耳伯玉何嗟丘明唯恥拉虎捭熊余猶稚童觀形察貌子實悲翁別有九棘龐眉三槐暮齒孔光謝病袁逢致仕吳濞不朝楊彪喪子明公此贈或非乖理先生乃歌曰秋藜促節白藋同心終堪荷蓧自足驅禽一傳大夏空成鄧林藝文類聚六十九文苑英華一百九邛竹杖賦沉冥子遊巴山之岑取竹於北陰㛹娟高節寂歷無心霜風色古露染斑深每與龍鍾之族幽翳沉沉文不自殊質而見賞蘊諸鳴鳳之律制以成龍之杖拔條徑直璘斌色滋和輪人之不重待羽客以相貽青春欲暮白雲來遲謀於長者操以從之執末而獻無因自持諸蔗雖甘不可以倚彼藜雖實不可以美未若處不材之間當有用之始魯分以爵漢錫以年昔尚爾齒今優我賢書橫几玉塵筵則函之以後拂之以前爾其摘芳林沼行樂軒除間尊卑之垂帨隨上下之遊紆寄根江南渺渺幽潭傳節大夏悠悠廣野豈比夫接君堂上之履為君座右之銘而得與綺紳瑤珮出芳房於蕙庭文苑英華一百九並序哀江南賦並序粵以戊辰之年建亥之月大盜移國金陵瓦解余乃竄身荒谷公私塗炭華陽奔命有去無歸中興道銷窮于甲戌三日哭于都亭三年囚於別館天道周星物極不反傅燮之但悲身世無處求生袁安之每念王室自然流涕昔桓君山之志事杜元凱之平生並有著書咸能自序潘嶽之文彩始述家風陸機之詞賦先陳世德信年始二毛即逢喪亂藐是流離至於暮齒燕歌遠別悲不自勝楚老相逢泣將何及畏南山之雨忽踐秦庭讓東海之濱遂餐周粟下亭漂泊高橋羈旅楚歌非取樂之方魯酒無忘憂之用追為此賦聊以記言不無危苦之詞唯以悲哀為主日暮塗遠人間何世將軍一去大樹飄零壯士不還寒風蕭瑟荊璧睨柱受連城而見欺載書橫階捧珠盤而不定鍾儀君子入就南冠之囚季孫行人留守西河之館申包胥之頓地碎之以首蔡威公之淚盡加之以血釣臺移柳非玉關之可望華亭鶴唳豈河橋之可聞孫策以天下為三分衆才一旅項籍用江東之子弟人唯八千遂乃分裂山河宰割天下豈有百萬義師一朝卷甲芟夷斬伐如草木焉江淮無涯岸之阻亭壁無藩籬之固頭會箕斂者合從締交鋤耰棘矜者因利乘便將非江表王氣終于三百年乎是知併吞六合不免軹道之災混一車書無救平陽之禍嗚呼山嶽崩頽既履危亡之運春秋迭代必有去故之悲天意人事可以悽愴傷心者矣況復舟楫路窮星漢非乘槎可上風飆道阻蓬萊無可到之期窮者欲達其言勞者須歌其事陸士衡聞而撫掌是所甘心張平子見而陋之固其宜矣我之掌庾承周以世功而為族經邦佐漢用論道而當官稟嵩華之玉石潤河洛之波瀾居負洛而重世邑臨河而晏安逮永嘉之艱虞始中原之乏主民枕倚於墻壁路交橫於豺虎值五馬之南奔逢三星之東聚彼凌江而建國始播遷於吾祖分南陽而賜田裂東嶽而胙土誅茅宋玉之宅穿徑臨江之府水木交運山川崩竭家有直道人多全節訓子見於純深事君彰於義烈新野有生祠之廟河南有胡書之碣況乃少微真人天山逸民階庭空谷門巷蒲輪移談講樹就簡書筠降生世德載誕貞臣文詞高于甲觀模楷盛於漳濱嗟有道而無鳳歎非時而有麟既姦回之奰匿終不悅於仁人王子濱洛之歲蘭成射策之年始含香於建禮仍矯翼於崇賢遊洊雷之講肆齒明離之胄筵既傾蠡而酌海遂測管而窺天方塘水白釣渚池圓侍戎韜於武帳聽雅曲於文絃乃解懸而通籍遂崇文而會武居笠轂而掌兵出蘭池而典午論兵於江漢之君拭玉於西河之主于時朝野歡娛池臺鐘鼓里為冠蓋門成鄒魯連茂苑於海陵跨橫塘於江浦東門則鞭石成橋南極則鑄銅為柱橘則園植萬株竹則家封千戶西賮浮玉南琛沒羽吳歈越吟荊艷楚舞草木之遇陽春魚龍之逢風雨五十年中江表無事班超為定遠之侯王歙為和親之使馬武無預於甲兵馮唐不論於將帥豈知山嶽暗然江湖潛沸漁陽有閭左戍卒離石有將兵都尉天子方刪詩書定禮樂設重雲之講開士林之學談劫燼之灰飛辨常星之夜落地平魚齒城危獸角臥刁斗於滎陽絆龍媒於平樂宰衡以干戈為兒戲縉紳以清談為廟略乘漬水以膠船馭奔駒以朽索小人則將及水火君子則方成猿鶴弊箄不能救鹽池之鹹阿膠不能止黃河之濁既而魴魚頳尾四郊多壘殿狎江鷗宮鳴野雉湛盧去國艅艎失水見被髮於伊川知百年而為戎矣彼姦逆之熾盛久遊魂而放命大則有鯨有鯢小則為梟為獍負其牛羊之力肆其水草之性非玉燭之能調豈璿璣之可正值天下之無為尚有欲於羈縻飲其琉璃之酒賞其虎豹之皮見胡柯於大夏識鳥卵于條枝豺牙密厲虺毒潛吹輕九鼎而欲問聞三川而遂窺始則王子召戎姦臣介胄既官政而離逖遂師言而泄漏望廷尉之逋囚反淮南之窮寇出狄泉之蒼鳥起橫江之困獸地則石鼓鳴山天則金精動宿北闕龍吟東陵麟鬭爾乃桀黠構扇馮陵畿甸擁狼望於黃圖填盧山於赤縣青袍如草白馬如練天子履端廢朝單于長圍高宴兩觀當戟千門受箭白虹貫日蒼鷹擊殿竟遭夏臺之禍終視堯城之變官守無奔問之人干戚非平戎之戰陶侃空爭米船顧榮虛搖羽扇將軍死綏路絶重圍烽隨星落書逐鳶飛遂乃韓分趙裂鼓臥旗折失群班馬迷輪亂轍猛士嬰城謀臣卷舌昆陽之戰象走林常山之陳蛇奔穴五郡則兄弟相悲三州則父子離別護軍慷慨忠能死節三世為將終於此滅濟陽忠壯身參末將兄弟三人義聲俱唱主辱臣死名存身喪敵人歸元三軍悽愴尚書多算守備是長雲梯可拒地道能防有齊將之閉壁無燕師之臥墻大事去矣人之云亡申子奮發勇氣咆勃實總元戎身先士卒胄落魚門兵填馬窟屢犯通中頻遭刮骨功業夭枉身名埋沒或以隼翼鷃披虎威狐假沾漬鋒鏑脂膏原野兵弱虜強城孤氣寡聞鶴唳而虛驚聽胡笳而淚下據神亭而亡戟臨橫江而棄馬崩於巨鹿之沙碎於長平之瓦於是桂林顛覆長洲麋鹿潰潰沸騰茫茫墋黷天地離阻人神慘酷晉鄭靡依魯衛不睦競動天關爭回地軸探雀鷇而未飽待熊蹯而詎熟乃有車側郭門筋懸廟屋鬼同曹社之謀人有秦庭之哭爾乃假刻璽於關塞稱使者之酬對逢鄂坂之譏嫌值耐門之征稅乘白馬而不前策青騾而轉礙吹落葉之扁舟飄長風於上遊彼鋸牙而鉤爪又巡江而習流排青龍之戰艦鬭飛燕之船樓張遼臨於赤壁王濬下於巴丘乍風驚而射火或箭重而回舟未辨聲於黃蓋已先沉於杜侯落帆黃鶴之浦藏船鸚鵡之洲路已分於湘漢星猶看於斗牛若乃陰陵路絶釣臺斜趣望赤岸而沾衣艤烏江而不渡雷池柵浦鵲陵焚戍旅舍無煙巢禽無樹謂荊衡之杞梓庶江漢之可恃淮海維揚三千餘里過漂渚而寄食託蘆中而渡水屆于七澤濱于十死嗟天保之未定見殷憂之方始本不達於危行又無情於祿仕謬掌衛於中軍濫尸丞於御史信生世等於龍門辭親同於河洛奉立身之遺訓受成書之顧託昔三世而無慚今七葉而方落泣風雨於梁山惟枯魚之銜索入欹斜之小徑掩蓬藋之荒扉就汀洲之杜若待蘆葦之單衣于時西楚霸王劍及繁陽麾兵金匱挍戰玉堂蒼鷹赤雀鐵軸牙檣沉白馬而誓衆負黃龍而渡江海潮迎艦江萍送王戎車屯於石城戈船掩于淮泗諸侯則鄭伯前驅盟主則荀罃暮至剖巢燻穴奔魑走魅埋長狄於駒門斬蚩尤於中冀然腹為燈飲頭為器直虹貫壘長星屬地昔之虎據龍盤加以黃旗紫氣莫不隨狐兔而窟穴與風塵而殄悴西瞻博望北臨玄圃月榭風臺池平樹古倚弓於玉女窗扉繫馬於鳳皇樓柱仁壽之鏡徒懸茂陵之書空聚若夫立德立言謨明寅亮聲超於繫表道高於河上更不遇於浮丘遂無言於師曠以愛子而托人知西陵而誰望非無北闕之兵猶有雲臺之仗司徒之表裏經綸狐偃之惟王實勤橫雕戈而對霸主執金鼓而問賊臣平吳之功壯於杜元凱王室是賴深於溫太真始則地名全節終則山稱枉人南陽挍書去之已遠上蔡逐獵知之何晚鎮北之負譽矜前風飆凜然水神遭箭山靈見鞭是以蟄熊傷馬浮蛟沒船才子併命俱非百年中宗之夷凶靜亂大雪冤恥去代邸而承基遷唐郊而纂祀反舊章於司隸歸餘風於正始沉猜則方逞其欲藏疾則自矜於己天下之事沒焉諸侯之心搖矣既而齊交北絶秦患西起況背關而懷楚冀端委而開吳驅緑林之散卒拒驪山之叛徒營軍梁溠搜乘巴渝問諸淫昏之鬼求諸厭劾之巫荊門遭廩延之戮夏口濫逵泉之誅蔑因親以教愛忍和樂於彎弧既無謀於肉食非所望於論都未深思於五難先自擅於三端登陽城而避險臥砥柱而求安既言多於忌刻實志勇而刑殘但坐觀於時變本無情於急難地惟黑子城猶彈丸其怨則黷其盟則寒豈冤禽之能塞海非愚叟之可移山況以沴氣朝浮妖精夜殞赤烏則三朝夾日蒼雲則七重圍軫亡吳之歲既窮入郢之年斯盡周含鄭怒楚結秦冤有南風之不競值西鄰之責言俄而梯衝亂舞冀馬雲屯俴秦車於暢轂沓漢鼓於雷門下陳倉而連弩渡臨晉而橫船雖復楚有七澤人稱三戶箭不麗於六麋雷無驚於九虎辭洞庭兮落木去涔陽兮極浦熾火兮焚旗貞風兮害蠱乃使玉軸揚灰龍文折柱下江餘城長林故營徒思拑馬之秣未見燒牛之兵章慢支以轂走宮之奇以族行河無冰而馬渡關未曉而雞鳴忠臣解骨君子吞聲章華望祭之所雲夢偽遊之地荒谷縊於莫敖冶父囚於群帥硎穽摺拉鷹鸇批㩌冤霜夏零憤泉秋沸城崩杞婦之哭竹染湘妃之淚水毒秦涇山高趙陘十里五里長亭短亭飢隨蟄燕暗逐流螢秦中水黑關上泥青於時瓦解冰泮風飛雹散渾然千里淄澠一亂雪暗如沙冰橫似岸逢赴洛之陸機見離家之王粲莫不聞隴水而掩泣向關山而長嘆況復君在交河妾在清波石望夫而逾遠山望子而逾多才人之憶代郡公子之去清河栩揚亭有離別之賦臨江王有愁思之歌別有飄颻武威羈旅金微班超生而望返溫序死而思歸李陵之雙鳧永去蘇武之一鴈空飛若江陵之中否乃金陵之禍始雖借人之外力實蕭牆之內起撥亂之主忽焉中興之宗不祀伯兮叔兮同見戮於猶子荊山鵲飛而玉碎隨岸蛇生而珠死鬼火亂於平林殤魂遊於新市梁故豐徙楚實秦亡不有所廢其何以昌有媯之後將育於薑輸我神器居為讓王天地之大德曰生聖人之大寶曰位用無賴之子弟舉江東而全棄惜天下之一家遭東南之反氣以鶉首而賜秦天何為而此醉且夫天道回旋生民賴焉余烈祖於西晉始流播於東川洎余身而七葉又遭時而北遷提挈老幼關河纍年死生契闊不可問天況復零落將盡靈光巋然日窮于紀歲將復始逼切危慮端憂暮齒踐長樂之神皋望宣平之貴里渭水貫於天門驪山回於地市幕府大將軍之愛客丞相平津侯之待士見鐘鼎於金張聞絃歌於許史豈知灞陵夜獵猶是故時將軍咸陽布衣非獨思歸王子周書庾信傳藝文類聚三十四文苑英華一百二十九並序傷心賦並序余五福無徵三靈有譴至於繼體多從夭折二男一女並得勝衣金陵喪亂相守亡歿羈旅關河倏然白首苗而不秀頻有所悲一女成人一長孫孩稚奄然玄壤何痛如之既傷即事追悼前亡唯覺傷心遂以傷心為賦若夫入室生光非復企及夾河為郡前途逾遠婕妤有自傷之賦揚雄有哀祭之文王正長有北郭之悲謝安石有東山之恨豈期然矣至若曹子建王仲宣傅長虞應德璉劉韜之母任延之親書翰傷切文詞哀痛千悲萬恨何可勝言龍門之桐其枝已折卷施之草其心實傷嗚呼哀哉賦曰悲哉秋風搖落變衰魂兮遠矣何去何依望思無望歸來不歸未達東門之意空懼西河之譏在昔金陵天下喪亂王室板蕩生民塗炭兄弟則五郡分張父子則三州離散地鼎沸於袁曹人豺狼於楚漢或有擁樹罹災藏衣遭難未設桑弧先空柘館人惟一丘亭遂千秋邊韶永恨孫楚長愁張武壯之心疾羊南城之淚流痛斯繼體尋茲世載天道斯慈人倫此愛膝下龍摧掌中珠碎芝在室而先枯蘭生庭而蚤刈命之修短哀哉已滿鶴聲孤絶猿吟腸斷嬴博之間路似新安藤緘轊櫝枿掩虞棺不封不樹惟棘惟欒天慘慘而無色雲蒼蒼而正寒況乃流寓秦川飄颻播遷從官非官歸田不田對玉關而羈旅坐長河而暮年已觸目於萬恨更傷心於九泉至如三虎二龍三珠兩鳳並有山澤之靈各入熊羆之夢望隴首而不歸出都門而長送對寶碗而痛心撫玄經而流慟石華空服犀角虛篸風無少女草不宜男烏毛徒覆獸乳空含震為長男之宮巽為長女之位在我生年先凋此地人生幾何百憂俱至二王奉佛二郗奉道必至有期何能相保凄其零露颯焉秋草去矣黎民哀哉仲仁冀羊祐之前識期張衡之後身一朝風燭萬古埃塵丘陵兮何忍能留兮幾人藝文類聚三十四文苑英華一百二十九枯樹賦殷仲文者風流儒雅海內知名世異時移出為東陽太守常忽忽不樂顧庭槐而歎曰此樹婆娑生意盡矣至如白鹿貞松青牛文梓根柢盤魄山崖表裏桂何事而銷亡桐何為而半死昔之三河徙植九畹移根開花建始之殿落實睢陽之園聲含嶰谷曲抱雲門將雛集鳳比翼巢鴛臨風亭而唳鶴對月峽而吟猿乃有拳曲擁腫盤坳反覆熊虎顧盻魚龍起伏節豎山連文橫水蹙匠石驚視公輸眩目雕鐫始就剞劂仍加平鱗鏟甲落角摧牙重重碎錦片片真花紛披草樹散亂煙霞若夫松梓古度平仲君遷森梢百頃槎枿千年秦則大夫受職漢則將軍坐焉莫不苔埋菌壓鳥剝蟲穿或低垂於霜露或撼頓於風煙東海有白木之廟西河有枯桑之社北陸以楊葉為關南陵以梅根作冶小山則叢桂留人扶風則長松繫馬豈獨城臨細柳之上塞落桃林之下若乃山河阻絶飄零離別拔本垂淚傷根瀝血火入空心膏流斷節橫洞口而欹臥頓山腰而半折文斜者百圍冰碎理正者千尋瓦裂戴癭銜瘤藏穿抱穴木魅䁡睒山精妖孽況復風雲不感羈旅無歸未能採葛還成食薇沉淪窮巷蕪沒荊扉既傷搖落彌嗟變衰淮南子云木葉落長年悲斯之謂矣乃歌曰建章三月火黃河千里槎若非金谷滿園樹即是河陽一縣花桓大司馬聞而嘆曰昔年種柳依依漢南今看搖落悽愴江潭樹猶如此人何以堪藝文類聚八十八文苑英華一百四十三古文苑七春賦宜春苑中春已歸披香殿裏作春衣新年鳥聲千種囀二月楊花滿路飛河陽一縣併是花金谷從來滿園樹一叢香草足礙人數尺遊絲即橫路開上林而競入擁河橋而爭渡出麗華之金屋下飛燕之蘭宮叉朵多而訝重髻鬟高而畏風眉將柳而爭緑面共桃而競紅影來池裏花落衫中苔始緑而藏魚麥才青而覆雉吹簫弄玉之臺鳴佩凌波之水移戚里而家富入新豐而酒美石榴聊泛蒲桃醱醅芙蓉玉碗蓮子金杯新芽竹笋細核楊梅緑珠捧琴至文君送酒來玉管初調鳴絃暫撫陽春淥水之曲對鳳回鸞之舞更炙笙簧還移箏柱月入歌扇花承節鼓協律都尉射雉中郎停車小苑連騎長楊金鞍始被柘弓新張拂塵看馬埒分朋入射堂馬是天池之龍種帶乃荊山之玉梁艷錦安天鹿新綾織鳳皇三日曲水向河津日晚河邊多解神樹下流杯客沙頭渡水人鏤薄窄衫袖穿珠帖領巾百丈山頭日欲斜三晡未醉莫還家池中水影懸勝鏡屋裏衣香不如花藝文類聚三初學記三七夕賦兔月先上羊燈次安覩牛星之曜景視織女之闌干於是秦娥麗妾趙艷佳人窈窕名燕逶迤姓秦嫌朝妝之半故憐晚拭之全新此時併捨房櫳共往庭中縷條緊而貫矩針鼻細而穿空藝文類聚四初學記四御覽三十一象戲賦觀夫造作權輿皇王厥初法凝陰於厚德仰沖氣於清虛於是緑簡既開丹局直正理洞研幾原窮作聖若扣洪鍾如懸明鏡白鳳遙臨黃雲高映可以變俗移風可以蒞官行政是以局取諸乾仍圖上玄月輪新滿日暈初圓模羽林之華蓋寫明堂之璧泉坤以為輿剛柔卷舒若方鏡而無影似空城而未居促成文之畫亡靈龜之圖馬麗千金之馬符明六甲之符於是搢笏當次依辰就席回地理於方圭轉天文於圓璧分荊山之美玉數藍田之珉石南行赤水之符北使玄山之策居東道而龍青出西關而馬白既舒玄象聊定金枰昭日月之光景乘風雲之性靈取四方之正色用五德之相生從月建而左轉起黃鍾而順行陰翻則顧兔先出陽變則靈烏獨明況乃豫遊仁壽行樂徽音水影搖日花光照林乍披圖而久玩或開經而熟尋雖復成之於手終須得之於心乃有龍燭銜花金爐浮氣月落桂垂星斜柳墜猶豫樞機嫌疑涇渭顧望回惑心情怖畏應對坎而衝離忽當申而取未藝文類聚七十四燈賦九龍將暝三爵行棲瓊鉤半上若木全低窗藏明於粉壁柳助暗於蘭閨翡翠珠被流蘇羽帳舒屈膝之屏風掩芙蓉之行障卷衣秦后之床送枕荊臺之上乃有百枝同樹四照連盤香添然蜜氣雜燒蘭燼長宵久光青夜寒秀華掩映蚖膏照灼動鱗甲於鯨魚焰光芒於鳴鶴蛾飄則碎花亂下風起則流星細落況復上蘭深夜中山醑清楚妃留客韓娥合聲低歌著節遊絃絶鳴輝輝朱燼焰焰紅榮乍九光而連彩或雙花而並明寄言蘇季子應知餘照情藝文類聚八十初學記二十五對燭賦龍沙雁塞甲應寒天山月沒客衣單燈前桁衣疑不亮月下穿針覺最難刺取燈花持桂燭還卻燈檠下燭盤鑄鳳銜蓮圖龍並眠燼高疑數翦心濕暫難然銅荷承淚蠟鐵鋏染浮煙本知雪光能映紙復訝燈花今得錢蓮帳寒檠窗拂曙筠籠熏火香盈絮傍垂細溜上繞飛蛾光清寒入焰暗風過楚人纓脫盡燕君書誤多夜風吹香氣隨鬱金苑芙蓉池秦皇辟惡不足道漢武胡香何物奇晚星沒芳蕪歇還持照夜遊詎減西園月藝文類聚八十初學記二十五鏡賦天河漸沒日輪將起燕噪吳王烏驚御史玉花簟上金蓮帳裏始摺屏風新開戶扇朝光晃眼早風吹面臨桁下而牽衫就箱邊而著釧宿鬟尚卷殘粧已薄無復脣珠才餘眉萼靨上星稀黃中月落鏡臺銀帶本出魏宮能橫卻月巧挂回風龍垂匣外鳳倚花中鏡乃照膽照心難逢難值鏤五色之盤龍刻千年之古字山雞看而獨舞海鳥見而孤鳴臨水則池中月出照日則壁上菱生暫設粧奩還抽鏡屜競學生情爭憐今世鬢齊故略眉平猶剃飛花磚子次第須安朱開錦踏黛雜油檀脂和甲煎澤漬香蘭量髻鬢之長短度安花之相去懸媚子於搔頭拭叉梁於粉絮梳頭新罷照著衣還從粧處取將歸暫看弦繫懸知纈縵衫正身長裙斜假襻真成箇鏡特相宜不能片時藏匣裏暫出園中也自隨藝文類聚七十鴛鴦賦虞姬小來事魏王自有歌聲足繞梁何曾織錦未肯挑桑終歸薄命著罷空床見鴛鴦之相學還欹眼而淚落南陽漬粉不復看京兆新眉遂懶約況復雙心並翼馴狎池籠浮波弄影刷羽乘風共飛簷瓦全開魏宮俱棲梓樹堪是韓馮若乃韓壽欲婚溫嶠願婦玉臺不送胡香未有必見此之雙飛覺空床之難守藝文類聚九十二蕩子賦蕩子辛苦逐征行直守長城千里城隴水恆冰合關山唯月明況復空床起怨倡婦生離紗窗獨掩羅帳長垂新箏不弄長笛羞吹常年桂苑昔日蘭閨羅敷總髮弄玉初笄新歌子夜舊舞前溪別後閨情無復情奩前明鏡不須明合歡無信寄回紋織未成遊塵滿床不用拂細草橫階隨意生前日漢使著章臺聞道夫壻定應回手巾還欲燥愁眉即剩開逆想行人至迎前含笑來藝文類聚三十二
