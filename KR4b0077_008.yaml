body:
  text: 卷八賀平鄴都表賀平鄴都表臣某言臣聞太山梁甫以來即有七十二代龍圖龜書之後又已三千餘年雖復制法樹司禮殊樂異至於文離武落剡木弦弧席卷天下之心包含八荒之志其揆一矣伏惟皇帝陛下握天樞秉地軸駕馭風雲驅馳龍虎沉雄內斷不勞謀於力牧天策勇決無待問於容成是以威風所振烈火之遇鴻毛旗鼓所臨衝風之卷秋葉竊聞伊洛戎夷幽并僭偽抱圖載籍已歸丞相之府銜玉繫綬並詣中軍之營百年逋誅遂窮巢窟三代敵怨俄然掃蕩昔周王鮪水之師尚勞再駕軒轅上谷之戰猶須九伐未有一朝指麾獨決神慮平定宇內光宅天下二十八宿止餘吳越一星千二百國裁漏麟洲小水若夫咸康之年四方始定建武之代諸侯並朝不得同年而語矣雖復八風並唱未足頌其英聲六樂俱陳無以歌其神武坐釣臺而誓衆姒啓繼夏禹之功入商郊而問罪姬發成周文之志無改之道大孝也歟當今鹿臺已散離宮已遣兵藏武庫馬入華山立明堂之制奏大武之樂盛矣哉上天降休未之有也政須東南一尉立於比景之南西北一候置於交河之北然後命東后詔蒼冥衢壇琬碑銀繩瓊檢告厥成功差無慚德臣忝竊榮幸蒞政東藩不獲躬到闕庭預觀大慶不勝鳧藻踊躍之至謹遣主簿陪臣曹敏奉表以聞文苑英華五百六十六又略見藝文類聚五十九賀新樂表周武帝臣等言臣聞天地順動則雷出為豫聖人成功則風行有節故六德在咸池之官山谷可調八風入承雲之奏人神不雜我太祖文皇帝體國經野設官分職變魏作周移風正雅衣裳而朝萬國圭璧而會諸侯至如經綸圖籍校讎煙燼樂正無缺章秩宗無廢典豈但商頌十篇得諸太師之室虞書五禮取於恭王之宮伏惟皇帝以下武嗣興中陽繼業運日月之明動淵泉之慮律歷著微無煩於太史陰陽晷度躬定於天官故得參考八音研精六代封晉魏為二王序殷周為三恪雖復朱干玉戚尚識典刑素韍纁裳猶因雄據未若山雲特起八卦成形鳳皇于飛九州觀德改金奏於八列合天元於六舞聲含擊石更入登歌調起初鍾還參玉管足以感天地而通神明康帝德而光玄象昔者齋居玄扈為曲在於雲門師度盟津習舞歸于山立遂乃包括三名克諧一代作者之謂聖天之所啓乎豈惟路鼓靈鼗空桑孤竹廣矣大矣輪焉奐焉是知零陵孝廉空傳玉管始平太守虛稱銅尺臣等並預鈞天同觀張樂軒墀弘敞欄檻眺聽崇牙業業猛虡趪趪翠鳳揚旌靈鼉樹鼓杳冥雲霧蕩薄丘陵醴泉與甘露同飛赤鴈與斑麟俱下聘魯請觀理當見其盛德適齊忘味定是知其盡美昔淵魚聽曲尚得聳鱗櫪馬聞絃猶能仰秣臣等誠愧知音敢忘悅豫若使詳其音律是所邈然但能記其鏗鏘於茲為幸不勝慶悅之誠謹詣朝堂奉表以聞文苑英華五百六十九為閻大將軍乞致仕表為閻大將軍乞致仕表臣某言臣聞禮云大夫七十致仕於朝傳家於子膳則二珍衣稱時制臣自出身奉國四十餘年遭遇風雲從微至著太祖文皇帝扶危濟難奄有關河臣實無堪中涓從事自洛食風塵河梁旗鼓華陰有白馬之兵河曲有黃沙之陳臣雖用命不能奇策功薄賞厚因人成事恩澤年表常以愧心仰逢周朝以揖讓登庸謳歌受命主貴臣遷頻煩榮寵三槐以鑄鼎象物知其神姦五等以桓圭飾瑞守其宮室臣以何德兼而有之況復水土之職王梁以應讖受徵兵戈之王韓信以登壇獨拜語其連類臣又何人當今四海未寧三方鼎峙陛下勞心之日群公展效之秋而臣甲子既多耄年又及無參賓客之事謬達諸侯之班尸祿素餐久紊彝典負乘致寇徒煩有司加以寒暑乖違節宣失序風水交侵菁華已竭雖復廉頗強飯馬援據鞍求欲報恩何能為役榮啓期之樂適足自貽燭之武之言無能為也特乞解所居官言從初服事符骸骨之請非謀几杖之賜若臣北陵移病東皋歸老山河茅社一反司勳公侯圭璧還封典瑞則朝無冒位之人臣免妨賢之責虞氏養老敢希東序之榮周朝如荼豈望西郊之禮但瞻仰天威方違咫尺徘徊城闕私增悽戀不任知止之情文苑英華六百三代人乞致仕表臣遡言臣聞一葉將隕寧待於風露百川皆到自竭者潢汙臣輒感之以悲以咽臣某中謝臣仲春之末舊患漸加雙足頗蹇四支不利扶步有邯鄲之失勉視無離婁之明安可率此留務溷茲恆典陛下恩周曲成未忍捐棄微臣困至於亟轉不堪勝臣所以自咎自傷淚繼之血臣某中謝臣特承先緒進不因人陛下憫臣無用舉直而有戇自奉圖太極宣綍中書陛下收臣以一心任臣以獨掌九年冀登宰輔八歲載踐宗伯出擁干旄入參衡鏡或雲臺之上微臣預疇咨之旨或日觀之下詔臣操刊勒之文美而暢之臣實尤忝明憲不敢以纖負玄造竟微於滴助日月其偷冰炭交集誠懷伏以前陪政事親荷德音謂臣等經侍軒墀子孫尚延保護臣荷螻蟻欻戴丘山臣宜生亦盡命死且陳力竊不知終而不知止朝列三數與臣同儕臣未六十推臣則幼獨臣彌當頓悴病不俟年盈量窮涯滿而招損逾時每乖於勿藥永日猶繫於苞桑覽分必然貪榮所忌伏乞免臣見職退畢餘生察臣榮不可支矜臣分不能強乃臣之幸也豈悟仁壽之闥有此一時承明之廬無緣再謁心神已弊晷刻增悲叨睿鑒則多士莫先違聖顏則小臣何遠惟冀三條啓道萬乘巡京悅西怨之群黎逮東風之從者危魂倘駐枯骨如存是臣之愜非臣所望臣又聞驅奔效駕先輟於羸駘翔集賀成近遺於鎩翮彼尚知暮而況臣哉聞未遑請臣之懇戀至於隳官臣合書罪無任戰栗戀結之至文苑英華六百三齊王進白兔表齊王進白兔表臣聞輿圖欲遠則玉虎晨鳴轍迹方開則銀麞入貢伏惟陛下明明在上翼翼居尊德動天關威移地軸是以風煙照燭毛羽禎祥史不絶書府無虛日臣受服元戎用綏邊鄙轅門所屆始次熊山前茅慮無乃獲白兔光鮮越雉色麗秦狐月德符徵金精表瑞呈祥輿頌效異披圖尊敬之迹既明應事之機斯兆臣之龔行實從陝略瑞以素質彌雄西氣庶重承廟算方事申威掩代偃齊分韓裂趙不任鳧藻踊躍之情文苑英華六百十二又略見藝文類聚九十五齊王進蒼烏表齊王進蒼烏表臣某言臣聞飛南陽之雉尚闡霸圖下建章之鵠猶調和氣況乃虞庭告瑞姬社呈祥咸高識哺之心實貴能知之性伏惟皇帝陛下德教百姓孝刑四海攝提從紀天下文明是以東海輸禽乍改黔質西山度羽或變蒼精臣去月三十日行到陝州獲大都督莫仁回樂列稱於州射堂內見一蒼烏林薄回翔循環不去駐乘木之精轉司風之翼即召儀同某甲等同時觀見斯實禮敬所覃孝慈之感理宜歸瑞祕圖書祥帝册用光至德取效升平無令赤鳳留止偏為瘞玉之歌玄鶴徘徊獨擅銜珠之舞文苑英華六百十二齊王進赤雀表齊王進赤雀表臣某言臣聞南陽雉飛尚論秦霸建章鵠下猶明漢德當今天不愛寶地必呈祥自應長樂觀符文昌啓瑞伏惟皇帝欽明文思惟以劬勞成務曆象日月允釐百工海水無波天星不動去四月十三日獲隴右符府參軍李暉牒稱戶屬秦川清水郡伯陽縣文谷林在家庭獲一赤雀光同朱鳳色類丹烏降火飛精似入公車之府流金成製若上凌雲之臺謹按赤雀銜書止於酆戶周之受命興乎此祥即事所觀同符合契實可圖形瑞譜書頌儒林事足成臺名堪紀號豈直雲中太守見赤心之奉主蓬萊童子知白環之報恩臣等預觀休徵情迫恆慶不任鳧藻之至文苑英華六百十二為晉陽公進玉律稱尺斗升表為晉陽公進玉律稱尺斗升表臣某言臣聞三才既立君臣之道已陳六位時成禮樂之功斯正故以叶和日月測度陰陽悅豫兆人儀刑萬國者也伏惟皇帝應籙馭天披圖受命據太陽而懸像履文昌而建極白環表讓德之符玄圭告成功之瑞太階既平升中可習必當水建千年山稱萬歲伏見敕旨刊正音律平章曆象奏黃鍾而歌大呂變孤竹而舞雲門莫不器取疏通聲從安樂四分既明三微且定是以聞鐘於洛浦即辨聲乖聽鐸於邯鄲先知響韻二分二至行於司曆之官九變九成被於中和之職足以動天地感鬼神被風俗平寒暑豈直吟嘯溪谷回翔鸞鳳而已哉是知零陵廟前徒尋舜管始平城下空論周尺臣聞上制其禮下習其儀君定其法臣行其事謹造玉律一具并玉稱尺斗升合等始得成功至於分粟纍黍量絲數籥實以仰稟聖規參詳神思所冀節移陰管無勞河內之灰氣動陽鍾不待金門之竹而琬琰事輕般倕慮淺不足展乎成均增輝度量齎器奉表以聞文苑英華六百十三又見藝文類聚五有刪節進象經賦表臣某言臣伏讀聖製象經并觀象戲私心踴躍不勝抃舞伏以性與天道本絶尋求直以懸諸日月遂獲瞻仰九州既奠近對河圖四轍中繩全觀玉策未飛玄鶴先聞金石之聲不上赤城獨見煙霞之氣置管而測光景愈高沉玉而觀淵泉益遠寢不自涯課虛為賦詞非寥亮學無雕刻遂敢陳述誠為厚顏況復日之遠近本非童子所問天之渾蓋豈是書生所談冒用奏聞伏增流汗之至文苑英華六百一十賀傳位於皇太子表賀傳位於皇太子表臣某言伏見二月十九日詔傳位於皇太子昔者降居弱水登庸有優劣之殊來朝櫟陽繼體有君臣之異不得與夫天之兩日日之再中並曜聯輝重明雙照同年而語矣伏惟天元皇帝唯聖作聖惟親尊親降意於與能鳴謙於神器欲令百工相和先聞揖讓之風天下無為早識吾君之子是以運獨見之明行非常之事先天不違後天而奉皇太子身貞萬國道照四門夙膺再命之符實允基天之命非關復子明辟異於遷虞事夏既損既益尚或二天為離為火何妨兩日且平陽蒲坂賢臣則二十五人顓頊高辛才子則一十六族與此計事何遽無成鼚乎鼓之軒乎舞之自當八風通慶雲聚五老同遊三星運曜豈直雙龍再賜九雉重飛而已哉皇帝邈然姑射正當乘雲馭龍問道崆洞豈復先秋木落臣生預堯年時逢舜日覩惟新之慶實倍萬恆情文苑英華五百五十七又略見藝文類聚十六為杞公讓宗師驃騎表為杞公讓宗師驃騎表臣某言伏見詔書以臣為使持節驃騎大將軍開府儀同三司宗師中大夫伏奉綸言心魂震讋臣聞堯分四嶽是以望秩山川舜命九官是以光華日月必須儀刑以德明試以功乃可協和萬邦咸熙庶績臣幼無學植長闕裁成鴻都之門不能定其章句雞鹿之塞無以名其碑碣憑天潢之派水附若木之分枝東嶽則朝宿有名南宮則門闌有籍在臣庸劣久知滿盈武陽以功臣之重特拜宗師東平以母弟之尊超登上將臣有何德能兼此榮臣早傾庭蔭曾未扶墻母氏慈訓哀矜苦勞甫及成人復垂捐棄几筵如在忍離鞠養之恩終天無報叩地難任欲草土丘陵終身塋域霜露申履時之感燕雀展回翔之心不悟天澤沛然謬垂提拔當今玉燭調和既非金革之世璿璣齊政豈忘松檟之餘況復一枝踡曲終危九層之臺一股涔蹄必傷千里之駕皇帝欽明文思光宅區宇禮格四方無容奪臣此志孝治天下自當哀臣此情大宗為師更求同姓之國元戎參乘別選能賢之臣伏願覽青蒲之奏曲允微誠詔鳳皇之池特收嚴召則天慈無濫私願獲從臣之容身便當有地不任荒悚戰懼之誠謹詣朝堂奉表以聞文苑英華五百七十八功臣不死王事請門襲封表功臣不死王事請門襲封表臣聞以法施民必傳祀典以勞定國必有承家孫叔敖祭酹無聞有傷良相女叔齊胤嗣絶沒實貶賢臣謹案大統十六年格先有封爵死於王事絶嗣者聽以支子繼襲非死王事不許承封前牒五等功臣皆是勤勞王室身當患難扞禦災禍翼贊大猷一日遇疾身捐館舍不幸無胤享祀便絶於禮則不足於義則有傷未求上林之獵已削其侯不服襜褕之衣先除其國伏惟皇帝崇德旌庸興亡繼絶聞鼓鼙而思將帥畫雲臺而念舊臣豈有功存社稷而無後可守事盡忠貞而無祠可祭周於蕃屏為約事在世功漢以山河為誓義存長久臣聞存人之國大於救人之災立人之後重於封人之墓竊以殷朝繼及無廢小宗周室興亡貴存身後紹高密者纍葉豈專鄧禹之正胤嗣平陽者重世何必曹參之嫡孫愚謂生有其勞死非王事雖在支庶並聽承襲幸使伯有之魂不能為厲若敖之鬼其無餒而幽顯對揚人神咫尺藝文類聚五十一
